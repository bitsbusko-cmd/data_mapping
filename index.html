 the Chorus PECI dictionary – the final confirmation is a PECI file from the PL tenant.","W każdej zmianie pracownika (element Effective_Change).":"In every change of the worker (Effective_Change element).","W nagłówku każdego pliku (raz na plik i grupę płacową).":"In the header of every file (once per file and pay group).","W próbkach PECI":"In PECI samples","Wyróżnione – wystąpiły w próbkach przy tej danej. Najedź, aby zobaczyć znaczenie.":"Highlighted – observed in samples for this data. Hover to see the meaning.","Zapis w PECI":"Notation in PECI","Zawsze przy:":"Always on:","Zdarzenia w próbkach":"Events in samples","brak w próbkach":"not in samples","długość w próbkach: {a} zn.":"length in samples: {a} chars","element bez wartości (kontener)":"element without a value (container)","kształt wartości: A/a – litera, 9 – cyfra; dane osobowe z próbek zamaskowane":"value shape: A/a – letter, 9 – digit; personal data from samples masked","nagłówek pliku":"file header","scenariusze próbek: {l}":"sample scenarios: {l}","tylko sekcje, które się zmieniły":"only sections that changed","tylko zmienione sekcje":"only changed sections","w próbkach: {n} scen.":"in samples: {n} scen.","wartości zamaskowane":"values masked","wielokrotne":"multiple","pojedyncze":"single","wszystkie włączone sekcje":"all enabled sections","zakres Chorus: {s}":"Chorus scope: {s}","Data zdarzenia (Effective_Moment)":"Event date (Effective_Moment)","Sekcje w pliku":"Sections in the file","Ścieżka XML":"XML path","Typ techniczny":"Technical type","Długość w próbkach":"Length in samples","Wartości w próbkach":"Values in samples","Wielokrotne":"Multiple","priorValue w próbkach":"priorValue in samples","Sekcja zawsze w pliku przy":"Section always in the file on","Element nie wystąpił w próbkach PECI projektu – typ i zapis według słownika. Do potwierdzenia na pliku PECI z tenanta PL.":"The element did not occur in the project's PECI samples – type and notation per the dictionary. To be confirmed on a PECI file from the PL tenant.","Element może wystąpić wiele razy. Gdy zmieni się jedno wystąpienie, PECI wysyła wszystkie.":"The element can occur several times. When one instance changes, PECI sends all of them.","Sekcja: wszystkie wartości w sekcji są nowe. Pole: wartość jest nowa.":"Section: all values in the section are new. Field: the value is new.","Sekcja: wartość pola została dodana, zmieniona albo usunięta. Nie występuje na poziomie pola.":"Section: a field value was added, updated or deleted. Not used at field level.","Sekcja: wszystkie wartości w sekcji usunięto. Pole: wartość usunięta.":"Section: all values in the section were deleted. Field: the value was deleted.","Pole: wartość zmieniona – obok nowej wartości przychodzi poprzednia. Nie występuje na poziomie sekcji.":"Field: the value was updated – the prior value is sent with the new one. Not used at section level.","Wartość logiczna":"Boolean","Liczba dziesiętna":"Decimal number","Tekst z cyfr":"Digit string","Atrybut XML":"XML attribute","1 = tak, 0 = nie":"1 = yes, 0 = no","cyfry, bez separatorów":"digits, no separators","kropka dziesiętna, bez separatora tysięcy":"decimal point, no thousands separator","kod bez spacji, wielkość liter ma znaczenie":"code without spaces, case-sensitive","tekst – nie konwertować na liczbę":"text – do not convert to a number","wiodące zera – nie konwertować na liczbę":"leading zeros – do not convert to a number","32 znaki 0-9a-f":"32 characters 0-9a-f","element złożony":"complex element","wiele wystąpień":"multiple instances","1 / wartość":"1 / value","Data rozpoczęcia pierwotnej nieobecności":"Start date of the original leave","Data skuteczności zmiany":"Effective date of the change","Pierwszy dzień nieobecności":"First day of leave","Dzień powrotu":"Day of return","Data zmiany stanowiska":"Position change date","Data przypisania do nowej grupy płacowej":"Pay group reassignment date","Pierwszy dzień po powrocie do pracy":"First day back at work","Data rozwiązania + 1 dzień":"Termination date + 1 day","RRRR-MM-DD±hh:mm":"YYYY-MM-DD±hh:mm","RRRR-MM-DDThh:mm:ss.sss±hh:mm":"YYYY-MM-DDThh:mm:ss.sss±hh:mm","kształt wartości":"value shape","Architektura integracji":"Integration architecture","Bazy produkcyjne pracodawców":"Employer production databases","Plik PECI":"PECI file","Przepływ danych: Workday PECI → SFTP → baza pośrednicząca Xpertis → bazy produkcyjne pracodawców":"Data flow: Workday PECI → SFTP → Xpertis staging database → employer production databases","SFTP":"SFTP","Transport":"Transport","Zatrudnienie osoby, która wcześniej pracowała w Grupie (Is_Rehire = 1). PECI wysyła pełny zestaw danych jak w P01 – poniżej tylko elementy, które odróżniają ten proces.":"Hire of a person who previously worked in the Group (Is_Rehire = 1). PECI sends the full data set as in P01 – below only the elements that distinguish this process.","Zmiana stanu cywilnego.":"Change of marital status.","Zmiana pracodawcy w ramach Grupy (internal mobility) połączona ze zmianą grupy płacowej. W Workday jeden proces Change Job; w PECI dwa zdarzenia: PCO w grupie płacowej dotychczasowej spółki i PCI w grupie nowej spółki. PCI niesie pełny zestaw danych jak w P01 – poniżej elementy specyficzne dla przeniesienia.":"Change of employer within the Group (internal mobility) combined with a change of pay group. In Workday one Change Job process; in PECI two events: PCO in the pay group of the current company and PCI in the pay group of the new company. PCI carries the full data set as in P01 – below the elements specific to the transfer.","Anulowanie i ponowne zatrudnienie z inną datą przychodzi jako para HIR-R + HIR.":"Rescind and re-hire with another date arrive as a HIR-R + HIR pair.","Zmiana daty rozwiązania na późniejszą przychodzi jako TERM-R + TERM.":"Moving the termination date later arrives as TERM-R + TERM.","Najczęstszy kod – rodzaj zmiany wynika z sekcji, które przyszły w pliku.":"The most frequent code – the kind of change follows from the sections that arrived in the file.","W próbce PECI zdarzenie nie zawiera przyczyny ani trybu zakończenia u dotychczasowego pracodawcy.":"In the PECI sample the event contains no reason or mode of ending employment with the current employer.","Kanał SFTP":"SFTP channel","Workday generuje plik PECI w formacie XML i może dostarczyć go na serwer SFTP; szyfrowanie PGP jest opcją dostarczenia.":"Workday generates the PECI file as XML and can deliver it to an SFTP server; PGP encryption is a delivery option.","Nagłówek Summary wskazuje spółkę płacową i grupę płacową, których dotyczy plik (Payroll_Company_Code, Pay_Group_Code).":"The Summary header names the payroll company and pay group the file relates to (Payroll_Company_Code, Pay_Group_Code).","Gdzie działa serwer SFTP i kto inicjuje przesył: Workday wysyła plik czy Xpertis go pobiera?":"Where does the SFTP server run and who initiates the transfer: does Workday push the file or does Xpertis pull it?","Uwierzytelnianie (klucze SSH), szyfrowanie PGP, adresy do dopuszczenia w zaporze.":"Authentication (SSH keys), PGP encryption, addresses to allow in the firewall.","Katalogi (przychodzące, archiwum, odrzucone) i wzorzec nazwy pliku.":"Folders (incoming, archive, rejected) and the file name pattern.","Jeden plik na grupę płacową czy jeden plik zbiorczy na uruchomienie?":"One file per pay group or one combined file per run?","Harmonogram i kompletność plików":"Schedule and completeness of files","Każde uruchomienie obejmuje zmiany wprowadzone w Workday w oknie Updated_From – Updated_To.":"Each run covers changes entered in Workday within the Updated_From – Updated_To window.","Nagłówek ma okres płacowy (Pay_Period_Start / End), zakres dat skuteczności (Effective_From / To) i liczbę pracowników w pliku (Worker_Count).":"The header holds the pay period (Pay_Period_Start / End), the effective date range (Effective_From / To) and the number of workers in the file (Worker_Count).","Znaczniki First_Primary_Run_of_Pay_Period i Ad_Hoc_Run odróżniają przebieg główny okresu od dodatkowego.":"The First_Primary_Run_of_Pay_Period and Ad_Hoc_Run flags distinguish the main run of the period from an additional one.","Jak często Workday ma generować plik: codziennie, kilka razy w okresie, przed zamknięciem listy płac?":"How often should Workday generate the file: daily, several times per period, before payroll close?","Jak baza pośrednicząca wykryje brak pliku albo lukę między oknami zmian (Updated_From różne od poprzedniego Updated_To)?":"How will the staging database detect a missing file or a gap between change windows (Updated_From different from the previous Updated_To)?","Czy Worker_Count ma służyć do kontroli kompletności wczytania?":"Should Worker_Count be used to check that loading was complete?","Kto i jak dostaje alert, gdy plik nie dotrze?":"Who gets an alert, and how, when a file does not arrive?","Rejestr plików i ponowne przetworzenie":"File registry and reprocessing","Integration_Event (WID) jednoznacznie identyfikuje uruchomienie integracji, a Integration_Sent_On to moment wygenerowania pliku.":"Integration_Event (WID) uniquely identifies the integration run, and Integration_Sent_On is the moment the file was generated.","Integrację można uruchomić ponownie, np. po błędzie – te same zmiany mogą przyjść drugi raz.":"The integration can be launched again, e.g. after an error – the same changes may arrive a second time.","Czy baza pośrednicząca prowadzi rejestr przetworzonych plików i blokuje podwójne przetworzenie?":"Does the staging database keep a registry of processed files and block double processing?","Co zrobić, gdy ta sama zmiana pracownika przyjdzie ponownie: pominąć, nadpisać, zgłosić?":"What to do when the same worker change arrives again: skip, overwrite, report?","Jak długo przechowywać oryginalne pliki (archiwum, audyt)?":"How long to keep the original files (archive, audit)?","Struktura pliku i model bazy pośredniczącej":"File structure and the staging data model","Hierarchia pliku: Summary → pracownik (Worker_Summary) → zmiany (Effective_Change z atrybutem Sequence) → sekcje (Worker_Status, Personal, Position …).":"File hierarchy: Summary → worker (Worker_Summary) → changes (Effective_Change with the Sequence attribute) → sections (Worker_Status, Personal, Position …).","Zmiana zawiera tylko sekcje, których dotyczy; przy HIR, ORG i PCI – wszystkie włączone sekcje.":"A change contains only the sections it affects; on HIR, ORG and PCI – all enabled sections.","Czy baza pośrednicząca przechowuje surowy XML, tabele odpowiadające sekcjom PECI, czy od razu model Xpertis?":"Does the staging database store the raw XML, tables mirroring the PECI sections, or the Xpertis model straight away?","Jak przechowywać historię zmian pracownika (wersje, daty skuteczności)?":"How to store the history of worker changes (versions, effective dates)?","Technologia: baza danych, narzędzie do wczytywania i harmonogram zadań.":"Technology: database, loading tool and job scheduler.","Sekcje i pola mają atrybuty isAdded, isUpdated, isDeleted; przy części pól przychodzi priorValue – wartość sprzed zmiany.":"Sections and fields carry the isAdded, isUpdated, isDeleted attributes; some fields come with priorValue – the value before the change.","Zmiana elementu powtarzalnego (np. adresu) może przyjść jako isDeleted dla starego wystąpienia i isAdded dla nowego.":"A change of a repeating element (e.g. an address) can arrive as isDeleted for the old instance and isAdded for the new one.","Czy Xpertis potrzebuje wartości poprzednich (priorValue), np. do korekt i historii?":"Does Xpertis need the prior values (priorValue), e.g. for corrections and history?","Jak interpretować isDeleted: zamknięcie rekordu z datą czy usunięcie?":"How to interpret isDeleted: closing the record with a date or deleting it?","Czy baza pośrednicząca ma porównywać dane z Xpertis, czy opierać się na atrybutach zmian z PECI?":"Should the staging database compare data with Xpertis, or rely on the PECI change attributes?","Kolejność i data skuteczności zmian":"Order and effective date of changes","Każda zmiana ma Effective_Moment (od kiedy obowiązuje) i Entry_Moment (kiedy wprowadzono ją w Workday); Sequence wyznacza kolejność zmian pracownika w pliku.":"Each change has Effective_Moment (when it takes effect) and Entry_Moment (when it was entered in Workday); Sequence sets the order of a worker’s changes in the file.","Data zdarzenia zależy od kodu – np. przy TERM to data rozwiązania + 1 dzień (Dokumentacja PECI → Zdarzenia).":"The event date depends on the code – e.g. for TERM it is the termination date + 1 day (PECI documentation → Events).","Daty mają przesunięcie strefy czasowej tenanta (np. 2026-01-01-08:00) – to nie jest godzina.":"Dates carry the tenant time zone offset (e.g. 2026-01-01-08:00) – it is not a time of day.","Czy ładować zmiany ściśle w kolejności Sequence i Effective_Moment?":"Should changes be loaded strictly in Sequence and Effective_Moment order?","Jak Xpertis przyjmuje zmiany wsteczne i zmiany z przyszłą datą?":"How does Xpertis accept retroactive and future-dated changes?","Którą datę Xpertis traktuje jako datę skuteczności operacji?":"Which date does Xpertis use as the effective date of the operation?","Korekty i anulowania mają osobne kody zdarzeń (HIR-C, HIR-R, TERM-C, TERM-R, LOA-C, LOA-R, RFL-R).":"Corrections and rescinds have their own event codes (HIR-C, HIR-R, TERM-C, TERM-R, LOA-C, LOA-R, RFL-R).","Transaction_Log niesie znaczniki korekty i powiązanie ze zdarzeniem pierwotnym (is_Corrected_Event, Original_Event).":"Transaction_Log carries correction flags and the link to the original event (is_Corrected_Event, Original_Event).","Jak Xpertis odwraca albo koryguje operację już załadowaną (np. anulowane zatrudnienie, cofnięte rozwiązanie)?":"How does Xpertis reverse or correct an operation already loaded (e.g. a rescinded hire, a reversed termination)?","Co, gdy korekta dotyczy okresu z zamkniętą listą płac?":"What if a correction concerns a period with a closed payroll?","Identyfikacja pracownika":"Worker identification","Worker_Summary: WID – techniczny, niezmienny identyfikator Workday; Employee_ID – numer pracownika w Workday (w próbkach: litera i 7 cyfr).":"Worker_Summary: WID – the permanent technical Workday identifier; Employee_ID – the worker number in Workday (in samples: a letter and 7 digits).","Identyfikatory krajowe (np. PESEL) są w sekcji Person_Identification (proces P08).":"National identifiers (e.g. PESEL) are in the Person_Identification section (process P08).","Jak Xpertis identyfikuje pracownika w bazie pracodawcy i kto nadaje ten identyfikator?":"How does Xpertis identify a worker in the employer database, and who assigns that identifier?","Gdzie i kto prowadzi powiązanie Employee_ID ↔ identyfikator Xpertis?":"Where, and by whom, is the Employee_ID ↔ Xpertis identifier link maintained?","Jak powiązać pracowników, którzy już są w Xpertis, z ich Employee_ID z Workday?":"How to link workers already in Xpertis with their Employee_ID from Workday?","Routing do baz pracodawców":"Routing to employer databases","Nagłówek Summary ma Payroll_Company_Code i Pay_Group_Code; sekcja Position wskazuje organizacje pracownika, w tym spółkę (Company).":"The Summary header has Payroll_Company_Code and Pay_Group_Code; the Position section names the worker’s organisations, including the company.","Ile jest baz produkcyjnych i jaka dana wskazuje bazę: spółka płacowa, grupa płacowa czy inna?":"How many production databases are there, and which data item points to the database: payroll company, pay group or another?","Czy jeden pracodawca może mieć kilka grup płacowych?":"Can one employer have several pay groups?","Kto utrzymuje tabelę routingu i jak trafia do niej nowa spółka?":"Who maintains the routing table, and how does a new company get into it?","Przeniesienia między pracodawcami":"Transfers between employers","Przeniesienie do innej spółki: PCO w grupie płacowej dotychczasowej spółki i PCI w grupie nowej; PCI niesie pełny zestaw danych jak HIR (proces P27).":"Transfer to another company: PCO in the pay group of the current company and PCI in the pay group of the new one; PCI carries the full data set like HIR (process P27).","Zmiana grupy płacowej w tej samej spółce: PGO + PGI (proces P28).":"Change of pay group within the same company: PGO + PGI (process P28).","Jak Xpertis obsługuje przejście: zakończenie w jednej bazie i zatrudnienie w drugiej? Jakie dane przenosi?":"How does Xpertis handle the move: ending in one database and hiring in another? What data does it carry over?","W jakiej kolejności przetwarzać PCO i PCI, jeśli przyjdą w różnych plikach?":"In which order to process PCO and PCI if they arrive in different files?","Kilka zatrudnień jednej osoby":"Several jobs of one person","Pracownik może mieć kilka pozycji (Position) – główną i dodatkowe; każda ma własny Position_ID (proces P18).":"A worker can hold several positions (Position) – a primary and additional ones; each has its own Position_ID (process P18).","Czy Xpertis obsługuje kilka umów jednej osoby u tego samego pracodawcy?":"Does Xpertis support several contracts of one person with the same employer?","Jak powiązać pozycję z Workday z umową w Xpertis?":"How to link a Workday position with a contract in Xpertis?","Formaty i typy danych":"Formats and data types","PECI wysyła daty xs:date z przesunięciem strefy (RRRR-MM-DD±hh:mm), momenty xs:dateTime, wartości logiczne 1/0, liczby z kropką dziesiętną, tekst UTF-8 i identyfikatory z wiodącymi zerami.":"PECI sends xs:date dates with a zone offset (YYYY-MM-DD±hh:mm), xs:dateTime moments, 1/0 booleans, numbers with a decimal point, UTF-8 text and identifiers with leading zeros.","Słownik PECI nie podaje maksymalnych długości tekstu; długości z próbek pokazuje karta danej.":"The PECI dictionary gives no maximum text lengths; the data card shows lengths seen in samples.","Jakie formaty przyjmuje Xpertis: daty, kwoty, liczby, wartości logiczne?":"Which formats does Xpertis accept: dates, amounts, numbers, booleans?","Kodowanie znaków i długości pól w Xpertis – co, gdy wartość jest dłuższa?":"Character encoding and field lengths in Xpertis – what if a value is longer?","Czy konwersję typów robi baza pośrednicząca, czy mechanizm ładowania Xpertis?":"Is type conversion done by the staging database or by the Xpertis loading mechanism?","Kody i mapowanie wartości":"Codes and value mapping","Pola kodowe przychodzą jako Reference ID z Workday albo jako wartość z mapy integracyjnej (Mapped_Value), jeśli Workday ją skonfiguruje.":"Code fields arrive as a Workday Reference ID or as a value from an integration map (Mapped_Value), if Workday configures one.","Część pól jest w konfiguracji PECI Chorus oznaczona jako mapowana (Field Mapped) – pokazuje to karta danej.":"Some fields are marked as mapped (Field Mapped) in the Chorus PECI configuration – the data card shows this.","Gdzie tłumaczyć kody Workday na kody Xpertis: w Workday (mapy integracyjne) czy w bazie pośredniczącej (tabele słownikowe)?":"Where to translate Workday codes into Xpertis codes: in Workday (integration maps) or in the staging database (lookup tables)?","Kto utrzymuje słowniki i jak zgłaszać nowe wartości?":"Who maintains the lookups, and how are new values reported?","Co, gdy przyjdzie kod bez odpowiednika w Xpertis?":"What if a code arrives with no counterpart in Xpertis?","Dane, których nie ma w PECI":"Data that PECI does not carry","Sekcja Additional_Information przenosi pola niestandardowe i wyliczane zdefiniowane w konfiguracji PECI.":"The Additional_Information section carries custom and calculated fields defined in the PECI configuration.","Inne możliwości: osobny raport z Workday tym samym kanałem SFTP albo wprowadzanie danych w Xpertis.":"Other options: a separate Workday report over the same SFTP channel, or entering the data in Xpertis.","Jakich danych Xpertis potrzebuje, a PECI ich nie wysyła? Lista per proces – zakładka „Dane spoza PECI”.":"Which data does Xpertis need that PECI does not send? A list per process – the “Data outside PECI” tab.","Które źródło wybrać dla każdej z nich i kto za nie odpowiada?":"Which source to choose for each of them, and who is responsible?","PECI przesyła dane pracowników z odwołaniami do obiektów organizacyjnych (spółka, MPK, lokalizacja, stanowisko, grupa płacowa), ale nie przesyła samych słowników organizacyjnych.":"PECI sends worker data with references to organisational objects (company, cost centre, location, job, pay group) but not the organisational lists themselves.","Czy Xpertis potrzebuje słowników organizacyjnych (spółki, MPK, lokalizacje, stanowiska)?":"Does Xpertis need the organisational lists (companies, cost centres, locations, jobs)?","Skąd i jak często je aktualizować?":"Where from, and how often, should they be updated?","Zakres osób":"Population in scope","PECI obejmuje pracowników przypisanych do grup płacowych. Osób prowadzonych w Workday jako Contingent Worker (np. umowy cywilnoprawne) PECI nie obejmuje – Workday ma do tego osobny interfejs (WECI).":"PECI covers employees assigned to pay groups. People kept in Workday as Contingent Workers (e.g. civil-law contracts) are not in PECI – Workday has a separate interface for them (WECI).","Czy Xpertis obsługuje osoby spoza umów o pracę? Jeśli tak – skąd mają przychodzić ich dane?":"Does Xpertis handle people outside employment contracts? If so – where should their data come from?","Walidacja przed załadowaniem":"Validation before loading","Brak sekcji albo elementu w pliku oznacza brak zmiany albo brak danych w Workday – nie wartość pustą.":"A missing section or element in the file means no change or no data in Workday – not an empty value.","Jakie reguły walidacji stosuje baza pośrednicząca (dane wymagane, formaty, sumy kontrolne np. PESEL, rachunek)?":"Which validation rules does the staging database apply (required data, formats, checksums e.g. PESEL, bank account)?","Co blokuje cały plik, a co tylko jednego pracownika albo jedną zmianę?":"What blocks the whole file, and what only one worker or one change?","Poprawka wprowadzona w Workday przyjdzie w kolejnym pliku jako nowa zmiana albo korekta.":"A fix entered in Workday arrives in the next file as a new change or a correction.","Kto obsługuje błędy: zespół Xpertis, dział płac, kadry?":"Who handles errors: the Xpertis team, payroll, HR?","Jak poprawiać błąd: w Workday (poprawka w kolejnym pliku) czy ręcznie w bazie pośredniczącej?":"How to fix an error: in Workday (fix in the next file) or by hand in the staging database?","Jak ponowić przetworzenie i jak je udokumentować?":"How to rerun processing and document it?","Informacja zwrotna i monitoring":"Feedback and monitoring","PECI przesyła dane w jedną stronę – z Workday do systemu płacowego.":"PECI sends data one way – from Workday to the payroll system.","Czy wynik przetworzenia (sukces, błędy) ma wracać do Workday albo do zespołu kadr? W jakiej formie: raport, e-mail, plik przez SFTP?":"Should the processing result (success, errors) go back to Workday or to the HR team? In what form: report, e-mail, file over SFTP?","Kto monitoruje przebieg i w jakim czasie reaguje na błąd?":"Who monitors the runs, and how quickly do they react to an error?","Mechanizm ładowania":"Loading mechanism","Jak dane trafiają do baz produkcyjnych: import plikowy, procedury bazodanowe, interfejs programistyczny Xpertis?":"How does data reach the production databases: file import, database procedures, an Xpertis API?","Czy ładowanie ma być automatyczne, czy z zatwierdzeniem przez użytkownika?":"Should loading be automatic, or approved by a user?","Czy operacje kadrowe w Xpertis (np. przyjęcie, aneks, zwolnienie) mają własną logikę, którą trzeba wywołać zamiast zapisu do tabel?":"Do HR operations in Xpertis (e.g. hire, amendment, dismissal) have their own logic that must be called instead of writing to tables?","Okna ładowania i zamknięte okresy":"Loading windows and closed periods","Nagłówek wskazuje okres płacowy (Pay_Period_Start / End); zmiany wsteczne mogą dotyczyć okresów już rozliczonych.":"The header gives the pay period (Pay_Period_Start / End); retroactive changes can affect periods already settled.","Kiedy wolno ładować dane (godziny, blokady w trakcie naliczania listy płac)?":"When may data be loaded (hours, locks while payroll is being calculated)?","Co ze zmianą wsteczną do okresu z zamkniętą listą płac: korekta automatyczna czy zadanie dla działu płac?":"What about a retroactive change to a period with a closed payroll: automatic correction or a task for payroll?","Działania uruchamiane w Xpertis":"Follow-up actions in Xpertis","Czy załadowanie zmiany ma uruchamiać w Xpertis dalsze działania (np. zgłoszenia, przeliczenia)? Kto je zatwierdza?":"Should loading a change trigger further actions in Xpertis (e.g. filings, recalculations)? Who approves them?","Dane osobowe i dane szczególne":"Personal and special category data","PECI zawiera dane osobowe: identyfikatory krajowe, adresy, rachunki bankowe, członków rodziny. Karta danej pokazuje klasyfikację z projektu.":"PECI contains personal data: national identifiers, addresses, bank accounts, family members. The data card shows the project classification.","W próbkach są też dane szczególne (np. Religion); zakres sekcji i pól ustala konfiguracja PECI.":"Samples also contain special category data (e.g. Religion); the scope of sections and fields is set by the PECI configuration.","Których danych Xpertis nie potrzebuje i można je wyłączyć w konfiguracji PECI?":"Which data does Xpertis not need, so it can be switched off in the PECI configuration?","Szyfrowanie w transporcie i w bazie pośredniczącej, uprawnienia, rejestr dostępu.":"Encryption in transit and in the staging database, permissions, access log.","Jak długo przechowywać pliki i dane w bazie pośredniczącej? Udział IOD.":"How long to keep files and data in the staging database? Involvement of the DPO.","Środowiska i pliki testowe":"Environments and test files","Typy i przykłady w tym narzędziu pochodzą z próbek PECI innych krajów – ostatecznym potwierdzeniem jest plik PECI z tenanta PL.":"Types and examples in this tool come from PECI samples of other countries – the final confirmation is a PECI file from the PL tenant.","Jakie środowiska (test, produkcja) mają Workday i Xpertis i jak je połączyć?":"Which environments (test, production) do Workday and Xpertis have, and how are they connected?","Kiedy będzie plik PECI z tenanta PL i jakie scenariusze ma obejmować?":"When will a PECI file from the PL tenant be available, and which scenarios should it cover?","Dane testowe: zanonimizowane czy rzeczywiste?":"Test data: anonymised or real?","Stan początkowy i pierwsze załadowanie":"Initial state and first load","Nagłówek ma znacznik Full_Snapshot – PECI może wysłać pełny obraz danych zamiast samych zmian.":"The header has a Full_Snapshot flag – PECI can send a full data snapshot instead of changes only.","Czy pracownicy już są w Xpertis (migracja), czy pierwsze załadowanie ma przyjść z Workday?":"Are workers already in Xpertis (migration), or should the first load come from Workday?","Jak uzgodnić stan Xpertis z Workday w dniu uruchomienia i od którego pliku zaczynają się zmiany?":"How to reconcile Xpertis with Workday on go-live day, and from which file do changes start?","Odpowiedzialność i utrzymanie":"Ownership and support","Kto jest właścicielem bazy pośredniczącej i jej elementów: kanału, słowników, routingu, kolejki wyjątków?":"Who owns the staging database and its parts: channel, lookups, routing, exception queue?","Czas reakcji na brak pliku i błędy; ścieżka eskalacji między Workday, Xpertis i Saint-Gobain.":"Response time for a missing file and errors; escalation path between Workday, Xpertis and Saint-Gobain.","Odbiór pliku":"File reception","Wczytanie i struktura danych":"Loading and data structure","Identyfikacja i routing":"Identification and routing","Konwersja na standard Xpertis":"Conversion to the Xpertis standard","Walidacja i wyjątki":"Validation and exceptions","Ładowanie do baz produkcyjnych":"Loading into production databases","Bezpieczeństwo i RODO":"Security and GDPR","Testy, uruchomienie i utrzymanie":"Testing, go-live and support","Plik PECI i odbiór pliku":"The PECI file and file reception","Wspólne zrozumienie pliku PECI: budowa, typy danych, zdarzenia, nagłówek. Kanał SFTP i harmonogram.":"A shared understanding of the PECI file: structure, data types, events, header. SFTP channel and schedule.","Wejście do pracy":"Joining","Czego Xpertis potrzebuje przy zatrudnieniu, ponownym zatrudnieniu i korektach. Identyfikacja pracownika i routing do bazy pracodawcy.":"What Xpertis needs on hire, rehire and corrections. Worker identification and routing to the employer database.","Zmiany danych osobowych, dokumentów, adresów, rachunku i rodziny. Minimalizacja danych.":"Changes of personal data, documents, addresses, bank account and family. Data minimisation.","Zatrudnienie, organizacja i wynagrodzenie":"Employment, organisation and pay","Zmiany stanowiska, umowy, kosztów i wynagrodzenia. Kody i mapowanie wartości.":"Changes of job, contract, cost allocation and pay. Codes and value mapping.","Nieobecności, wyjście i przeniesienia":"Leave, leaving and transfers","Nieobecności długotrwałe, rozwiązanie umowy, korekty i przeniesienia między pracodawcami.":"Long-term leave, termination, corrections and transfers between employers.","Projekt bazy pośredniczącej":"Staging database design","Model danych, konwersja, walidacja, wyjątki, ładowanie do baz produkcyjnych, bezpieczeństwo, testy i uruchomienie.":"Data model, conversion, validation, exceptions, loading into production databases, security, testing and go-live.","(miejsce w Xpertis do uzupełnienia)":"(place in Xpertis to be completed)","Adresat pytania":"Question addressee","Adresat:":"Addressee:","Analiza PECI → Xpertis":"PECI → Xpertis analysis","Analiza Xpertis":"Xpertis analysis","Analiza integracji Workday PECI → Xpertis":"Workday PECI → Xpertis integration analysis","Analiza integracji Workday PECI → Xpertis (Polska)":"Workday PECI → Xpertis integration analysis (Poland)"," · analiza":" · analysis","Workday (Chorus) · baza pośrednicząca · Xpertis":"Workday (Chorus) · staging database · Xpertis","Nawigacja":"Navigation","Karta danej":"Data card","Analiza zatwierdzona przez wszystkie strony":"Analysis signed off by all parties","Baza pośrednicząca i bazy produkcyjne pracodawców":"Staging database and employer production databases","Baza pośrednicząca jej nie ładuje":"The staging database does not load it","Baza pośrednicząca nie ładuje tej danej do Xpertis. Jeśli nie potrzebuje jej żaden odbiorca, można ją wyłączyć z pliku PECI (minimalizacja danych).":"The staging database does not load this data into Xpertis. If no recipient needs it, it can be switched off in the PECI file (data minimisation).","Baza pośrednicząca – wyliczenie lub tabela":"Staging database – calculation or table","Bez miejsca w Xpertis":"No place in Xpertis","Brak danych dla wybranego filtra.":"No data for the selected filter.","Brak pytań dla wybranego filtra.":"No questions for the selected filter.","Brak pytań. Pytania zadane przy danych tego procesu też trafiają tutaj.":"No questions. Questions asked on this process's data also appear here.","Brakuje elementu PECI?":"Missing a PECI element?","Budowa pliku, typy danych, zdarzenia i katalog pól – wspólna wiedza na start.":"File structure, data types, events and the field catalogue – shared knowledge to start with.","Co i jak wysyła Workday – wspólna wiedza na start warsztatów. Źródła: dokumentacja Workday, słownik PECI Chorus i próbki PECI projektu.":"What Workday sends and how – shared knowledge to start the workshops. Sources: Workday documentation, the Chorus PECI dictionary and the project's PECI samples.","Co ten proces oznacza w Xpertis? Jakie operacje baza pośrednicząca wykonuje w bazie produkcyjnej pracodawcy?":"What does this process mean in Xpertis? Which operations does the staging database perform in the employer's production database?","Co ustalono z zespołem Xpertis – trafi do eksportu jako specyfikacja bazy pośredniczącej":"What was agreed with the Xpertis team – goes into the export as the staging database specification","Co wiemy z PECI":"What we know from PECI","Co wysyła Workday":"What Workday sends","Cofnij „odbyty”":"Undo “held”","Czy Xpertis potrzebuje tej danej?":"Does Xpertis need this data?","Dana jest w PECI, ale nie ma jej na liście procesu?":"Is the data in PECI but not on the process list?","Dana w PECI":"Data in PECI","Dane PECI":"PECI data","Dane spoza PECI":"Data outside PECI","Dane w tej przeglądarce wyczyszczone.":"Data in this browser cleared.","Dane z PECI":"Data from PECI","Dane z PECI przeanalizowane ({p}%)":"PECI data analysed ({p}%)","Dane, których Xpertis potrzebuje do tego procesu, a których nie ma w pliku PECI. Zespół Xpertis wpisuje je na warsztacie, a strony wybierają źródło: pole dodatkowe w PECI, osobny raport z Workday, wprowadzenie w Xpertis albo wyliczenie w bazie pośredniczącej.":"Data Xpertis needs for this process that is not in the PECI file. The Xpertis team enters it in the workshop, and the parties choose the source: an additional field in PECI, a separate Workday report, entry in Xpertis or a calculation in the staging database.","Data skuteczności i kolejność":"Effective date and order","Data zdarzenia w PECI":"Event date in PECI","Data zdarzenia: {d}":"Event date: {d}","Decyzja dla danej":"Decision for a data item","Dla każdej danej z PECI zespół Xpertis decyduje: potrzebna czy nie, gdzie trafia w Xpertis, w jakim formacie i z jaką konwersją. Do tego dane, których w PECI brakuje.":"For each PECI data item the Xpertis team decides: needed or not, where it goes in Xpertis, in which format and with which conversion. Plus the data PECI does not carry.","Do analizy":"To analyse","Do wyjaśnienia":"To clarify","Do wyjaśnienia <b>{n}<\/b>":"To clarify <b>{n}<\/b>","Dodaj daną spoza PECI":"Add data outside PECI","Dodaj do {p}":"Add to {p}","Dodaj go z katalogu pól PECI":"Add it from the PECI field catalogue","Dodaj ją z katalogu pól PECI":"Add it from the PECI field catalogue","Dodaj pytanie":"Add question","Dodane z katalogu pól PECI: {w}":"Added from the PECI field catalogue: {w}","Dodane z katalogu PECI":"Added from the PECI catalogue","Dodano pytanie {id}.":"Question {id} added.","Dodano {el} do {p}.":"{el} added to {p}.","Dodawaj do":"Add to","Dodał(a): {w}":"Added by: {w}","Dokumentacja PECI":"PECI documentation","Filtr":"Filter","Gdzie w Xpertis":"Where in Xpertis","Gdzie w Xpertis? – do uzupełnienia":"Where in Xpertis? – to complete","Inny zapis tej samej wartości, np. data, liczba, długość tekstu.":"A different notation of the same value, e.g. date, number, text length.","Jak czytać typy danych":"How to read data types","Jedna dana PECI dzielona na kilka pól Xpertis albo kilka danych łączonych w jedno.":"One PECI data item split into several Xpertis fields, or several items combined into one.","Jeszcze nie analizowano":"Not analysed yet","Kadry, płace i IT – właściciel procesów i danych":"HR, payroll and IT – owner of processes and data","Każda strona potwierdza, że analiza procesu jest kompletna. Otwarte sprawy zostają w pytaniach.":"Each party confirms the process analysis is complete. Open matters stay in the questions.","Kliknij wiersz, aby zobaczyć specyfikację PECI i opisać daną w Xpertis.":"Click a row to see the PECI specification and describe the data in Xpertis.","Kod Workday tłumaczony na kod Xpertis według tabeli.":"A Workday code translated into an Xpertis code using a table.","Kod zdarzenia (Derived_Event_Code) mówi, co się stało w Workday. Data zdarzenia i zestaw sekcji w pliku zależą od kodu.":"The event code (Derived_Event_Code) tells what happened in Workday. The event date and the set of sections in the file depend on the code.","Konwersja w bazie pośrednicz (function(){

const D = JSON.parse(document.getElementById('peci-data').textContent);
const EN = (() => { const n = document.getElementById('peci-en'); try { return n ? JSON.parse(n.textContent) : {}; } catch (e) { return {}; } })();

const pad2 = n => String(n).padStart(2, '0');
const pad3 = n => String(n).padStart(3, '0');
const nowIso = () => new Date().toISOString();
const ymd = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };

const fmtTs = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + hhmm(d); };
const fmtDate = v => { if (!v) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? m[3] + '.' + m[2] + '.' + m[1] : v; };
const isoDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : '';
const NS = 'peci-xa:';
const PREF_OLD = ['lang', 'name', 'team', 'theme', 'zoom'];
const lsGet = k => { try { const v = localStorage.getItem(NS + k); if (v != null) return v; return PREF_OLD.includes(k) ? localStorage.getItem('peci-xp:' + k) : null; } catch (e) { return null; } };

const Store = {
  db:null, exists:{}, local:{},
  use(name) {
    try { return IN_VIEWER ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }

  },
  startShared(db) {

      db.collection(c).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
        S.ov[c] = m; this.exists[c] = new Set(Object.keys(m)); schedule();
      }, err => {
        if (err && err.code === 'revoked') { S.canWrite = false; S.mode = 'readonly'; }

  },
  persist(c) { this.local[c] = S.ov[c]; lsSet('local', JSON.stringify(this.local)); },
  clearLocal() { this.local = {}; COLS.forEach(c => { this.local[c] = {}; S.ov[c] = {}; }); lsSet('local', '{}'); },

  async put(c, id, patch, full) {

      try { await this.retry(() => ref.update(patch)); return; }

function protocol(p) {
  const s = C.ps[p.id], pm = S.ov.procs[p.id] || {}, list = C.byProc[p.id] || [];
  const L = [];
  const head = t => { L.push(''); L.push(T(t).toUpperCase()); };
  L.push(T('ANALIZA PECI → XPERTIS') + ' · ' + p.id + ' ' + T(p.name));
  L.push(T('Data warsztatu: {d}', {d:fmtDate(pm.date) || '—'}) + ' · ' + T('Uczestnicy: {u}', {u:pm.people || '—'}));
  L.push(T('Stan: przeanalizowano {a} z {b} · potrzebne {c} · niepotrzebne {d} · do wyjaśnienia {e} · dane spoza PECI {f}', {a:s.done, b:s.n, c:s.need, d:s.skip, e:s.tbd, f:s.gaps}));
  PQ.forEach(q => { if (!blank(pm[q.k])) { head(q.t); L.push(pm[q.k]); } });
  const need = list.filter(e => e.need === 'Tak');
  if (need.length) { head('Dane z PECI potrzebne w Xpertis'); need.forEach(e => L.push('- ' + e.code + ' ' + e.el + ' → ' + (blank(e.xt) ? T('(miejsce w Xpertis do uzupełnienia)') : e.xt) + [e.xf, e.conv ? T('konwersja: {c}', {c:T(e.conv)}) : '', e.convNote].filter(v => !blank(v)).map(v => ' · ' + v).join(''))); }
  const skip = list.filter(e => e.need === 'Nie');
  if (skip.length) { head('Dane z PECI niepotrzebne w Xpertis'); L.push(skip.map(e => e.code + ' ' + e.el).join('; ')); }
  const tbd = list.filter(e => e.need === 'Do ustalenia');
  if (tbd.length) { head('Do wyjaśnienia'); tbd.forEach(e => L.push('- ' + e.code + ' ' + e.el + (blank(e.note) ? '' : ' – ' + e.note))); }
  const gs = C.gapsBy[p.id] || [];
  if (gs.length) { head('Dane spoza PECI'); gs.forEach(g => L.push('- ' + g.code + ' ' + (g.name || '—') + (blank(g.why) ? '' : ' (' + g.why + ')') + ' · ' + T('źródło: {s}', {s:T(g.src || 'Do ustalenia')}) + (g.own && PN[g.own] ? ' · ' + T('właściciel: {o}', {o:T(PN[g.own].n)}) : '') + ' · ' + T(g.st))); }
  const qo = (C.qByProc[p.id] || []).filter(q => q.st !== 'Zamknięte');
  if (qo.length) { head('Pytania otwarte'); qo.forEach(q => L.push('- ' + q.id + (q.to && PN[q.to] ? ' [' + T('do: {p}', {p:T(PN[q.to].n)}) + ']' : '') + ' ' + q.text + (blank(q.ans) ? '' : ' → ' + q.ans))); }
  if (!blank(pm.notes)) { head('Notatki z warsztatu'); L.push(pm.notes); }
  head('Zatwierdzenia');
  PARTIES.forEach(pt => { const sg = s.sign[pt.k]; L.push('- ' + T(pt.n) + ': ' + (sg && sg.at ? stampTxt(sg) : T('brak'))); });
  return L.join('\n');
}

function palResults(q) {
  q = lc(q.trim());
  if (!q) return PROC.map(p => ({g:T('Procesy'), k:p.id, l:esc(T(p.name)), s:T(p.grp), go:{t:'proc', id:p.id}})).concat(TOPICS.map(t => ({g:T('Baza pośrednicząca'), k:t.id, l:esc(T(t.title)), s:T(ABY[t.area]), go:{t:'topic', id:t.id}})));
  const out = [];
  const score = vals => { let best = 0; vals.forEach((v, i) => { const s = lc(v); if (!s) return; if (s === q) best = Math.max(best, 100 - i); else if (s.indexOf(q) === 0) best = Math.max(best, 80 - i); else if (s.includes(q)) best = Math.max(best, 50 - i); }); return best; };
  C.all.map(e => ({e, sc:score([e.code, e.el, e.xt, T(e.desc), e.sec, e.sp ? e.sp.els.map(x => x.n).join(' ') : ''].concat(LANG === 'en' ? [e.desc] : []))})).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 14)
    .forEach(({e}) => out.push({g:T('Dane PECI'), k:e.code, l:hlq(e.el, q) + (e.need ? ' <span class="faint">· ' + esc(T(STATE[e.state][0])) + '</span>' : ''), s:(PBY[e.p] ? T(PBY[e.p].name) : '') + (blank(e.desc) ? '' : ' · ' + T(e.desc)), go:{t:'el', key:e.key}}));
  PROC.filter(p => [p.id, p.name, p.bp, p.events].some(v => sx(v).includes(q))).slice(0, 6).forEach(p => out.push({g:T('Procesy'), k:p.id, l:hlq(T(p.name), q), s:T(p.grp), go:{t:'proc', id:p.id}}));
  TOPICS.filter(t => [t.id, t.title].concat(t.facts, t.qs).some(v => sx(v).includes(q))).slice(0, 6).forEach(t => out.push({g:T('Baza pośrednicząca'), k:t.id, l:hlq(T(t.title), q), s:T(ABY[t.area]), go:{t:'topic', id:t.id}}));
  C.qs.filter(x => [x.id, x.text, x.ans].some(v => sx(v).includes(q))).slice(0, 6).forEach(x => out.push({g:T('Pytania'), k:x.id, l:hlq(String(x.text).slice(0, 150), q), s:T(x.st), go:{t:'q', id:x.id}}));
  return out;
}

function applyHash(h) {

  if (TBY[h]) { S.view = 'stage'; S.topic = h; S.sel = null; return; }

}

const APP_ID = 'peci-xpertis-analiza';
function exportState() {

function newer(a, b) { const t = x => String((x && x.upd && x.upd.at) || (x && x.at) || ''); return t(b) > t(a); }
function mergeParties(a, b) { const o = Object.assign({}, a || {}); Object.keys(b || {}).forEach(k => { const x = o[k], y = b[k]; if (!x || (y && String(y.at || '') > String(x.at || ''))) o[k] = y; }); return o; }
function importState(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let body; try { body = JSON.parse(rd.result); } catch (e) { toast(T('To nie jest plik ustaleń (niepoprawny JSON).')); return; }
    if (body && body.app === 'peci-xpertis-uzgodnienia') { toast(T('To plik z poprzedniej wersji narzędzia (uzgadnianie propozycji mapowania). Nowa analiza zaczyna się od zera – tego pliku nie można wczytać.')); return; }
    if (!body || body.app !== APP_ID || !isObj(body.data)) { toast(T('To nie jest plik ustaleń tego narzędzia.')); return; }
    let added = 0, updated = 0;
    COLS.forEach(c => {
      const inc = isObj(body.data[c]) ? body.data[c] : {}; const cur = Object.assign({}, S.ov[c]);
      Object.keys(inc).forEach(id => {
        const a = cur[id], b = inc[id]; if (!isObj(b)) return;
        if (!a) { cur[id] = b; added++; return; }
        const r = newer(a, b) ? merge(a, b) : merge(b, a);
        if (a.sign || b.sign) r.sign = mergeParties(a.sign, b.sign);
        if (JSON.stringify(r) !== JSON.stringify(a)) { cur[id] = r; updated++; }
      });
      S.ov[c] = cur; Store.persist(c);
    });
    S.savedAt = new Date();
    toast(T('Wczytano ustalenia{from}. Nowe wpisy: {a}, zaktualizowane: {u}.', {from:body.author ? T(' od: {a}', {a:body.author}) : '', a:added, u:updated}));
    schedule();
  };
  rd.readAsText(file);
}
