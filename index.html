  const pr = [['Proces', 'Nazwa', 'Status', 'Pola', 'Potwierdzone', 'Wymaga decyzji', 'Błędy', 'Ostrzeżenia', 'Bez źródła', 'Dopisane', 'Data warsztatu', 'Uczestnicy', 'Plik testowy', 'Ustalenia procesu', ...PARTIES.map(p => 'Akceptacja – ' + p.n)]];
  PROC.forEach(p => { const s = C.ps[p.id], pm = S.ov.procs[p.id] || {}; pr.push([p.id, p.name, s.status, s.active, s.conf, s.dec, s.e, s.w, s.cov.nosrc, s.adds, fmtDate(pm.date), pm.people || '', pm.test || '', pm.notes || '', ...PARTIES.map(pt => { const sg = s.sign[pt.k]; return sg && sg.at ? nm(sg.by, sg.nm) + ' ' + fmtTs(sg.at) + ((sg.e || sg.nosrc) ? ` (z zastrzeżeniem: ${sg.e} bł., ${sg.nosrc} braków)` : '') : ''; })]); });
  addSheet('Procesy', pr, [7, 34, 18, 7, 11, 11, 7, 10, 10, 9, 12, 30, 20, 40, 26, 26, 26, 26]);
  const iss = [['ID', 'Typ', 'Proces', 'Obszar', 'Opis', 'Propozycja integratora', 'Priorytet', 'Właściciel', 'Termin', 'Status', 'Rozwiązanie / decyzja', 'Zgłoszono', 'Zamknięto']];
  issuesAll().forEach(i => iss.push([i.id, i.type || '', i.proc || '', i.area || '', i.desc || '', i.prop || '', i.prio || '', i.owner || '', fmtDate(i.due), i.status || '', i.decision || '', i.opened || '', i.closed || '']));
  addSheet('Kwestie', iss, [7, 10, 10, 16, 50, 40, 9, 20, 11, 14, 40, 11, 11]);
  const dv = [['Słownik', 'Nazwa słownika', 'Kod Workday', 'Opis Workday', 'Znaczenie w Xpertis', 'Kod Xpertis', 'Baza Xpertis', 'Status', 'Komentarz']];
  DICTS.forEach(d => dictValues(d.id).forEach(v => dv.push([d.id, d.name, v.wd || '', v.wddesc || '', v.xpmean || '', v.xp || '', v.db || '', v.status || '', v.note || ''])));
  addSheet('Słowniki – wartości', dv, [8, 28, 28, 30, 30, 14, 14, 12, 30]);
  const cm = [['Proces', 'Pole', 'Strona', 'Autor', 'Data', 'Komentarz']];
  Object.keys(C.cmBy).forEach(k => { const e = C.byKey[k]; C.cmBy[k].forEach(c => cm.push([c.p || '', e ? e.code : k, c.team || '', nm(c.by, c.nm), fmtTs(c.at), c.text || ''])); });
  addSheet('Komentarze', cm, [7, 11, 22, 22, 16, 80]);
  const buf = X.write(wb, {bookType:'xlsx', type:'array'});
  saveFile(`PECI_Xpertis_uzgodnienia_${ymd()}.xlsx`, new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
const ymd = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
async function saveFile(name, blob) {
  if (S.dl) {
    try { await S.dl.save({filename:name, data:blob}); toast('Plik zapisany.'); }
    catch (err) { if (err && err.code === 'declined') return; toast('Nie zapisano pliku' + (err && err.code ? ' (' + err.code + ')' : '') + '.'); }
    return;
  }
  const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000);
}
function exportState() {
  const slug = (S.myName || S.team || 'stan').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const body = {app:'peci-xpertis-uzgodnienia', version:1, exportedAt:nowIso(), author:S.myName || '', team:S.team || '', data:S.ov};
  saveFile(`PECI_Xpertis_stan_${ymd()}_${slug || 'stan'}.json`, new Blob([JSON.stringify(body)], {type:'application/json'}));
}
function newer(a, b) { const t = x => String((x && x.upd && x.upd.at) || (x && x.at) || ''); return t(b) > t(a); }
function mergeParties(a, b) { const o = Object.assign({}, a || {}); Object.keys(b || {}).forEach(k => { const x = o[k], y = b[k]; if (!x || (y && String(y.at || '') > String(x.at || ''))) o[k] = y; }); return o; }
function importState(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let body; try { body = JSON.parse(rd.result); } catch (e) { toast('To nie jest plik stanu (niepoprawny JSON).'); return; }
    if (!body || body.app !== 'peci-xpertis-uzgodnienia' || !isObj(body.data)) { toast('To nie jest plik stanu tego narzędzia.'); return; }
    let added = 0, updated = 0;
    COLS.forEach(c => {
      const inc = isObj(body.data[c]) ? body.data[c] : {}; const cur = Object.assign({}, S.ov[c]);
      Object.keys(inc).forEach(id => {
        const a = cur[id], b = inc[id]; if (!isObj(b)) return;
        if (!a) { cur[id] = b; added++; return; }
        const r = newer(a, b) ? merge(a, b) : merge(b, a);
        if (a.conf || b.conf) r.conf = mergeParties(a.conf, b.conf);
        if (a.sign || b.sign) r.sign = mergeParties(a.sign, b.sign);
        if (JSON.stringify(r) !== JSON.stringify(a)) { cur[id] = r; updated++; }
      });
      S.ov[c] = cur; Store.persist(c);
    });
    toast(`Wczytano stan${body.author ? ' od: ' + body.author : ''}. Nowe wpisy: ${added}, zaktualizowane: ${updated}.`);
    schedule();
  };
  rd.readAsText(file);
}

/* ---------- start ---------- */
function start(hot) {
  if (hot && hot.proc && PBY[hot.proc]) Object.assign(S, {view:hot.view || 'proc', proc:hot.proc, sel:hot.sel || null, tab:hot.tab || 'pola'});
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) applyHash(h);
  else if (!S.sel && wide()) { compute(); const v = visibleList(); S.sel = v.length ? v[0].key : null; }
  render();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({view:S.view, proc:S.proc, sel:S.sel, tab:S.tab})); } catch (e) {}
  Promise.all([Store.use('db'), Store.use('user'), Store.use('downloads')]).then(async ([db, user, dl]) => {
    S.user = user; S.dl = dl;
    if (user) { try { const me = await user.me(); S.me = {id:me.id}; } catch (e) {} }
    if (db) {
      let cw = null; if (user) { try { cw = await user.can('data.write'); } catch (e) {} }
      S.canWrite = cw !== false;
      Store.startShared(db);
      if (cw === false) S.mode = 'readonly';
    } else { Store.startLocal(); S.canWrite = true; }
    schedule();
  });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
