<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Analiza PECI → Xpertis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Analiza PECI → Xpertis. Strona znana (Workday / PECI) – niebieski, pełne linie.
   Strona do ustalenia (Xpertis: baza pośrednicząca – fiolet, bazy produkcyjne – zieleń) – linie przerywane, dopóki zespół Xpertis jej nie opisze.
   Typografia w rem: html 14px, tryb „duży tekst” 16px. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunken:#EEF1F5; --hover:#F5F7FA; --sel:#EAF1FB;
  --ink:#131B26; --ink2:#2B3645; --muted:#566275; --faint:#86909F; --line:#E0E5EC; --line2:#C8D0DB;
  --wd:#1D5EA8; --wd-bg:#EAF2FB; --wd-line:#BCD2EE;
  --mw:#6142AD; --mw-bg:#F2EEFB; --mw-line:#D5CAF1;
  --xp:#17744A; --xp-bg:#E6F4EC; --xp-line:#B5DDC6;
  --acc:#1B3A5C; --acc-ink:#FFFFFF; --acc-soft:#E5ECF5;
  --ok:#18734A; --ok-bg:#E2F2E8; --warn:#8C5306; --warn-bg:#FBEFD9; --err:#AF261D; --err-bg:#FCE7E4; --info:#2A5B9A; --info-bg:#E6EEF8;
  --skip:#5F6B7C; --skip-bg:#E9ECF1;
  --mark:#FFE59A; --focus:#2F6FD0; --scrim:rgba(12,18,28,.44);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06); --shadow:0 16px 40px rgba(16,24,40,.20);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tabs-h:46px; --colh-h:32px; --grp-h:34px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#141B24; --sunken:#1A222D; --hover:#1B2430; --sel:#1A2A3F;
    --ink:#E5EAF1; --ink2:#C9D2DD; --muted:#98A4B4; --faint:#6E7A8B; --line:#243040; --line2:#334154;
    --wd:#76ABEB; --wd-bg:#15253A; --wd-line:#284566;
    --mw:#AB91EB; --mw-bg:#211B36; --mw-line:#3D3263;
    --xp:#62C792; --xp-bg:#122C1F; --xp-line:#24513A;
    --acc:#A3C4EC; --acc-ink:#0D1A29; --acc-soft:#1C2C40;
    --ok:#5DC68C; --ok-bg:#132D1E; --warn:#E3A853; --warn-bg:#33240F; --err:#F38075; --err-bg:#391916; --info:#89B1E8; --info-bg:#16273D;
    --skip:#A3AEBD; --skip-bg:#232D3A;
    --mark:#5C4A12; --focus:#7FB0F0; --scrim:rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 16px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#141B24; --sunken:#1A222D; --hover:#1B2430; --sel:#1A2A3F;
  --ink:#E5EAF1; --ink2:#C9D2DD; --muted:#98A4B4; --faint:#6E7A8B; --line:#243040; --line2:#334154;
  --wd:#76ABEB; --wd-bg:#15253A; --wd-line:#284566;
  --mw:#AB91EB; --mw-bg:#211B36; --mw-line:#3D3263;
  --xp:#62C792; --xp-bg:#122C1F; --xp-line:#24513A;
  --acc:#A3C4EC; --acc-ink:#0D1A29; --acc-soft:#1C2C40;
  --ok:#5DC68C; --ok-bg:#132D1E; --warn:#E3A853; --warn-bg:#33240F; --err:#F38075; --err-bg:#391916; --info:#89B1E8; --info-bg:#16273D;
  --skip:#A3AEBD; --skip-bg:#232D3A;
  --mark:#5C4A12; --focus:#7FB0F0; --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 16px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:14px;-webkit-text-size-adjust:100%}
html.lg{font-size:16px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--wd);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:8px;box-shadow:var(--shadow)}
.skip:focus{left:16px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
ul,ol{margin:0}
.mono{font-family:var(--f-mono);letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .num{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.lblc{font:600 .786rem/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sm{font-size:.821rem}
.warnt{color:var(--warn)}

/* ---------- pasek górny ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:8px 14px;min-height:58px;min-width:0;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);text-decoration:none;flex:none}
.brand-mark{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.brand-mark i{display:block;height:22px;border-radius:2px}
.brand-mark i:nth-child(1){background:var(--wd)} .brand-mark i:nth-child(2){background:var(--mw)} .brand-mark i:nth-child(3){background:var(--xp)}
.brand b{display:block;font:600 1.143rem/1.1 var(--f-cond);letter-spacing:.005em}
.brand small{display:block;font:400 .821rem/1.3 var(--f-ui);color:var(--muted)}
nav.views{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none;padding:2px}
nav.views::-webkit-scrollbar{display:none}
nav.views a{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font:500 1rem/1.2 var(--f-cond);letter-spacing:.015em;white-space:nowrap}
nav.views a:hover{color:var(--ink);background:var(--hover)}
nav.views a[aria-current="page"]{background:var(--acc-soft);color:var(--acc)}
nav.views a .cnt{font-size:.75rem}
.top-right{display:flex;align-items:center;gap:8px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);font-size:.929rem;font-weight:500;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn[aria-expanded="true"]{background:var(--acc-soft);border-color:var(--acc-soft);color:var(--acc)}
.tbtn.icon{width:36px;padding:0;justify-content:center}
.tbtn.search{min-width:170px;color:var(--muted)}
.tbtn.search kbd{margin-left:auto}
kbd,.kbd{font:500 .75rem/1 var(--f-mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--surface);white-space:nowrap}
.savestate{display:inline-flex;align-items:center;gap:7px;font-size:.857rem;color:var(--muted);white-space:nowrap;padding:0 4px}
.savestate i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.savestate.saving i{background:var(--info)} .savestate.err{color:var(--err)} .savestate.err i{background:var(--err)} .savestate.ro i{background:var(--faint)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 .786rem/1 var(--f-ui);color:var(--acc-ink);background:var(--acc);flex:none}
.avatar.none{background:var(--sunken);color:var(--muted)}
.avatar.wd{background:var(--wd);color:var(--surface)} .avatar.xp{background:var(--xp);color:var(--surface)} .avatar.sg{background:var(--acc);color:var(--acc-ink)}
.pname{display:grid;text-align:left;line-height:1.15;min-width:0}
.pname b{font-size:.893rem;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pname small{font-size:.786rem;color:var(--muted);font-weight:400;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:70;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px}
.mi{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px 10px;align-items:start;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px;color:var(--ink);width:100%}
.mi:hover{background:var(--hover)}
.mi .ic{margin-top:2px;color:var(--muted)}
.mi b{font-weight:600;font-size:.964rem}
.mi small{grid-column:2;color:var(--muted);font-size:.857rem;line-height:1.4}
.mi.danger b,.mi.danger .ic{color:var(--err)}
.msep{height:1px;background:var(--line);margin:4px 8px}
.mnote{font-size:.821rem;color:var(--muted);padding:6px 10px 8px;line-height:1.45}
.mform{padding:10px 10px 12px;display:grid;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:.893rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.langsw{display:inline-flex;height:36px;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.langsw button{border:0;background:transparent;padding:0 9px;min-width:36px;font:600 .821rem/1 var(--f-ui);letter-spacing:.04em;color:var(--muted)}
.langsw button+button{border-left:1px solid var(--line2)}
.langsw button:hover{background:var(--hover)}
.langsw button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.modal>header .langsw{height:32px}

/* ---------- obszar roboczy ---------- */
.work{display:grid;grid-template-columns:262px minmax(0,1fr);gap:14px;min-height:0;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.work.full{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0;overflow:auto;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.detail{display:none}
.detail.on{display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);z-index:50;border-radius:0;border-width:0 0 0 1px;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.backdrop{display:none}
.backdrop.on{display:block;position:fixed;inset:0;z-index:45;background:var(--scrim)}
@media (min-width:1500px){
  .work.dock{grid-template-columns:262px minmax(0,1fr) minmax(470px,560px)}
  .work.dock .detail.on{position:static;width:auto;border-radius:14px;border-width:1px;box-shadow:var(--shadow-sm);z-index:auto;padding:0}
}

/* szyna (procesy, tematy) */
.rail{padding:0 4px 20px 0}
.rail h4{margin:18px 8px 6px;font:600 .786rem/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rail h4:first-child{margin-top:4px}
.railhead{display:grid;gap:8px;padding:4px 8px 6px}
.railhead b{font:600 1.071rem/1.2 var(--f-cond)}
.pr{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:3px 8px;align-items:start;width:100%;text-align:left;padding:8px 9px 9px;border:0;border-radius:10px;background:transparent;color:var(--ink)}
.pr:hover{background:var(--surface)}
.pr[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),var(--shadow-sm)}
.pr .pid{font:500 .857rem/1.4 var(--f-mono);color:var(--muted)}
.pr .pn{font-size:.929rem;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr .pst{font:500 .786rem/1.4 var(--f-ui);color:var(--muted);display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr .pst .ic{width:14px;height:14px}
.pr .pst.ok{color:var(--ok)} .pr .pst.w{color:var(--warn)}
.pr .pbar{grid-column:2/4;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex;margin-top:3px}
.pr.topic{grid-template-columns:36px minmax(0,1fr) 10px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2);margin-top:5px;flex:none;display:inline-block}
.dot.st1{border-color:var(--info);background:var(--info-bg)} .dot.st2{border-color:var(--ok);background:var(--ok)} .dot.st3{border-color:var(--warn);background:var(--warn)}
.pbar b,.pbig b,.minibar b{display:block;height:100%}
.b-ok{background:var(--ok)} .b-skip{background:var(--skip)} .b-warn{background:var(--warn)} .b-info{background:var(--info)} .b-faint{background:var(--line2)}
.rail-select{display:none}

/* nagłówek strony */
.listpane{container-type:inline-size}
.phead{padding:20px 22px 16px;display:grid;gap:12px}
.ptitle{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.pmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.893rem;color:var(--muted);margin-bottom:6px}
.pidbig{font:500 .857rem/1 var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--sunken);color:var(--ink)}
.ptitle h1{font:600 1.714rem/1.15 var(--f-cond);letter-spacing:.003em}
.pdesc{color:var(--muted);max-width:86ch;font-size:.964rem}
.signmini{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap;border:0;background:transparent;padding:0}
.sm1{font:600 .786rem/1 var(--f-ui);padding:6px 8px;border-radius:7px;border:1px solid var(--line2);color:var(--faint);white-space:nowrap}
.sm1.on{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.signmini:hover .sm1{border-color:var(--faint)}
.pfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 22px;margin:0;padding:12px 14px;border:1px solid var(--wd-line);background:var(--wd-bg);border-radius:12px}
.pfacts div{min-width:0}
@container (min-width:900px){.pfacts{grid-template-columns:minmax(0,1.1fr) minmax(0,.7fr) minmax(0,1.7fr) minmax(0,.9fr)}}
@container (max-width:599px){.gbulk .lbl{display:none}}
.pfacts dt{font:600 .75rem/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--wd)}
.pfacts dd{margin:4px 0 0;font-size:.893rem;overflow-wrap:anywhere;color:var(--ink2)}
.evchips{display:flex;flex-wrap:wrap;gap:4px}
.evchip{font:600 .786rem/1.6 var(--f-mono);padding:0 7px;border-radius:6px;background:var(--surface);color:var(--wd);border:1px solid var(--wd-line);cursor:help}
.likebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.929rem;padding:10px 12px;border-radius:10px;background:var(--info-bg);color:var(--info)}
.likebar>span{flex:1 1 260px}
.pprog{display:grid;gap:10px}
.pbig{height:8px;border-radius:4px;background:var(--line);display:flex;overflow:hidden}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.893rem;color:var(--muted);white-space:nowrap}
.kchip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
button.kchip:hover{border-color:var(--line2);background:var(--hover)}
.kchip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kchip.w{border-color:transparent;background:var(--warn-bg);color:var(--warn)} .kchip.w b{color:var(--warn)}
.kchip.ok{border-color:transparent;background:var(--ok-bg);color:var(--ok)} .kchip.ok b{color:var(--ok)}

/* zakładki i narzędzia listy */
.tabs{position:sticky;top:0;z-index:7;display:flex;gap:2px;height:var(--tabs-h);align-items:stretch;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:0 10px;font:500 1rem/1 var(--f-cond);letter-spacing:.015em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.cnt{font:500 .786rem/1 var(--f-mono);padding:3px 6px;border-radius:9px;background:var(--sunken);color:var(--muted)}
.cnt.w{background:var(--warn-bg);color:var(--warn)} .cnt.ok{background:var(--ok-bg);color:var(--ok)}
.tools{display:grid;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.tools .r1{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
.tools .hintline{font-size:.857rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.sbox{position:relative;flex:1 1 240px;min-width:0}
.sbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.sbox input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--line2);border-radius:9px;background:var(--surface)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:.893rem;color:var(--ink2);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.fchip .n{font:500 .786rem/1 var(--f-mono);color:var(--muted)}
.fchip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.fchip:hover{background:var(--hover)}
.fchip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.85}
.fchip.zero{color:var(--faint)}
.selsm{height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);padding:0 8px;font-size:.893rem;max-width:100%}

/* lista danych PECI */
.colh,.row{grid-template-columns:4px minmax(0,1.45fr) minmax(130px,.75fr) minmax(0,.95fr) 138px minmax(0,1.15fr)}
.colh{position:sticky;top:var(--tabs-h);z-index:6;display:grid;gap:0 14px;height:var(--colh-h);align-items:center;padding:0 16px 0 0;background:var(--surface);border-bottom:1px solid var(--line);font:600 .75rem/1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.colh .wdc{color:var(--wd)} .colh .xpc{color:var(--xp)}
.grp{position:sticky;top:calc(var(--tabs-h) + var(--colh-h));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:var(--grp-h);padding:6px 16px 6px 18px;background:var(--sunken);border-bottom:1px solid var(--line)}

.grp .gp:hover{color:var(--ink)}
.grp .gp .chev{width:14px;height:14px;margin-top:1px;transition:transform .15s;flex:none}
.grp.closed .gp .chev{transform:rotate(-90deg)}
.grp.closed{position:static}
.grp .gp small{font:400 .786rem/1.3 var(--f-ui);color:var(--muted);margin-left:8px}
.grp .gp .pre{font-weight:500;color:var(--faint)}
.spath{font:500 .857rem/1.4 var(--f-mono);color:var(--faint);overflow-wrap:anywhere}
.grp .gc{font:500 .821rem/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grp .gr{display:flex;align-items:center;gap:12px;flex:none}
.gbulk{display:inline-flex;align-items:center;gap:4px;opacity:.55;transition:opacity .15s}
.grp:hover .gbulk,.gbulk:focus-within{opacity:1}
.gbulk .lbl{font-size:.786rem;color:var(--muted);margin-right:2px;white-space:nowrap}
.gbulk button{height:24px;min-width:30px;padding:0 7px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);font-size:.786rem;font-weight:600;color:var(--muted)}
.gbulk button.y:hover{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gbulk button.n:hover{background:var(--skip);border-color:var(--skip);color:var(--surface)}
.gbulk button.u:hover{background:var(--warn);border-color:var(--warn);color:var(--surface)}
@media (hover:none){.gbulk{opacity:1}}
.row{display:grid;gap:4px 14px;align-items:start;padding:11px 16px 11px 0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface);position:relative}
.row:hover{background:var(--hover)}

.row[aria-selected="true"] .stripe{background:var(--acc)}
.row.s-skip .c1,.row.s-skip .c2,.row.s-skip .c3{opacity:.62}
.c1,.c2,.c3,.c4,.c5{min-width:0}
.rid{font:500 .786rem/1.5 var(--f-mono);color:var(--faint);margin-right:6px}
.el{font:600 .964rem/1.4 var(--f-mono);color:var(--ink);overflow-wrap:anywhere}
.sub{font-size:.857rem;line-height:1.42;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.badges:empty{display:none}
.tpat{font:500 .786rem/1.35 var(--f-mono);color:var(--muted);overflow-wrap:anywhere;display:block;margin-top:4px}
.xcell{font-size:.929rem;line-height:1.4;overflow-wrap:anywhere}
.xcell .xt{color:var(--ink)}
.xcell .xf{font:500 .821rem/1.4 var(--f-mono);color:var(--xp)}
.xcell .none{color:var(--faint)}
.xcell .miss{font-size:.857rem;color:var(--warn);font-style:italic}
.listend{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px;color:var(--muted);font-size:.893rem}
@container (max-width:1079px){
  .colh,.row{grid-template-columns:4px minmax(0,1.5fr) minmax(120px,.75fr) 138px minmax(0,1fr)}
  .colh .c3,.row .c3{display:none}
}
@container (max-width:759px){
  .colh{display:none}
  .row{grid-template-columns:4px minmax(0,1fr) auto;padding-right:14px}
  .row .c1{grid-column:2/4}
  .row .c2{grid-column:2/4}
  .row .c4{grid-column:3;grid-row:3}
  .row .c5{grid-column:2;grid-row:3;align-self:center}
  .row .stripe{grid-row:1/span 3}
  .grp{top:var(--tabs-h)}
}
.empty{padding:36px 22px;color:var(--muted);text-align:center;display:grid;gap:10px;justify-items:center}

/* decyzja: potrzebne w Xpertis? */
.nb{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface);flex:none}
.nb button{border:0;background:transparent;height:30px;min-width:40px;padding:0 9px;font-size:.857rem;font-weight:600;color:var(--muted)}
.nb button+button{border-left:1px solid var(--line2)}

.nb button[aria-pressed="true"].y{background:var(--ok);color:var(--surface)}
.nb button[aria-pressed="true"].n{background:var(--skip);color:var(--surface)}
.nb button[aria-pressed="true"].u{background:var(--warn);color:var(--surface)}
.nb button[disabled]{cursor:not-allowed;opacity:.55}
.needseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.needseg button{display:grid;gap:2px;text-align:left;border:1.5px solid var(--line2);border-radius:11px;background:var(--surface);padding:10px 12px;color:var(--ink2)}
.needseg button b{display:flex;align-items:center;gap:7px;font-size:.964rem}
.needseg button small{font-size:.786rem;color:var(--muted);line-height:1.35}
.needseg button kbd{margin-left:auto}
.needseg button:hover:not([disabled]){border-color:var(--faint)}
.needseg button[aria-pressed="true"].y{border-color:var(--ok);background:var(--ok-bg)} .needseg button[aria-pressed="true"].y b{color:var(--ok)}
.needseg button[aria-pressed="true"].n{border-color:var(--skip);background:var(--skip-bg)} .needseg button[aria-pressed="true"].n b{color:var(--skip)}
.needseg button[aria-pressed="true"].u{border-color:var(--warn);background:var(--warn-bg)} .needseg button[aria-pressed="true"].u b{color:var(--warn)}
.needseg button[disabled]{cursor:not-allowed;opacity:.6}

/* chipy, przyciski, pola */
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:999px;font:500 .821rem/1.6 var(--f-ui);border:1px solid transparent;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
a.chip{text-decoration:none}
.c-neutral{background:var(--sunken);color:var(--muted)}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
.c-err{background:var(--err-bg);color:var(--err)} .c-info{background:var(--info-bg);color:var(--info)}
.c-faint{background:transparent;color:var(--faint);border-color:var(--line)}
.c-skip{background:var(--skip-bg);color:var(--skip)}
.c-mw{background:var(--mw-bg);color:var(--mw)} .c-xp{background:var(--xp-bg);color:var(--xp)} .c-wd{background:var(--wd-bg);color:var(--wd)}
.c-add{background:transparent;color:var(--wd);border-color:var(--wd-line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:.964rem;font-weight:500;color:var(--ink2);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 11px;font-size:.893rem;border-radius:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ok:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:var(--err-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);font-size:.857rem;font-weight:500;display:inline-flex;align-items:center;gap:5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-family:inherit}
.linkbtn .ic{width:14px;height:14px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field>label,.field>.lbl{font-size:.893rem;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);min-width:0}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--faint)}
.field textarea{height:auto;padding:9px 11px;resize:vertical;min-height:68px;line-height:1.45}
.field input[disabled],.field select[disabled],.field textarea[disabled]{background:var(--sunken);color:var(--muted);cursor:not-allowed}
.field .hint{font-size:.857rem;color:var(--muted);line-height:1.45}
.field .err{font-size:.857rem;color:var(--err)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.askbar{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;padding:11px 13px;border-radius:11px;background:var(--warn-bg);color:var(--warn);font-size:.929rem;line-height:1.45}
.askbar>span{flex:1 1 240px}
.askbar.err{background:var(--err-bg);color:var(--err)}
.askbar.info{background:var(--info-bg);color:var(--info)}
.note{font-size:.929rem;background:var(--sunken);border-radius:10px;padding:10px 12px;color:var(--ink2);line-height:1.5}
.hintbox{font-size:.893rem;color:var(--muted);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.hintbox .ic{margin-top:2px;color:var(--faint)}

/* karta danej */
.dhead{position:sticky;top:0;z-index:6;background:var(--surface);padding:14px 18px 13px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dids{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.893rem;color:var(--muted);min-width:0}
.dnav{display:flex;gap:4px;align-items:center;flex:none}

.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);flex:none}

.dhead h2{font:600 1.357rem/1.3 var(--f-mono);overflow-wrap:anywhere;letter-spacing:-.01em}

.sec{border:1px solid var(--line);border-radius:13px;overflow:hidden;scroll-margin-top:90px}

.snum{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 .786rem/1 var(--f-ui);letter-spacing:0;flex:none}
.sec.wd{border-color:var(--wd-line)} .sec.wd>header{background:var(--wd-bg);border-color:var(--wd-line)} .sec.wd h3{color:var(--wd)} .sec.wd .snum{background:var(--wd);color:var(--surface)}
.sec.xp{border-color:var(--xp-line);border-style:dashed} .sec.xp>header{background:var(--xp-bg);border-color:var(--xp-line)} .sec.xp h3{color:var(--xp)} .sec.xp .snum{background:var(--xp);color:var(--surface)}
.sec.xp.filled{border-style:solid}
.sec.qs>header{background:var(--sunken)} .sec.qs h3{color:var(--ink2)} .sec.qs .snum{background:var(--ink2);color:var(--surface)}
.sec .in{padding:14px;display:grid;gap:14px}
.dfoot{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:11px 18px calc(11px + env(safe-area-inset-bottom,0px));display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-top:auto}

.lastchg{font-size:.821rem;color:var(--faint)}
.same{display:grid;gap:6px}

/* specyfikacja PECI */
.sp-path{display:flex;align-items:center;gap:8px;background:var(--wd-bg);border-radius:9px;padding:7px 7px 7px 11px}

.sp-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:600 .786rem/1 var(--f-ui);letter-spacing:.02em;white-space:nowrap;color:var(--ink2);background:var(--sunken)}
.t-date,.t-datetime{color:var(--info);background:var(--info-bg)}
.t-bool{color:var(--mw);background:var(--mw-bg)}
.t-int,.t-dec{color:var(--xp);background:var(--xp-bg)}
.t-code{color:var(--wd);background:var(--wd-bg)}

.sp-els{display:grid;gap:8px}
.elc{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:7px;min-width:0}
.elc-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.elc-n{font:600 .964rem/1.3 var(--f-mono);color:var(--ink);overflow-wrap:anywhere;margin-right:2px}

.svs{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:100%}
.sv{font:500 .821rem/1.5 var(--f-mono);background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink);overflow-wrap:anywhere;max-width:100%}
.sp-dl{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:8px 12px;margin:0;font-size:.893rem}

.achips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.achip{display:inline-flex;font:500 .786rem/1.6 var(--f-mono);padding:0 7px;border-radius:5px;border:1px dashed var(--line2);color:var(--faint);cursor:help}

.mini{display:inline-block;margin:3px 4px 0 0;font:500 .75rem/1.5 var(--f-ui);padding:0 6px;border-radius:5px;background:var(--wd-bg);color:var(--wd)}
.evl{font-size:.857rem;color:var(--wd);font-weight:500}

/* pytania */
.qlist{display:grid;gap:10px}
.q1{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--surface);scroll-margin-top:16px}
.q1.focus{box-shadow:0 0 0 2px var(--focus)}
.q1 .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.857rem;color:var(--muted)}
.q1 .h .id{font:600 .893rem var(--f-mono);color:var(--ink)}

.q1 .ans{display:grid;gap:6px}

.composer textarea{width:100%;min-height:64px;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);resize:vertical;line-height:1.45}
.composer .lbl{font-size:.857rem;color:var(--muted)}

/* widoki pełnej szerokości */
.view{padding:22px 24px 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start}
.vhead{display:grid;gap:6px}
.vhead h1{font:600 1.714rem/1.2 var(--f-cond)}

.blockh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.blockh p{color:var(--muted);font-size:.929rem;flex-basis:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:13px;padding:13px 15px;display:grid;gap:4px;background:var(--surface);text-align:left;color:var(--ink);align-content:start}
button.kpi:hover{border-color:var(--line2);background:var(--hover)}
.kpi .v{font:600 1.857rem/1.1 var(--f-cond);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:1rem;color:var(--muted);font-weight:500}
.kpi .k{font-size:.893rem;color:var(--muted)}
.kpi .k2{font-size:.821rem;color:var(--warn)}
.kpi .minibar{width:100%;margin:4px 0 0}
.kpi.w .v{color:var(--warn)} .kpi.o .v{color:var(--ok)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.929rem}
table.t th{position:sticky;top:0;background:var(--sunken);text-align:left;font:600 .786rem/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--hover)}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.gh td{background:var(--sunken);font:600 .821rem/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
table.t td.hl{color:var(--warn);font-weight:600}
.minibar{width:96px;height:6px;border-radius:3px;background:var(--line);display:inline-flex;overflow:hidden;vertical-align:middle;margin-right:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;display:grid;gap:14px;align-content:start;min-width:0}
.panel>h2{font:600 1.143rem/1.25 var(--f-cond);display:flex;align-items:center;gap:9px}
.panel>p.lead{color:var(--muted);font-size:.929rem;margin-top:-6px}
.panel.wd{border-color:var(--wd-line);background:linear-gradient(var(--wd-bg),var(--wd-bg)) top/100% 4px no-repeat,var(--surface)}
.panel.wd>h2{color:var(--wd)}
.panel.xp{border-color:var(--xp-line);border-style:dashed}
.panel.xp>h2{color:var(--xp)}
.panel.xp.filled{border-style:solid}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:.964rem;line-height:1.5;color:var(--ink2)}
.facts li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--wd);margin:8px 0 0 4px}
.qnum{margin:0;padding:0;list-style:none;display:grid;gap:9px;counter-reset:q}
.qnum li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:.964rem;line-height:1.5;color:var(--ink)}
.qnum li::before{counter-increment:q;content:counter(q);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--xp-bg);color:var(--xp);font:600 .786rem/1 var(--f-ui);margin-top:1px}
.refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stseg{display:inline-flex;flex-wrap:wrap;gap:6px}
.stseg button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:.893rem;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.stseg button:hover:not([disabled]){background:var(--hover)}
.stseg button[aria-pressed="true"].s0{background:var(--sunken);border-color:var(--line2);color:var(--ink);font-weight:600}
.stseg button[aria-pressed="true"].s1{background:var(--info-bg);border-color:var(--info);color:var(--info);font-weight:600}
.stseg button[aria-pressed="true"].s2{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:600}
.stseg button[aria-pressed="true"].s3{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.stseg button[disabled]{opacity:.55;cursor:not-allowed}
.tnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 12px;color:var(--ink)}
.tcard:hover{border-color:var(--line2);background:var(--hover)}
.tcard .id{font:500 .821rem/1.5 var(--f-mono);color:var(--muted)}
.tcard .t{font-weight:600;font-size:.929rem;line-height:1.35}
.tcard .m{grid-column:2/4;font-size:.786rem;color:var(--muted)}

/* start */
.hero{display:grid;gap:10px;max-width:96ch}
.hero h1{font:600 2rem/1.15 var(--f-cond)}
.hero p{color:var(--ink2);font-size:1.036rem;line-height:1.55}
.arch{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.7fr) auto minmax(0,1.15fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.arch .ab{border-radius:12px;padding:11px 13px;display:grid;gap:4px;align-content:start;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.arch .ab .t{font:600 .75rem/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.arch .ab b{font:600 1.071rem/1.3 var(--f-cond)}
.arch .ab small{font-size:.821rem;color:var(--muted);line-height:1.4}
.arch .ab .st{justify-self:start;margin-top:4px}
.arch .ab.wd{background:var(--wd-bg);border-color:var(--wd-line)} .arch .ab.wd b{color:var(--wd)}
.arch .ab.mw{border-style:dashed;border-color:var(--mw-line)} .arch .ab.mw b{color:var(--mw)}
.arch .ab.xp{border-style:dashed;border-color:var(--xp-line)} .arch .ab.xp b{color:var(--xp)}
.arch .ab.sf{background:var(--sunken);border-style:dashed}
.arch .aar{display:grid;place-items:center;color:var(--faint)}
.arch .aar .ic{width:18px;height:18px}
@media (max-width:1100px){.arch{grid-template-columns:minmax(0,1fr)} .arch .aar{transform:rotate(90deg);height:14px}}
.arch.compact{grid-template-columns:minmax(0,1fr)} .arch.compact .aar{transform:rotate(90deg);height:14px}
.arch .ab .st .chip{white-space:normal;max-width:100%}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;counter-reset:h}
.howto .hs{border:1px solid var(--line);border-radius:13px;padding:14px 16px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.howto .hs h3{font:600 1.071rem/1.3 var(--f-cond);display:flex;gap:9px;align-items:center}
.howto .hs h3::before{counter-increment:h;content:counter(h);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font:600 .786rem/1 var(--f-ui);flex:none}
.howto .hs.wd h3::before{background:var(--wd)} .howto .hs.xp h3::before{background:var(--xp)} .howto .hs.mw h3::before{background:var(--mw)}
.howto .hs p{font-size:.929rem;color:var(--muted);line-height:1.5}
.howto .hs .btn{justify-self:start}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ses{border:1px solid var(--line);border-radius:13px;padding:14px 16px;display:grid;gap:9px;align-content:start;background:var(--surface)}
.ses.done{background:var(--ok-bg);border-color:transparent}
.ses .h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.ses .h .id{font:600 .857rem/1 var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--sunken)}
.ses .h b{font:600 1.071rem/1.25 var(--f-cond)}
.ses p{font-size:.893rem;color:var(--muted);line-height:1.45}
.ses .scope{display:flex;flex-wrap:wrap;gap:4px}
.ses .prog{display:flex;align-items:center;gap:8px;font-size:.821rem;color:var(--muted)}
.ses .prog .minibar{flex:1;width:auto;margin:0}
.ses .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ses .r input[type=date]{height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 8px;font-size:.893rem}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:.821rem;color:var(--muted)}
.legendrow span{display:inline-flex;gap:6px;align-items:center}
.legendrow i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* zatwierdzenia, protokół */
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sign{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0;background:var(--surface)}
.sign .who{font:600 .893rem/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.sign.wd .who{color:var(--wd)} .sign.xp .who{color:var(--xp)} .sign.sg .who{color:var(--acc)}
.sign .role{font-size:.857rem;color:var(--muted)}
.sign .by{font-size:.893rem;color:var(--ok);overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start}
.sign.done{background:var(--ok-bg);border-color:transparent}
.proto{margin:0;white-space:pre-wrap;font:400 .857rem/1.55 var(--f-mono);background:var(--sunken);border-radius:11px;padding:14px 16px;max-height:380px;overflow:auto;color:var(--ink2)}
.gaps{display:grid;gap:10px}
.gap1{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:12px;background:var(--surface)}
.gap1 .h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gap1 .h .id{font:600 .857rem var(--f-mono);color:var(--muted)}
.gap1 .meta{font-size:.786rem;color:var(--faint)}
.catres{display:grid;gap:2px}

/* modale */
.modal-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:start center;padding:max(56px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--scrim);overflow:auto}
.modal{width:min(760px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 96px);overflow:hidden}
.modal>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal>header h2{font:600 1.357rem/1.2 var(--f-cond)}
.mbody{padding:18px 22px 24px;display:grid;gap:22px;overflow:auto}
.mbody h3{font:600 1.071rem var(--f-cond);margin-bottom:8px}
.mbody p{line-height:1.55;color:var(--ink2)}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:baseline;font-size:.929rem;margin:0}
.legend dd{margin:0;color:var(--ink2)}
.legend dt{white-space:nowrap}
.kbdlist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;font-size:.929rem}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;font-size:.964rem;color:var(--ink2);line-height:1.5}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--ink2);font:600 .786rem/1 var(--f-ui)}
.steps li.wd::before{background:var(--wd);color:var(--surface)} .steps li.xp::before{background:var(--xp);color:var(--surface)} .steps li.mw::before{background:var(--mw);color:var(--surface)}
.palette{width:min(680px,100%)}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal-in .ic{width:20px;height:20px;color:var(--faint)}
.pal-in input{flex:1;border:0;background:transparent;font-size:1.143rem;outline:none;min-width:0;height:30px}
.pal-res{overflow:auto;padding:6px 8px 10px;max-height:min(62vh,560px)}
.pal-g{font:600 .75rem/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px}
.pal-it{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 12px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:9px;color:var(--ink)}
.pal-it .k{font:500 .857rem/1.4 var(--f-mono);color:var(--muted)}
.pal-it .l{font-size:.964rem;overflow-wrap:anywhere}
.pal-it .s{grid-column:2;font-size:.821rem;color:var(--muted);overflow-wrap:anywhere}
.pal-it[aria-selected="true"]{background:var(--sel)}
.pal-empty{padding:26px 14px;color:var(--muted);text-align:center}
.pal-foot{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line);font-size:.821rem;color:var(--muted)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:95;display:grid;gap:8px;max-width:min(440px,calc(100% - 32px))}
.toast>div{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:11px;font-size:.929rem;box-shadow:var(--shadow)}
.toast>div span{flex:1}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font:500 .964rem/1 var(--f-cond);letter-spacing:.015em;color:var(--ink2)}
.subtabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.docsec{display:grid;gap:10px}
.docsec h2{font:600 1.214rem var(--f-cond)}
.docsec p{color:var(--ink2);line-height:1.55;max-width:96ch}

/* ---------- responsywność ---------- */
@media (max-width:1699px){
  .brand small{display:none}
}
@media (max-width:1599px){
  .savestate span{display:none}
  .tbtn.search{min-width:0}
  .tbtn.search kbd{display:none}
  .brand b span{display:none}
}
@media (max-width:1279px){
  .work{grid-template-columns:236px minmax(0,1fr)}
  .work.full{grid-template-columns:minmax(0,1fr)}
  .pname{display:none}
  .tbtn.search span{display:none}
  .tbtn.search{width:36px;padding:0;justify-content:center}
}
@media (max-width:1180px){
  .top{flex-wrap:wrap}
  nav.views{order:3;flex-basis:100%;margin:0 -6px}
  .top-right{margin-left:auto}
}
@media (max-width:860px){
  .app{height:auto;min-height:100%;display:block}
  .top{position:sticky;top:env(safe-area-inset-top,0px)}
  .work,.work.full{display:block;padding-block:12px}
  .rail{display:none}
  .rail-select{display:block;padding:14px 16px 0}
  .rail-select select{width:100%;height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
  .pane{overflow:visible}
  .detail.on{width:100%;left:0;border-width:0;padding-left:env(safe-area-inset-left,0px);overflow:auto}
  .tabs{top:calc(env(safe-area-inset-top,0px) + var(--toph,100px))}
  .colh{top:calc(env(safe-area-inset-top,0px) + var(--toph,100px) + var(--tabs-h))}
  .grp{top:calc(env(safe-area-inset-top,0px) + var(--toph,100px) + var(--tabs-h))}
  .phead{padding:14px 16px 14px}
  .view{padding:16px 14px 24px}
  .savestate{display:none}
  .modal-wrap{padding-top:max(16px,env(safe-area-inset-top,0px))}
  .modal{max-height:none}
  .needseg{grid-template-columns:minmax(0,1fr)}
  .needseg button kbd{display:none}
}
@media (max-width:600px){
  .elc-g,.sp-dl{grid-template-columns:minmax(0,1fr)}
  .elc-g .k,.sp-dl dt{margin-top:4px}
  .langsw button{min-width:34px;padding:0 7px}
  .langsw button[aria-pressed="true"]{display:none}
  .langsw button+button{border-left:0}
  .top-right{gap:6px}
  .tbtn span:not(.avatar){display:none}
  .tbtn{padding:0 10px}
  .top{gap:6px 10px;min-height:52px;padding-block:6px}
  nav.views a{padding:6px 9px}
  .dtop{flex-wrap:wrap}
  .dhead h2{font-size:1.214rem}
  .ptitle h1{font-size:1.5rem}
  .hero h1{font-size:1.643rem}
  .brand b span{display:none}
}
@media (max-width:400px){
  .brand-mark{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<a class="skip" href="#main" data-i18n="Przejdź do treści">Przejdź do treści</a>
<div class="app" id="app">
  <header class="top" id="top">
    <a class="brand" href="#start" title="Analiza integracji Workday PECI → Xpertis (Polska)" data-i18n-title="Analiza integracji Workday PECI → Xpertis (Polska)">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div><b>PECI → Xpertis<span data-i18n=" · analiza"> · analiza</span></b><small data-i18n="Workday (Chorus) · baza pośrednicząca · Xpertis">Workday (Chorus) · baza pośrednicząca · Xpertis</small></div>

  </header>
  <main class="work" id="work">
    <aside class="pane rail" id="rail" aria-label="Nawigacja" data-i18n-aria="Nawigacja"></aside>
    <section class="pane card listpane" id="main" tabindex="-1"></section>

<input type="file" id="state-file" accept=".json,application/json" hidden>
<script type="application/json" id="peci-data">{"processes":[{"id":"P00","grp":"0. Wspólne","name":"Nagłówek pliku, identyfikacja i sterowanie","desc":"Elementy obecne w każdym pliku i przy każdym pracowniku: nagłówek (spółka, grupa płacowa, okres), identyfikatory pracownika, kod i moment zdarzenia, log transakcji, atrybuty zmian.","bp":"Wszystkie","events":"Wszystkie","sections":"Summary, Worker_Summary, Effective_Change, Transaction_Log, atrybuty XML","sample":"Wszystkie scenariusze"},{"id":"P01","grp":"A. Wejście","name":"Zatrudnienie nowego pracownika","desc":"Pierwsze zatrudnienie osoby u pracodawcy w Polsce. PECI przesyła pełny zestaw sekcji; to proces bazowy – pozostałe procesy wejścia opisują różnice względem P01.","bp":"Hire Employee (z: Propose Compensation Hire, Maintain Employee Contracts, Assign Pay Group, Edit Service Dates, Manage Probation Period)","events":"HIR","sections":"Worker_Status, Personal, Person_Communication, Person_Identification, Position, Compensation, Compensation_Plans, Payment_Election, Employee_Contract, Collective_Agreement, Costing_Allocation, Union_Member, Additional_Information","sample":"Scenariusz 1 (umowa na czas nieokreślony); 12 (umowa terminowa)"},{"id":"P02","grp":"A. Wejście","name":"Ponowne zatrudnienie","desc":"Zatrudnienie osoby, która wcześniej pracowała w Grupie (Is_Rehire = 1). PECI wysyła pełny zestaw danych jak w P01 – poniżej tylko elementy, które odróżniają ten proces.","bp":"Hire Employee (rehire)","events":"HIR (Is_Rehire = 1), czasem poprzedzone DTA","sections":"Jak P01","sample":"Scenariusz 12","like":"P01"},{"id":"P03","grp":"A. Wejście","name":"Korekta daty zatrudnienia","desc":"Zmiana daty zatrudnienia po jej wprowadzeniu: na późniejszą (anulowanie + ponowne zatrudnienie) albo na wcześniejszą (korekta).","bp":"Correct Hire / Rescind Hire + Hire","events":"HIR-R + HIR (na późniejszą); HIR-C + DTA (na wcześniejszą)","sections":"Worker_Status (wartości poprzednie), Position, Compensation_Plans, Employee_Co Uwierzytelnianie (klucze SSH), szyfrowanie PGP, adresy do dopuszczenia w zaporze.","Katalogi (przychodzące, archiwum, odrzucone) i wzorzec nazwy pliku.","Jeden plik na grupę płacową czy jeden plik zbiorczy na uruchomienie?"],"refs":["P00-003","P00-004"]},{"id":"B02","area":"A","title":"Harmonogram i kompletność plików","facts":["Każde uruchomienie obejmuje zmiany wprowadzone w Workday w oknie Updated_From – Updated_To.","Nagłówek ma okres płacowy (Pay_Period_Start / End), zakres dat skuteczności (Effective_From / To) i liczbę pracowników w pliku (Worker_Count).","Znaczniki First_Primary_Run_of_Pay_Period i Ad_Hoc_Run odróżniają przebieg główny okresu od dodatkowego."],"qs":["Jak często Workday ma generować plik: codziennie, kilka razy w okresie, przed zamknięciem listy płac?","Jak baza pośrednicząca wykryje brak pliku albo lukę między oknami zmian (Updated_From różne od poprzedniego Updated_To)?","Czy Worker_Count ma służyć do kontroli kompletności wczytania?","Kto i jak dostaje alert, gdy plik nie dotrze?"],"refs":["P00-005","P00-006","P00-007","P00-008","P00-009"]},{"id":"B03","area":"A","title":"Rejestr plików i ponowne przetworzenie","facts":["Integration_Event (WID) jednoznacznie identyfikuje uruchomienie integracji, a Integration_Sent_On to moment wygenerowania pliku.","Integrację można uruchomić ponownie, np. po błędzie – te same zmiany mogą przyjść drugi raz."],"qs":["Czy baza pośrednicząca prowadzi rejestr przetworzonych plików i blokuje podwójne przetworzenie?","Co zrobić, gdy ta sama zmiana pracownika przyjdzie ponownie: pominąć, nadpisać, zgłosić?","Jak długo przechowywać oryginalne pliki (archiwum, audyt)?"],"refs":["P00-001","P00-002"]},{"id":"B04","area":"B","title":"Struktura pliku i model bazy pośredniczącej","facts":["Hierarchia pliku: Summary → pracownik (Worker_Summary) → zmiany (Effective_Change z atrybutem Sequence) → sekcje (Worker_Status, Personal, Position …).","Zmiana zawiera tylko sekcje, których dotyczy; przy HIR, ORG i PCI – wszystkie włączone sekcje."],"qs":["Czy baza pośrednicząca przechowuje surowy XML, tabele odpowiadające sekcjom PECI, czy od razu model Xpertis?","Jak przechowywać historię zmian pracownika (wersje, daty skuteczności)?","Technologia: baza danych, narzędzie do wczytywania i harmonogram zadań."],"refs":[]},{"id":"B05","area":"B","title":"Atrybuty zmian","facts":["Sekcje i pola mają atrybuty isAdded, isUpdated, isDeleted; przy części pól przychodzi priorValue – wartość sprzed zmiany.","Zmiana elementu powtarzalnego (np. adresu) może przyjść jako isDeleted dla starego wystąpienia i isAdded dla nowego."],"qs":["Czy Xpertis potrzebuje wartości poprzednich (priorValue), np. do korekt i historii?","Jak interpretować isDeleted: zamknięcie rekordu z datą czy usunięcie?","Czy baza pośrednicząca ma porównywać dane z Xpertis, czy opierać się na atrybutach zmian z PECI?"],"refs":["P00-020","P00-021"]},{"id":"B06","area":"B","title":"Kolejność i data skuteczności zmian","facts":["Każda zmiana ma Effective_Moment (od kiedy obowiązuje) i Entry_Moment (kiedy wprowadzono ją w Workday); Sequence wyznacza kolejność zmian pracownika w pliku.","Data zdarzenia zależy od kodu – np. przy TERM to data rozwiązania + 1 dzień (Dokumentacja PECI → Zdarzenia).","Daty mają przesunięcie strefy czasowej tenanta (np. 2026-01-01-08:00) – to nie jest godzina."],"qs":["Czy ładować zmiany ściśle w kolejności Sequence i Effective_Moment?","Jak Xpertis przyjmuje zmiany wsteczne i zmiany z przyszłą datą?","Którą datę Xpertis traktuje jako datę skuteczności operacji?"],"refs":["P00-014","P00-016","P00-017"]},{"id":"B07","area":"B","title":"Korekty i anulowania","facts":["Korekty i anulowania mają osobne kody zdarzeń (HIR-C, HIR-R, TERM-C, TERM-R, LOA-C, LOA-R, RFL-R).","Transaction_Log niesie znaczniki korekty i powiązanie ze zdarzeniem pierwotnym (is_Corrected_Event, Original_Event)."],"qs":["Jak Xpertis odwraca albo koryguje operację już załadowaną (np. anulowane zatrudnienie, cofnięte rozwiązanie)?","Co, gdy korekta dotyczy okresu z zamkniętą listą płac?"],"refs":["P00-018","P00-019"]},{"id":"B08","area":"C","title":"Identyfikacja pracownika","facts":["Worker_Summary: WID – techniczny, niezmienny identyfikator Workday; Employee_ID – numer pracownika w Workday (w próbkach: litera i 7 cyfr).","Identyfikatory krajowe (np. PESEL) są w sekcji Person_Identification (proces P08)."],"qs":["Jak Xpertis identyfikuje pracownika w bazie pracodawcy i kto nadaje ten identyfikator?","Gdzie i kto prowadzi powiązanie Employee_ID ↔ identyfikator Xpertis?","Jak powiązać pracowników, którzy już są w Xpertis, z ich Employee_ID z Workday?"],"refs":["P00-011","P00-012"]},{"id":"B09","area":"C","title":"Routing do baz pracodawców","facts":["Nagłówek Summary ma Payroll_Company_Code i Pay_Group_Code; sekcja Position wskazuje organizacje pracownika, w tym spółkę (Company)."],"qs":["Ile jest baz produkcyjnych i jaka dana wskazuje bazę: spółka płacowa, grupa płacowa czy inna?","Czy jeden pracodawca może mieć kilka grup płacowych?","Kto utrzymuje tabelę routingu i jak trafia do niej nowa spółka?"],"refs":["P00-003","P00-004"]},{"id":"B10","area":"C","title":"Przeniesienia między pracodawcami","facts":["Przeniesienie do innej spółki: PCO w grupie płacowej dotychczasowej spółki i PCI w grupie nowej; PCI niesie pełny zestaw danych jak HIR (proces P27).","Zmiana grupy płacowej w tej samej spółce: PGO + PGI (proces P28)."],"qs":["Jak Xpertis obsługuje przejście: zakończenie w jednej bazie i zatrudnienie w drugiej? Jakie dane przenosi?","W jakiej kolejności przetwarzać PCO i PCI, jeśli przyjdą w różnych plikach?"],"refs":[]},{"id":"B11","area":"C","title":"Kilka zatrudnień jednej osoby","facts":["Pracownik może mieć kilka pozycji (Position) – główną i dodatkowe; każda ma własny Position_ID (proces P18)."],"qs":["Czy Xpertis obsługuje kilka umów jednej osoby u tego samego pracodawcy?","Jak powiązać pozycję z Workday z umową w Xpertis?"],"refs":[]},{"id":"B12","area":"D","title":"Formaty i typy danych","facts":["PECI wysyła daty xs:date z przesunięciem strefy (RRRR-MM-DD±hh:mm), momenty xs:dateTime, wartości logiczne 1/0, liczby z kropką dziesiętną, tekst UTF-8 i identyfikatory z wiodącymi zerami.","Słownik PECI nie podaje maksymalnych długości tekstu; długości z próbek pokazuje karta danej."],"qs":["Jakie formaty przyjmuje Xpertis: daty, kwoty, liczby, wartości logiczne?","Kodowanie znaków i długości pól w Xpertis – co, gdy wartość jest dłuższa?","Czy konwersję typów robi baza pośrednicząca, czy mechanizm ładowania Xpertis?"],"refs":[]},{"id":"B13","area":"D","title":"Kody i mapowanie wartości","facts":["Pola kodowe przychodzą jako Reference ID z Workday albo jako wartość z mapy integracyjnej (Mapped_Value), jeśli Workday ją skonfiguruje.","Część pól jest w konfiguracji PECI Chorus oznaczona jako mapowana (Field Mapped) – pokazuje to karta danej."],"qs":["Gdzie tłumaczyć kody Workday na kody Xpertis: w Workday (mapy integracyjne) czy w bazie pośredniczącej (tabele słownikowe)?","Kto utrzymuje słowniki i jak zgłaszać nowe wartości?","Co, gdy przyjdzie kod bez odpowiednika w Xpertis?"],"refs":[]},{"id":"B14","area":"D","title":"Dane, których nie ma w PECI","facts":["Sekcja Additional_Information przenosi pola niestandardowe i wyliczane zdefiniowane w konfiguracji PECI.","Inne możliwości: osobny raport z Workday tym samym kanałem SFTP albo wprowadzanie danych w Xpertis."],"qs":["Jakich danych Xpertis potrzebuje, a PECI ich nie wysyła? Lista per proces – zakładka „Dane spoza PECI”.","Które źródło wybrać dla każdej z nich i kto za nie odpowiada?"],"refs":["P01-106"]},{"id":"B15","area":"D","title":"Dane referencyjne","facts":["PECI przesyła dane pracowników z odwołaniami do obiektów organizacyjnych (spółka, MPK, lokalizacja, stanowisko, grupa płacowa), ale nie przesyła samych słowników organizacyjnych."],"qs":["Czy Xpertis potrzebuje słowników organizacyjnych (spółki, MPK, lokalizacje, stanowiska)?","Skąd i jak często je aktualizować?"],"refs":[]},{"id":"B16","area":"D","title":"Zakres osób","facts":["PECI obejmuje pracowników przypisanych do grup płacowych. Osób prowadzonych w Workday jako Contingent Worker (np. umowy cywilnoprawne) PECI nie obejmuje – Workday ma do tego osobny interfejs (WECI)."],"qs":["Czy Xpertis obsługuje osoby spoza umów o pracę? Jeśli tak – skąd mają przychodzić ich dane?"],"refs":[]},{"id":"B17","area":"E","title":"Walidacja przed załadowaniem","facts":["Brak sekcji albo elementu w pliku oznacza brak zmiany albo brak danych w Workday – nie wartość pustą."],"qs":["Jakie reguły walidacji stosuje baza pośrednicząca (dane wymagane, formaty, sumy kontrolne np. PESEL, rachunek)?","Co blokuje cały plik, a co tylko jednego pracownika albo jedną zmianę?"],"refs":[]},{"id":"B18","area":"E","title":"Kolejka wyjątków","facts":["Poprawka wprowadzona w Workday przyjdzie w kolejnym pliku jako nowa zmiana albo korekta."],"qs":["Kto obsługuje błędy: zespół Xpertis, dział płac, kadry?","Jak poprawiać błąd: w Workday (poprawka w kolejnym pliku) czy ręcznie w bazie pośredniczącej?","Jak ponowić przetworzenie i jak je udokumentować?"],"refs":[]},{"id":"B19","area":"E","title":"Informacja zwrotna i monitoring","facts":["PECI przesyła dane w jedną stronę – z Workday do systemu płacowego."],"qs":["Czy wynik przetworzenia (sukces, błędy) ma wracać do Workday albo do zespołu kadr? W jakiej formie: raport, e-mail, plik przez SFTP?","Kto monitoruje przebieg i w jakim czasie reaguje na błąd?"],"refs":[]},{"id":"B20","area":"F","title":"Mechanizm ładowania","facts":[],"qs":["Jak dane trafiają do baz produkcyjnych: import plikowy, procedury bazodanowe, interfejs programistyczny Xpertis?","Czy ładowanie ma być automatyczne, czy z zatwierdzeniem przez użytkownika?","Czy operacje kadrowe w Xpertis (np. przyjęcie, aneks, zwolnienie) mają własną logikę, którą trzeba wywołać zamiast zapisu do tabel?"],"refs":[]},{"id":"B21","area":"F","title":"Okna ładowania i zamknięte okresy","facts":["Nagłówek wskazuje okres płacowy (Pay_Period_Start / End); zmiany wsteczne mogą dotyczyć okresów już rozliczonych."],"qs":["Kiedy wolno ładować dane (godziny, blokady w trakcie naliczania listy płac)?","Co ze zmianą wsteczną do okresu z zamkniętą listą płac: korekta automatyczna czy zadanie dla działu płac?"],"refs":["P00-005"]},{"id":"B22","area":"F","title":"Działania uruchamiane w Xpertis","facts":[],"qs":["Czy załadowanie zmiany ma uruchamiać w Xpertis dalsze działania (np. zgłoszenia, przeliczenia)? Kto je zatwierdza?"],"refs":[]},{"id":"B23","area":"G","title":"Dane osobowe i dane szczególne","facts":["PECI zawiera dane osobowe: identyfikatory krajowe, adresy, rachunki bankowe, członków rodziny. Karta danej pokazuje klasyfikację z projektu.","W próbkach są też dane szczególne (np. Religion); zakres sekcji i pól ustala konfiguracja PECI."],"qs":["Których danych Xpertis nie potrzebuje i można je wyłączyć w konfiguracji PECI?","Szyfrowanie w transporcie i w bazie pośredniczącej, uprawnienia, rejestr dostępu.","Jak długo przechowywać pliki i dane w bazie pośredniczącej? Udział IOD."],"refs":["P00-024"]},{"id":"B24","area":"H","title":"Środowiska i pliki testowe","facts":["Typy i przykłady w tym narzędziu pochodzą z próbek PECI innych krajów – ostatecznym potwierdzeniem jest plik PECI z tenanta PL."],"qs":["Jakie środowiska (test, produkcja) mają Workday i Xpertis i jak je połączyć?","Kiedy będzie plik PECI z tenanta PL i jakie scenariusze ma obejmować?","Dane testowe: zanonimizowane czy rzeczywiste?"],"refs":[]},{"id":"B25","area":"H","title":"Stan początkowy i pierwsze załadowanie","facts":["Nagłówek ma znacznik Full_Snapshot – PECI może wysłać pełny obraz danych zamiast samych zmian."],"qs":["Czy pracownicy już są w Xpertis (migracja), czy pierwsze załadowanie ma przyjść z Workday?","Jak uzgodnić stan Xpertis z Workday w dniu uruchomienia i od którego pliku zaczynają się zmiany?"],"refs":["P00-008"]},{"id":"B26","area":"H","title":"Odpowiedzialność i utrzymanie","facts":[],"qs":["Kto jest właścicielem bazy pośredniczącej i jej elementów: kanału, słowników, routingu, kolejki wyjątków?","Czas reakcji na brak pliku i błędy; ścieżka eskalacji między Workday, Xpertis i Saint-Gobain."],"refs":[]}],"sessions":[{"id":"W1","title":"Plik PECI i odbiór pliku","goal":"Wspólne zrozumienie pliku PECI: budowa, typy danych, zdarzenia, nagłówek. Kanał SFTP i harmonogram.","procs":["P00"],"topics":["B01","B02","B03"]},{"id":"W2","title":"Wejście do pracy","goal":"Czego Xpertis potrzebuje przy zatrudnieniu, ponownym zatrudnieniu i korektach. Identyfikacja pracownika i routing do bazy pracodawcy.","procs":["P01","P02","P03","P04"],"topics":["B08","B09"]},{"id":"W3","title":"Dane osobowe","goal":"Zmiany danych osobowych, dokumentów, adresów, rachunku i rodziny. Minimalizacja danych.","procs":["P05","P06","P07","P08","P09","P10","P11","P12","P13"],"topics":["B23"]},{"id":"W4","title":"Zatrudnienie, organizacja i wynagrodzenie","goal":"Zmiany stanowiska, umowy, kosztów i wynagrodzenia. Kody i mapowanie wartości.","procs":["P14","P15","P16","P17","P18","P19","P20","P21","P22"],"topics":["B11","B13"]},{"id":"W5","title":"Nieobecności, wyjście i przeniesienia","goal":"Nieobecności długotrwałe, rozwiązanie umowy, korekty i przeniesienia między pracodawcami.","procs":["P23","P24","P25","P26","P27","P28"],"topics":["B07","B10"]},{"id":"W6","title":"Projekt bazy pośredniczącej","goal":"Model danych, konwersja, walidacja, wyjątki, ładowanie do baz produkcyjnych, bezpieczeństwo, testy i uruchomienie.","procs":[],"topics":["B04","B05","B06","B12","B14","B15","B16","B17","B18","B19","B20","B21","B22","B24","B25","B26"]}]}</script>
<script type="application/json" id="peci-en">{"Anulowanie nieobecności":"Leave cancellation","Anulowanie rozwiązania":"Termination rescission","Anulowanie zatrudnienia":"Hire rescission","Kolejna nieobecność":"Subsequent leave","Korekta nieobecności":"Leave correction","Korekta powrotu":"Return correction","Korekta rozwiązania":"Termination correction","Korekta zatrudnienia":"Hire correction","Nieobecność":"Leave of absence","Powrót":"Return","Przeniesienie – wejście":"Transfer – in","Przeniesienie – wyjście":"Transfer – out","Rozwiązanie":"Termination","Zmiana danych":"Data change","Zmiana grupy – wejście":"Pay group change – in","Zmiana grupy – wyjście":"Pay group change – out","Zmiana organizacji":"Organisation change","Często poprzedzone zdarzeniami DTA w tym samym pliku.":"Often preceded by DTA events in the same file.","Is_Rehire rozróżnia ponowne zatrudnienie.":"Is_Rehire distinguishes a rehire.","Pełny zestaw danych jak przy HIR.":"Full data set as for HIR.","Występuje z DTA.":"Occurs together with DTA.","Zależnie od konfiguracji zmiana MPK może przyjść jako DTA.":"Depending on configuration, a cost-centre change may arrive as DTA.","P05–P22":"P05–P22","Anulowanie rozwiązania (rescind)":"Termination rescinded","Anulowanie zatrudnienia (rescind)":"Hire rescinded","Korekta daty końca lub rodzaju nieobecności":"Correction of leave end date or leave type","Korekta daty powrotu":"Correction of return date","Nowe lub ponowne zatrudnienie w grupie płacowej":"New hire or rehire in the pay group","Powrót i natychmiastowa kolejna nieobecność":"Return followed immediately by another leave","Powrót z nieobecności":"Return from leave","Pozostałe zmiany danych":"Other data changes","Wejście do tej grupy płacowej z grupy innej spółki płacowej (zmiana pracodawcy)":"Entry into this pay group from a pay group of another payroll company (employer change)","Wejście z innej grupy płacowej tej samej spółki (np. zmiana częstotliwości wypłat)":"Entry from another pay group of the s
