<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Uzgodnienia PECI–Xpertis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: warsztatowy stół roboczy — szyna procesów · lista pól procesu · karta pola (Workday → middleware → Xpertis) */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#EDF0F4; --ink:#16202C; --muted:#566273; --faint:#8791A0;
  --line:#DCE1E8; --line2:#C5CDD8;
  --wd:#1F5FA6; --wd-bg:#E7EFF9; --mw:#6244AC; --mw-bg:#EFEBFA; --xp:#1C7549; --xp-bg:#E4F3EA;
  --acc:#1B3A5C; --acc-ink:#FFFFFF; --acc-soft:#E4EBF3;
  --ok:#1C7446; --ok-bg:#E2F2E8; --warn:#93570A; --warn-bg:#FAEFDB; --err:#AE2A21; --err-bg:#FBE6E3;
  --info:#2D5C9A; --info-bg:#E6EDF7; --focus:#2F6FD0; --shadow:0 10px 30px rgba(18,30,45,.16);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --surface:#151C26; --sunken:#1C2531; --ink:#E4E9F0; --muted:#9AA6B6; --faint:#6F7B8C;
    --line:#263141; --line2:#334155;
    --wd:#73A9EA; --wd-bg:#17283D; --mw:#A98EEA; --mw-bg:#241D3A; --xp:#5FC48E; --xp-bg:#14301F;
    --acc:#9CC0EA; --acc-ink:#0E1A28; --acc-soft:#1B2A3C;
    --ok:#5BC489; --ok-bg:#15301F; --warn:#E2A651; --warn-bg:#352611; --err:#F27C70; --err-bg:#3A1A17;
    --info:#86AEE6; --info-bg:#172840; --focus:#7FB0F0; --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --sunken:#1C2531; --ink:#E4E9F0; --muted:#9AA6B6; --faint:#6F7B8C;
  --line:#263141; --line2:#334155;
  --wd:#73A9EA; --wd-bg:#17283D; --mw:#A98EEA; --mw-bg:#241D3A; --xp:#5FC48E; --xp-bg:#14301F;
  --acc:#9CC0EA; --acc-ink:#0E1A28; --acc-soft:#1B2A3C;
  --ok:#5BC489; --ok-bg:#15301F; --warn:#E2A651; --warn-bg:#352611; --err:#F27C70; --err-bg:#3A1A17;
  --info:#86AEE6; --info-bg:#172840; --focus:#7FB0F0; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--wd)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.93em;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.lbl{font:600 11px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{display:flex;gap:3px;align-items:center}
.brand-mark i{display:block;width:8px;height:18px;border-radius:2px}
.brand-mark i:nth-child(1){background:var(--wd)} .brand-mark i:nth-child(2){background:var(--mw)} .brand-mark i:nth-child(3){background:var(--xp)}
.brand b{font:600 15px/1.1 var(--f-cond);letter-spacing:.01em}
.brand small{display:block;font:400 11.5px/1.2 var(--f-ui);color:var(--muted)}
nav.views{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 360px;scrollbar-width:none}
nav.views::-webkit-scrollbar{display:none}
nav.views a{padding:6px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font:500 13.5px/1.2 var(--f-cond);letter-spacing:.02em;white-space:nowrap}
nav.views a:hover{color:var(--ink);background:var(--sunken)}
nav.views a[aria-current="page"]{background:var(--acc-soft);color:var(--ink)}
.top-right{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.shared i{background:var(--ok)} .conn.local i{background:var(--warn)} .conn.readonly i{background:var(--err)}
.team{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.team select,.team input{padding:4px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);max-width:190px}
.team input{width:150px}

.work{display:grid;grid-template-columns:232px minmax(0,1fr) minmax(400px,500px);gap:12px;min-height:0;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.work.wide{grid-template-columns:232px minmax(0,1fr)}
.work.full{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0;overflow:auto;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* rail */
.rail{padding-right:2px}
.rail h4{margin:14px 6px 6px;font:600 11px/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.rail h4:first-child{margin-top:2px}
.pr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 6px;align-items:center;width:100%;text-align:left;padding:6px 8px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:var(--ink)}
.pr:hover{background:var(--sunken)}
.pr[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2)}
.pr .pid{font:500 11.5px var(--f-mono);color:var(--muted)}
.pr .pn{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .pbar{grid-column:2/4;height:3px;border-radius:2px;background:var(--line);overflow:hidden;display:flex}
.pr .pbar b{display:block;height:100%}
.pr .pflag{font:500 11px var(--f-mono)}
.b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-info{background:var(--info)} .b-err{background:var(--err)}
.rail-select{display:none}

/* list pane */
.listpane{container-type:inline-size}
.phead{padding:18px 20px 14px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.phead .eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pidbig{font:500 12px var(--f-mono);padding:2px 7px;border-radius:5px;background:var(--sunken);color:var(--ink)}
.phead h1{font:600 22px/1.2 var(--f-cond);letter-spacing:.005em}
.phead p{margin:0;max-width:78ch;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 20px;margin-top:4px}
.facts div{min-width:0}
.facts dd{margin:3px 0 0;font-size:13px;overflow-wrap:anywhere}
.facts dt{font:600 11px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.risk{font-size:13px;color:var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:7px}
details.more>summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more>summary::before{content:"▸";font-size:10px;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary::-webkit-details-marker{display:none}

.progress{display:grid;gap:8px}
.pbig{height:8px;border-radius:4px;background:var(--line);display:flex;overflow:hidden}
.pbig b{height:100%}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}
.stats .e b{color:var(--err)} .stats .w b{color:var(--warn)}

.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.sign{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;min-width:0}
.sign .who{font:600 12px/1.2 var(--f-cond);letter-spacing:.04em;text-transform:uppercase}
.sign.wd .who{color:var(--wd)} .sign.xp .who{color:var(--xp)} .sign.mw .who{color:var(--mw)} .sign.sg .who{color:var(--acc)}
.sign .by{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.sign.done{background:var(--ok-bg);border-color:transparent}
.sign.done .by{color:var(--ok)}
.sign .acts{display:flex;gap:6px;flex-wrap:wrap}
.signwarn{grid-column:1/-1;font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.wsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:2px;padding:8px 14px 0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:8px 10px 9px;font:500 13.5px var(--f-cond);letter-spacing:.02em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tabs .cnt{font:500 11px var(--f-mono);padding:0 5px;border-radius:9px;background:var(--sunken);color:var(--muted)}
.tabs .cnt.e{background:var(--err-bg);color:var(--err)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1 1 200px;min-width:0;padding:6px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--surface)}
.toolbar select{padding:6px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);max-width:100%}
.toolbar .sp{flex:1}

.grp{position:sticky;top:43px;z-index:3;background:var(--sunken);padding:5px 14px;font:600 11.5px/1.3 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:4px 66px minmax(0,1fr) 14px minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px 14px 8px 0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.row:hover{background:var(--sunken)}
.row[aria-selected="true"]{background:var(--acc-soft)}
.row .stripe{grid-row:1/span 2;align-self:stretch;margin:-8px 0;border-radius:0 2px 2px 0}
.row .rid{font:500 11.5px var(--f-mono);color:var(--muted)}
.row .el{font:500 13px/1.3 var(--f-mono);overflow-wrap:anywhere;color:var(--ink)}
.row .sub{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.row .arrow{color:var(--faint);text-align:center}
.row .xpf{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.row .fmt{font:400 11.5px var(--f-mono);color:var(--xp)}
.row .fmt.miss{color:var(--faint)}
.row .meta{grid-column:3/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row .meta:empty{display:none}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2)}
.dots i.wd.on{background:var(--wd);border-color:var(--wd)} .dots i.xp.on{background:var(--xp);border-color:var(--xp)} .dots i.mw.on{background:var(--mw);border-color:var(--mw)}
.cmt{font:500 11px var(--f-mono);color:var(--muted)}
@container (max-width:520px){
  .row{grid-template-columns:4px 54px minmax(0,1fr);padding-right:12px}
  .row .arrow{display:none}
  .row .stripe{grid-row:1/span 3}
  .row .xpcell,.row .meta{grid-column:3}
}
.empty{padding:28px 20px;color:var(--muted);text-align:center}

.chip{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:999px;font:500 11.5px/19px var(--f-ui);border:1px solid transparent;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.c-neutral{background:var(--sunken);color:var(--muted)}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
.c-err{background:var(--err-bg);color:var(--err)} .c-info{background:var(--info-bg);color:var(--info)}
.c-faint{background:transparent;color:var(--faint);border-color:var(--line)}
.c-mw{background:var(--mw-bg);color:var(--mw)} .c-xp{background:var(--xp-bg);color:var(--xp)} .c-wd{background:var(--wd-bg);color:var(--wd)}
.c-add{background:transparent;color:var(--xp);border-color:var(--xp)}
.sev{font:600 11px var(--f-mono);padding:0 5px;border-radius:4px}
.sev.e{background:var(--err-bg);color:var(--err)} .sev.w{background:var(--warn-bg);color:var(--warn)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunken)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field>label,.field>.lbl{font:600 11px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:6px 9px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);min-width:0}
.field textarea{resize:vertical;min-height:58px;line-height:1.4}
.field input[type=radio],.field input[type=checkbox]{width:auto;padding:0}
.field input[disabled],.field select[disabled],.field textarea[disabled]{background:var(--sunken);color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}

/* detail */
.detail{display:flex;flex-direction:column;padding:0}
.dhead{position:sticky;top:0;z-index:4;background:var(--surface);padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.dtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dtop .ids{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dnav{display:flex;gap:4px;align-items:center}
.dnav .pos{font:500 12px var(--f-mono);color:var(--muted);padding:0 4px}
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--sunken)}
.dhead h2{font:500 18px/1.25 var(--f-mono);overflow-wrap:anywhere}
.dhead .secp{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.dbody{padding:14px 18px 18px;display:grid;gap:14px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 14px minmax(0,1fr);align-items:stretch;gap:4px}
.flow .fx{border-radius:8px;padding:8px 9px;display:grid;gap:3px;align-content:start;min-width:0}
.flow .fx .t{font:600 10.5px/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase}
.flow .fx .v{font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.flow .fx .v.mono{font-size:12px}
.flow .fx.wd{background:var(--wd-bg)} .flow .fx.wd .t{color:var(--wd)}
.flow .fx.mw{background:var(--mw-bg)} .flow .fx.mw .t{color:var(--mw)}
.flow .fx.xp{background:var(--xp-bg)} .flow .fx.xp .t{color:var(--xp)}
.flow .ar{display:grid;place-items:center;color:var(--faint);font-size:12px}
.checks{display:grid;gap:6px}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px;padding:7px 9px;border-radius:7px}
.ck.e{background:var(--err-bg);color:var(--err)} .ck.w{background:var(--warn-bg);color:var(--warn)} .ck.i{background:var(--info-bg);color:var(--info)}
.ck .ic{font:600 11px var(--f-mono);line-height:18px}
.blk{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.blk>h3{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font:600 12px/1.3 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.blk.wd>h3{background:var(--wd-bg);color:var(--wd)} .blk.mw>h3{background:var(--mw-bg);color:var(--mw)} .blk.xp>h3{background:var(--xp-bg);color:var(--xp)} .blk.ws>h3,.blk.cm>h3{background:var(--sunken);color:var(--muted)}
.blk>.in{padding:12px;display:grid;gap:12px}
dl.kv{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr);gap:7px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted);font-size:12px;padding-top:1px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.note{font-size:12.5px;background:var(--sunken);border-radius:7px;padding:8px 10px;color:var(--ink)}
.note .lbl{display:block;margin-bottom:2px}
.prop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.prop code{font-family:var(--f-mono);color:var(--mw);background:var(--mw-bg);padding:1px 6px;border-radius:4px}
.example{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);gap:6px;align-items:end}
.example .ar{color:var(--faint);text-align:center;padding-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rchip{display:inline-flex;align-items:center;gap:4px;padding:1px 4px 1px 8px;border-radius:999px;background:var(--mw-bg);color:var(--mw);font-size:12px}
.rchip button{border:0;background:transparent;color:inherit;cursor:pointer;padding:0 3px;font-size:13px;line-height:1}
.rdesc{font-size:12px;color:var(--muted);display:grid;gap:3px}
.confs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.conf{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--surface);cursor:pointer;text-align:left;display:grid;gap:2px;min-width:0}
.conf .p{font:600 11.5px/1.2 var(--f-cond);letter-spacing:.05em;text-transform:uppercase}
.conf .s{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.conf.wd .p{color:var(--wd)} .conf.xp .p{color:var(--xp)} .conf.mw .p{color:var(--mw)}
.conf.on.wd{background:var(--wd-bg);border-color:var(--wd)} .conf.on.xp{background:var(--xp-bg);border-color:var(--xp)} .conf.on.mw{background:var(--mw-bg);border-color:var(--mw)}
.conf[disabled]{cursor:not-allowed;opacity:.7}
.comments{display:grid;gap:8px}
.cm1{display:grid;gap:3px;padding:8px 10px;border-radius:8px;background:var(--sunken)}
.cm1 .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.cm1 .h b{color:var(--ink);font-weight:600}
.cm1 .tx{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm1 .del{margin-left:auto;border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:11.5px}
.composer{display:grid;gap:6px}
.composer .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.composer select{padding:4px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);max-width:100%}
.dfoot{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:auto}
.dfoot .sp{flex:1}
.placeholder{padding:32px 26px;display:grid;gap:14px;color:var(--muted);align-content:start}
.placeholder h3{font:600 16px var(--f-cond);color:var(--ink)}
.placeholder ol{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}
.kbd{font:500 11px var(--f-mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink)}
.backdrop{display:none}
.issues-mini{display:grid;gap:6px}
.imini{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.imini a{font-family:var(--f-mono);font-size:12px}
.catres{display:grid;gap:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
.catres button{display:grid;gap:1px;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.catres button:hover{background:var(--sunken)}
.catres .e{font:500 12.5px var(--f-mono)}
.catres .d{font-size:11.5px;color:var(--muted)}

/* tables & views */
.view{padding:18px 20px;display:grid;gap:16px;align-content:start}
.view h1{font:600 22px/1.2 var(--f-cond)}
.view .lead{margin:0;color:var(--muted);max-width:80ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;background:var(--surface)}
.kpi .v{font:600 24px/1.1 var(--f-cond);font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi.e .v{color:var(--err)} .kpi.w .v{color:var(--warn)} .kpi.o .v{color:var(--ok)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--sunken);text-align:left;font:600 11px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunken)}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input,table.t select,table.t textarea{width:100%;min-width:90px;padding:4px 7px;border:1px solid var(--line2);border-radius:6px;background:var(--surface)}
table.t textarea{min-height:34px;resize:vertical}
.minibar{width:90px;height:6px;border-radius:3px;background:var(--line);display:inline-flex;overflow:hidden;vertical-align:middle;margin-right:6px}
.minibar b{height:100%}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.ilist{display:grid;gap:10px}
.icard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.icard.focus{box-shadow:0 0 0 2px var(--focus)}
.icard .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icard .h .id{font:500 13px var(--f-mono)}
.icard p{margin:0;font-size:13px}
.icard .why{color:var(--muted)}
.splitv{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.dl-list{display:grid;gap:2px}
.dl-list button{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px;align-items:center;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--ink)}
.dl-list button:hover{background:var(--sunken)}
.dl-list button[aria-current="true"]{background:var(--acc-soft)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;max-width:min(420px,calc(100% - 32px))}
.toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}
.banner{grid-column:1/-1;font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}

@media (max-width:1279px){
  .work,.work.wide{grid-template-columns:220px minmax(0,1fr)}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);z-index:50;border-radius:0;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
  .detail.closed{display:none}
  .backdrop.on{display:block;position:fixed;inset:0;z-index:45;background:rgba(10,16,24,.35)}
}
@media (max-width:860px){
  .app{height:auto;min-height:100%;display:block}
  .top{position:sticky;top:env(safe-area-inset-top,0px)}
  .work,.work.wide,.work.full{display:block;padding-block:10px}
  .rail{display:none}
  .rail-select{display:block;margin-bottom:10px}
  .rail-select select{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
  .pane{overflow:visible}
  .tabs{top:calc(env(safe-area-inset-top,0px) + var(--toph,52px))}
  .grp{top:calc(env(safe-area-inset-top,0px) + var(--toph,52px) + 43px)}
  .detail{width:100%;left:0;padding-left:env(safe-area-inset-left,0px);overflow:auto}
  .phead{padding:14px 14px 12px}
  .view{padding:14px 12px}
  .splitv{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow .ar{transform:rotate(90deg);height:12px}
  .confs{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

  <main class="work" id="work">

sample":"Wszystkie scenariusze","risk":"Routing do 22 baz; idempotencja i kolejność zmian; zmiany wsteczne do zamkniętych list płac."},{"id":"P01","grp":"A. Wejście","name":"Zatrudnienie nowego pracownika","desc":"Pierwsze zatrudnienie osoby u pracodawcy w Polsce. PECI przesyła pełny zestaw sekcji; to proces bazowy – pozostałe procesy wejścia opisują różnice względem P01.","bp":"Hire Employee (z: Propose Compensation Hire, Maintain Employee Contracts, Assign Pay Group, Edit Service Dates, Manage Probation Period)","events":"HIR","sections":"Worker_Status, Personal, Person_Communication, Person_Identification, Position, Compensation, Compensation_Plans, Payment_Election, Employee_Contract, Collective_Agreement, Costing_Allocation, Union_Member, Additional_Information","xop":"Utworzenie kartoteki pracownika w bazie pracodawcy: dane osobowe, umowa o pracę, stanowisko i czas pracy, składniki płacowe, rachunek, podział kosztów; dane do zgłoszenia ZUS.","routing":"Pracodawca z Payroll_Company / Organization (Company)","sample":"Scenariusz 1 (umowa na czas nieokreślony); 12 (umowa terminowa)","risk":"Dane ZUS/PIT/PPK spoza PECI; struktura adresu; semantyka dat stażowych; numer ewidencyjny Xpertis."},{"id":"P02","grp":"A. Wejście","name":"Ponowne zatrudnienie","desc":"Zatrudnienie osoby, która wcześniej pracowała w Grupie (Is_Rehire = 1). Pełny zestaw danych jak w P01 – w mapowaniu tylko pola, które różnią ten proces.","bp":"Hire Employee (rehire)","events":"HIR (Is_Rehire = 1), czasem poprzedzone DTA","sections":"Jak P01","xop":"Nowe zatrudnienie w istniejącej kartotece (ta sama baza) albo nowa kartoteka (inna baza).","routing":"Jak P01","sample":"Scenariusz 12","risk":"Identyfikacja osoby w Xpertis; daty stażowe; dane poprzedniego rozwiązania w tym samym pliku."},{"id":"P03","grp":"A. Wejście","name":"Korekta daty zatrudnienia","desc":"Zmiana daty zatrudnienia po jej wprowadzeniu: na późniejszą (anulowanie + ponowne zatrudnienie) albo na wcześniejszą (korekta).","bp":"Correct Hire / Rescind Hire + Hire","events":"HIR-R + HIR (na późniejszą); HIR-C + DTA (na wcześniejszą)","sections":"Worker_Status (wartości poprzednie), Position, Compensation_Plans, Employee_Contract, Costing_Allocation, Transaction_Log","xop":"Zmiana daty przyjęcia i dat zależnych (umowa, składniki, MPK); korekta zgłoszenia ZUS, jeśli zostało wysłane.","routing":"Jak P01","sample":"Scenariusze 27, 28","risk":"Korekta po zamknięciu listy płac; HIR-R nie może usunąć kartoteki, gdy w tym samym pliku jest HIR."},{"id":"P04","grp":"A. Wejście","name":"Anulowanie zatrudnienia (niestawienie się)","desc":"Wycofanie zatrudnienia przed rozpoczęciem pracy (no show).","bp":"Rescind Hire","events":"HIR-R","sections":"Worker_Status (Hire_Rescinded), Position","xop":"Anulowanie przyjęcia; weryfikacja zgłoszeń ZUS i list płac.","routing":"Jak P01","sample":"Scenariusz 19","risk":"Anulowanie po zgłoszeniu do ZUS lub po zamknięciu listy płac."},{"id":"P05","grp":"B. Dane osobowe","name":"Zmiana imienia lub nazwiska","desc":"Zmiana danych osobowych prawnych (np. po zawarciu małżeństwa).","bp":"Change Legal Name","events":"DTA","sections":"Personal (Legal_Name z wartością poprzednią)","xop":"Aktualizacja danych osobowych z datą zmiany; zgłoszenie zmiany danych do ZUS po stronie Xpertis.","routing":"Wszystkie bazy, w których osoba ma aktywne zatrudnienie","sample":"Scenariusz 2","risk":"Historia nazwisk w Xpertis; spójność między bazami."},{"id":"P06","grp":"B. Dane osobowe","name":"Nazwisko rodowe","desc":"Dodanie lub zmiana dodatkowego nazwiska typu Birth (nazwisko rodowe).","bp":"Change Additional Names","events":"DTA","sections":"Personal (Additional_Name)","xop":"Aktualizacja nazwiska rodowego, jeśli Xpertis je prowadzi.","routing":"Jak P05","sample":"Scenariusz 24","risk":"—"},{"id":"P07","grp":"B. Dane osobowe","name":"Stan cywilny","desc":"Zmiana stanu cywilnego. Proponowane wyłączenie z integracji (minimalizacja danych).","bp":"Change Personal Information","events":"DTA","sections":"Personal (Marital_Status)","xop":"Brak – dane nie są potrzebne w płacach (do potwierdzenia).","routing":"—","sample":"Scenariusz 25","risk":"Minimalizacja danych (K-13)."},{"id":"P08","grp":"B. Dane osobowe","name":"Dokumenty tożsamości","desc":"Zmiana numeru PESEL, dodanie lub zmiana dokumentu tożsamości (dowód, paszport, dokument pobytowy).","bp":"Edit Government IDs / Passports and Visas","events":"DTA","sections":"Person_Identification","xop":"Aktualizacja PESEL lub dokumentu tożsamości (paszport dla osób bez PESEL).","routing":"Jak P05","sample":"Scenariusze 23, 5","risk":"Walidacja PESEL; cudzoziemcy bez PESEL."},{"id":"P09","grp":"B. Dane osobowe","name":"Adres i dane kontaktowe","desc":"Zmiana adresu zamieszkania, korespondencyjnego, telefonu lub e-maila.","bp":"Change Contact Information","events":"DTA","sections":"Person_Communication","xop":"Aktualizacja adresu (z datą od), telefonu i e-maila.","routing":"Jak P05","sample":"Scenariusz 3","risk":"Komponenty adresu dla ZUS/PIT; elementy powtarzalne (isDeleted/isAdded)."},{"id":"P10","grp":"B. Dane osobowe","name":"Rachunek bankowy","desc":"Dodanie lub zmiana rachunku do wypłaty wynagrodzenia.","bp":"Add / Change Payment Elections","events":"DTA","sections":"Payment_Election","xop":"Aktualizacja rachunku do wypłaty (z datą od).","routing":"Wszystkie bazy z aktywnym zatrudnieniem","sample":"Scenariusze 4, 22","risk":"Walidacja IBAN/NRB; podział na kilka rachunków (K-31)."},{"id":"P11","grp":"B. Dane osobowe","name":"Członkowie rodziny","desc":"Dodanie, zmiana lub usunięcie osoby powiązanej (członek rodziny, osoba na utrzymaniu).","bp":"Add / Edit / Remove Dependent","events":"DTA","sections":"Related_Person, Related_Person_Communication, Related_Person_Identification","xop":"Dane członków rodziny do zgłoszenia do ubezpieczenia zdrowotnego – jeśli w zakresie.","routing":"Jak P05","sample":"Scenariusze 13, 14, 15","risk":"DD: dane rodziny poza zakresem PL (K-28); dane osób trzecich."},{"id":"P12","grp":" ja","name":"Zmiana MPK / podziału kosztów","desc":"Zmiana centrum kosztów (MPK) lub procentowego podziału kosztów wynagrodzenia.","bp":"Change Organization Assignments for Worker; Assign Costing Allocation","events":"DTA lub ORG","sections":"Position (Organization), Costing_Allocation","xop":"Zmiana MPK i podziału kosztów z datą od.","routing":"Bez zmiany bazy","sample":"Scenariusz 8","risk":"Słownik MPK aktualny w Xpertis (P30)."},{"id":"P17","grp":"C. Zatrudnienie i organizacja","name":"Zmiana umowy: rodzaj i data końca","desc":"Kolejna umowa (okres próbny → czas określony → czas nieokreślony) albo zmiana przewidywanej daty końca umowy terminowej.","bp":"Maintain Employee Contracts; Edit Service Dates","events":"DTA","sections":"Employee_Contract, Worker_Status (End_Employment_Date), Position (Worker_Type)","xop":"Nowa umowa o pracę lub aneks zmieniający datę końca umowy.","routing":"Bez zmiany bazy","sample":"Scenariusz 26 (data końca); brak próbki zmiany rodzaju umowy","risk":"W PL każda kolejna umowa to nowy dokument z datą zawarcia; limity umów terminowych."},{"id":"P18","grp":"C. Zatrudnienie i organizacja","name":"Dodatkowe zatrudnienie","desc":"Dodanie i zakończenie dodatkowego zatrudnienia (pozycja niegłówna) u tego samego pracodawcy.","bp":"Add Additional Job; End Additional Job","events":"DTA","sections":"Position (pozycja dodatkowa), Compensation, Compensation_Plans, Costing_Allocation","xop":"Dodatkowa umowa u tego samego pracodawcy (jeśli dopuszczalna) i jej zakończenie.","routing":"Bez zmiany bazy","sample":"Scenariusz 16; brak próbki zakończenia (scenariusz 17 pusty)","risk":"Czy Xpertis prowadzi drugą umowę jako odrębne zatrudnienie."},{"id":"P19","grp":"C. Zatrudnienie i organizacja","name":"Związek zawodowy","desc":"Przystąpienie do związku zawodowego lub wystąpienie z niego.","bp":"Manage Union Membership","events":"DTA","sections":"Union_Member","xop":"Potrącanie składki związkowej – jeśli stosowane.","routing":"Bez zmiany bazy","sample":"Sekcj  zakończenia u dotychczasowego pracodawcy ani podstawy przejścia (art. 23¹ KP, porozumienie trójstronne, rozwiązanie i nowa umowa).","why":"Xpertis nie zakończy poprawnie zatrudnienia w bazie A ani nie założy zatrudnienia w bazie B (świadectwo pracy, ciągłość stażu, urlop).","prop":"Obowiązkowe pole PL w procesie Change Job (przeniesienie) w Workday, przekazywane w sekcji Additional Information.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: scenariusz 31"},{"id":"K-04","type":"Kwestia","proc":"P27","area":"Umowa","desc":"W próbce PCI sekcja Employee_Contract ma datę początku sprzed przeniesienia (umowa kontynuowana).","why":"Trzeba ustalić, czy w bazie B zakładamy nową umowę od dnia przeniesienia, czy kontynuację.","prop":"Reguła T16 zależna od trybu przejścia (K-03).","prio":"Wysoki","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: scenariusz 31"},{"id":"K-05","type":"Ryzyko","proc":"P27","area":"Daty","desc":"Company_Service_Date wypełnia ręcznie HR w procesie Change Job (definicja Chorus).","why":"Brak lub błędna data = błędna data zatrudnienia i staż w bazie B.","prop":"Walidacja w middleware: przy PCI Company_Service_Date = data skuteczności; inaczej kolejka wyjątków.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-06","type":"Kwestia","proc":"P01","area":"Daty stażowe","desc":"Rozbieżne definicje: słownik PECI – Hire_Date to data zatrudnienia w spółce; Data Dictionary (1.1.4) – pierwsza data zatrudnienia w Grupie.","why":"Błędna data zatrudnienia lub stażu w Xpertis (urlop, dodatki stażowe, jubileusze).","prop":"Ustalić znaczenie Hire_Date, Original_Hire_Date, Continuous_Service_Date i Company_Service_Date dla PL; opisać w T19.","prio":"Wysoki","owner":"Zespół Chorus (globalny)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI vs Data Dictionary"},{"id":"K-07","type":"Kwestia","proc":"P01","area":"Ubezpieczenia i podatki","desc":"Dane płacowe PL spoza standardu PECI: kod tytułu ubezpieczenia, prawo do emerytury/renty, urząd skarbowy, koszty uzyskania przychodu, oświadczenie PIT-2, PPK.","why":"Bez nich Xpertis nie zgłosi pracownika do ZUS ani nie naliczy poprawnie zaliczki PIT.","prop":"Dane wynikające z dokumentów pracownika prowadzić w Xpertis (dział płac); w Workday tylko dane z procesu HR. Decyzja per pole w P01.","prio":"Wysoki","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza wymagań PL"},{"id":"K-08","type":"Kwestia","proc":"P01, P09","area":"Adres","desc":"Czy konfiguracja adresu PL w Workday zawiera województwo, powiat, gminę, ulicę, nr domu i nr lokalu jako osobne pola? Data Dictionary oznacza Region i Region Subdivision jako zakres PL.","why":"Adres zamieszkania jest potrzebny w zgłoszeniu do ZUS i w PIT-11.","prop":"Jeśli brak – wzbogacenie w middleware z TERYT (T09) z kolejką wyjątków dla przypadków niejednoznacznych.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.5"},{"id":"K-09","type":"Kwestia","proc":"P01","area":"Staż pracy","desc":"Staż u poprzednich pracodawców (External Job History; DD: zakres PL i payroll) nie jest przesyłany w PECI.","why":"Wymiar urlopu, dodatek stażowy, nagroda jubileuszowa.","prop":"Prowadzić staż w Xpertis na podstawie świadectw pracy albo dodać raport/API z Workday.","prio":"Średni","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 7.3"},{"id":"K-10","type":"Kwestia","proc":"P13","area":"Wykształcenie","desc":"Sekcja Education jest w PECI; DD oznacza ją jako zakres PL i payroll. Czy Xpertis potrzebuje wykształcenia do stażu urlopowego?","why":"Wymiar urlopu wypoczynkowego (art. 155 KP).","prop":"Jeśli tak – słownik S32 i reguła wyboru najwyższego ukończonego poziomu.","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 7.6"},{"id":"K-11","type":"Kwestia","proc":"P12","area":"Dane szczególne","desc":"Niepełnosprawność: DD – Disability Type w zakresie PL i payroll; oznaczone jako dane szczególne wg RODO (kol. M), ale nie w kolumnie lokalnej (kol. N). Data ważności orzeczenia (End Date) jest poza zakresem PECI w Chorus.","why":"Kod ubezpieczenia, PFRON, wymiar urlopu i czasu pracy; zgodność z RODO.","prop":"Ujednolicić klasyfikację z IOD; zdecydować, czy dane prowadzić w Workday czy wyłącznie w Xpertis.","prio":"Wysoki","owner":"SG – IOD","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.8; słownik PECI"},{"id":"K-12","type":"Kwestia","proc":"P19","area":"Dane szczególne","desc":"Członkostwo w związku zawodowym (dane szczególne) – DD: zakres PL, bez flagi payroll. Czy Xpertis potrąca składki związkowe?","why":"Potrącenie wymaga informacji o członkostwie.","prop":"Jeśli potrącenia są stosowane – przekazywać tylko kod związku i daty, bez zapisu wartości w logach.","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 4.3"},{"id":"K-13","type":"Decyzja","proc":"P07","area":"Minimalizacja","desc":"Stan cywilny: DD – zakres PL, Ściśle poufne, bez flagi payroll; DTM: „nie raportujemy (wymóg prawny)”.","why":"Przekazanie do płac byłoby niezgodne z zasadą minimalizacji.","prop":"Wyłączyć z integracji: filtr w middleware i wyłączenie pola w konfiguracji PECI dla PL.","prio":"Średni","owner":"SG – IOD","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.8; DTM"},{"id":"K-14","type":"Ryzyko","proc":"P00","area":"Dane szczególne","desc":"Próbki PECI zawierają pole Religion (słownik Chorus: w zakresie), a Data Dictionary wyklucza je dla PL jako dane szczególne.","why":"Przetwarzanie danych szczególnych w middleware bez podstawy.","prop":"Wyłączyć Religion i Ethnicity w konfiguracji PECI dla PL; dodatkowo filtr w middleware (T18).","prio":"Wysoki","owner":"Zespół Chorus (globalny)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: scenariusze 27, 28"},{"id":"K-15","type":"Kwestia","proc":"P29","area":"Zakres","desc":"Contingent Worker (DD 1.16: zakres PL i payroll) nie jest obejmowany przez PECI (służy do tego WECI).","why":"Jeśli Xpertis rozlicza umowy cywilnoprawne osób prowadzonych w Workday – brak przepływu danych.","prop":"Ustalić, kto jest Contingent Workerem w PL i czy Xpertis go rozlicza.","prio":"Wysoki","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 1.16"},{"id":"K-16","type":"Kwestia","proc":"P22","area":"Zakres","desc":"Płatności jednorazowe: sekcja dostępna w PECI, w DD poza zakresem PL.","why":"Premie i nagrody jednorazowe muszą trafić na listę płac.","prop":"Ustalić, czy są wprowadzane w Workday (P22 w zakresie) czy bezpośrednio w Xpertis.","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 4.5"},{"id":"K-17","type":"Kwestia","proc":"P21","area":"Składniki płacowe","desc":"Kody składników (Compensation Earnings and Deductions) mapuje zadanie Workday „Maintain External Payroll Earnings”; sekcja nie ma oznaczenia zakresu w słowniku Chorus.","why":"Kody zewnętrzne muszą odpowiadać składnikom Xpertis – wspólnym dla 22 baz albo różnym per baza.","prop":"Kody wspólne – mapowanie w Workday; różne per baza – słownik S17 w middleware.","prio":"Wysoki","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-18","type":"Ryzyko","proc":"Wszystkie","area":"Słowniki","desc":"W próbkach część wartości to techniczne identyfikatory Workday (np. EMPLOYEE_CONTRACT_TYPE-6-72, TERMINATION_CATEGORY-6-5), a te same pola mają raz kody, raz nazwy (np. „Mutual Consent”).","why":"Mapowanie na technicznych ID jest kruche i może różnić się między tenantami.","prop":"Dla PL wymagać stabilnych Reference ID lub integration map dla każdego pola kodowego.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: próbki"},{"id":"K-19","type":"Kwestia","proc":"Wszystkie","area":"DTM","desc":"Część podpowiedzi z DTM (migracja) jest błędna: National ID → „narodowość”, National ID Type → „kod narodowości”, Government ID → „obywatelstwo”, Company Service Date → „data do”, Pay Group ID → „Hay class”, Expiration Date → „data umowy ekspatriacyjnej”.","why":"Ryzyko przeniesienia błędów z migracji do interfejsu.","prop":"Kolumnę „Podpowiedź z DTM” traktować pomocniczo; poprawić DTM.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"DTM Core V3"},{"id":"K-20","type":"Kwestia","proc":"Wszystkie","area":"Daty","desc":"Daty w próbkach mają format xs:date ze strefą (np. 2025-10-01-07:00) albo dd/mm/rrrr (konwersja w Excelu).","why":"Przesunięcie dnia przy konwersji stref czasowych.","prop":"Reguła T01: część daty bez przeliczania strefy; potwierdzić na plikach PL.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: próbki"},{"id":"K-21","type":"Kwestia","proc":"Wszystkie","area":"Testy","desc":"Próbki pochodzą z tenantów testowych innych krajów (AR, TH, CH, DE i in.). Brak próbki End Additional Job (scenariusz 17).","why":"Wartości PL (kody, adres, dokumenty) mogą się różnić.","prop":"Wygenerować pliki PECI z tenantu PL dla każdego procesu z arkusza Procesy.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: zakładka Business Processes"},{"id":"K-22","type":"Kwestia","proc":"P23","area":"Nieobecności","desc":"Sekcja Time Off jest poza zakresem PECI; w zakresie jest tylko Leave of Absence. Które nieobecności długotrwałe prowadzimy w Workday dla PL i jak mapują się na typy w Xpertis?","why":"Skutki płacowe i ubezpieczeniowe zależą od rodzaju nieobecności.","prop":"Lista typów LOA dla PL ze skutkiem w Xpertis (S27); nieobecności krótkie pozostają poza Workday.","prio":"Wysoki","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-23","type":"Kwestia","proc":"P20","area":"Zakres","desc":"Oddelegowania (International Assignment): pola PECI ze statusem „process TBD”, DD – zakres PL i payroll.","why":"Wpływ na składki, podatek i listę płac.","prop":"Ustalić proces i zakres przed konfiguracją.","prio":"Niski","owner":"Zespół Chorus (globalny)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI; Data Dictionary 1.12"},{"id":"K-24","type":"Kwestia","proc":"P00","area":"Harmonogram","desc":"Częstotliwość uruchamiania PECI, okna zamknięcia list płac w 22 bazach, obsługa zmian wstecznych do zamkniętych okresów.","why":"Zmiany mogą nie trafić na właściwą listę płac.","prop":"Przebieg codzienny + przebieg kontrolny przed zamknięciem listy; zmiany wsteczne do zamkniętych okresów – zadanie dla płac.","prio":"Wysoki","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"K-25","type":"Kwestia","proc":"P00","area":"Znaki","desc":"Kodowanie znaków w imporcie Xpertis (UTF-8 czy Windows-1250) i obsługa znaków spoza alfabetu polskiego.","why":"Utrata polskich znaków w nazwiskach i adresach.","prop":"Reguła T07; potwierdzić format importu Xpertis.","prio":"Średni","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"K-26","type":"Kwestia","proc":"P00","area":"Klucz pracownika","desc":"Kto nadaje numer ewidencyjny w Xpertis (per baza) i czy wraca on do middleware (XREF) oraz do Workday (np. jako Custom ID)?","why":"Bez zwrotu numeru nie zaktualizujemy właściwej kartoteki.","prop":"Xpertis nadaje numer i zwraca go w potwierdzeniu; middleware zapisuje w XREF (T06).","prio":"Wysoki","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"K-27","type":"Kwestia","proc":"P01, P15","area":"Czas pracy","desc":"Konwersja FTE na ułamek etatu i odwzorowanie Work_Shift na kalendarz / system czasu pracy w Xpertis. Paid_FTE w próbkach = 0.","why":"Błędny wymiar etatu = błędne wynagrodzenie i normy czasu pracy.","prop":"Wymiar z Full_Time_Equivalent_Percentage (T10); słownik S10; Paid_FTE nie używać.","prio":"Wysoki","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: próbki"},{"id":"K-28","type":"Kwestia","proc":"P11","area":"Rodzina","desc":"Zgłoszenie członków rodziny do ubezpieczenia zdrowotnego wymaga m.in. PESEL członka rodziny i stopnia pokrewieństwa. DD: dane rodziny poza zakresem PL (poza kontaktami awaryjnymi).","why":"Jeśli zgłoszenia robi Xpertis – dane muszą tam trafić z Workday albo z dokumentów pracownika.","prop":"Ustalić, czy dane rodziny prowadzimy w Workday dla PL; jeśli nie – P11 poza zakresem.","prio":"Średni","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.15, 15.1"},{"id":"K-29","type":"Kwestia","proc":"P02","area":"Ponowne zatrudnienie","desc":"Czy Xpertis przy ponownym zatrudnieniu w tej samej bazie tworzy nowe zatrudnienie w istniejącej kartotece, czy nową kartotekę?","why":"Ciągłość danych osobowych i historii płacowej.","prop":"Identyfikacja po WID/PESEL w XREF; nowe zatrudnienie w istniejącej kartotece.","prio":"Średni","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza procesu"},{"id":"K-30","type":"Kwestia","proc":"P30","area":"Dane referencyjne","desc":"PECI nie przesyła danych referencyjnych (nowe MPK, lokalizacje, stanowiska, układy, plany).","why":"Rekord pracownika z nieznanym kodem zostanie odrzucony.","prop":"Proces utrzymania słowników: zmiana w Workday → utworzenie w Xpertis przed użyciem; middleware odrzuca nieznane kody do kolejki wyjątków.","prio":"Średni","owner":"SG – IT","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza procesu"},{"id":"K-31","type":"Kwestia","proc":"P10","area":"Rachunek","desc":"Podział wynagrodzenia na kilka rachunków (Distribution_Amount / Percentage) – czy dopuszczamy w PL i czy Xpertis to obsługuje?","why":"Wypłata wynagrodzenia.","prop":"Jeden rachunek główny; wyjątki po decyzji płac.","prio":"Niski","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-32","type":"Ryzyko","proc":"P04, P26","area":"Korekty","desc":"Anulowanie zatrudnienia lub rozwiązania po zgłoszeniu do ZUS albo po zamknięciu listy płac.","why":"Potrzebne korekty zgłoszeń i list płac.","prop":"Middleware nie usuwa danych – przekazuje anulowanie do Xpertis z flagą do weryfikacji przez płace (T15).","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza procesu"},{"id":"D-01","type":"Decyzja","proc":"Wszystkie","area":"Architektura","desc":"PECI traktujemy jako wyzwalacz zdarzenia. Brakujące dane middleware uzupełnia z Workday (API / raport), z Xpertis (baza źródłowa) lub z tabel referencyjnych.","why":"PECI przesyła tylko sekcje dotknięte zmianą; Xpertis wymaga kompletu danych dla operacji.","prop":"Do zatwierdzenia na pierwszym warsztacie.","prio":"Wysoki","owner":"SG – IT","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-02","type":"Decyzja","proc":"Wszystkie","area":"Architektura","desc":"Jedna warstwa orkiestracji w middleware (MuleSoft) z kanonicznym modelem „Pracownik PL” i jednym adapterem Xpertis z 22 profilami połączeń; Control-M (MFT) jako transport pliku.","why":"Jedna logika zamiast 22 integracji; zmiany w Workday nie wymagają zmian w każdej bazie.","prop":"Do zatwierdzenia.","prio":"Wysoki","owner":"SG – IT","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-03","type":"Decyzja","proc":"Wszystkie","area":"Słowniki","desc":"Mapowanie wartości: stabilne 1:1 – integration map w Workday; zależne od bazy Xpertis lub kontekstu – tabele w middleware.","why":"Mniej logiki w middleware tam, gdzie Workday ma natywne mapowanie.","prop":"Do zatwierdzenia.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-04","type":"Decyzja","proc":"Wszystkie","area":"Jakość danych","desc":"Bramka kompletności: brak wymaganego pola → brak zapisu w Xpertis i zadanie w kolejce wyjątków dla właściciela danych. Zero częściowych zapisów.","why":"Spójność danych płacowych w 22 bazach.","prop":"Do zatwierdzenia (T25).","prio":"Wysoki","owner":"Integrator (middleware)","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-05","type":"Decyzja","proc":"P27","area":"Przeniesienie","desc":"Kolejność kroków przy przeniesieniu: stanowisko i zatrudnienie w bazie B, potem zakończenie w bazie A, na końcu przeniesienie danych historycznych; każdy krok idempotentny.","why":"Przy awarii pracownik jest chwilowo w dwóch bazach, a nie w żadnej.","prop":"Do zatwierdzenia (T16).","prio":"Wysoki","owner":"Integrator (middleware)","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-06","type":"Decyzja","proc":"Wszystkie","area":"Bezpieczeństwo","desc":"Dane osobowe i płacowe: szyfrowanie w transporcie, krótka retencja plików w middleware, maskowanie PESEL, rachunków i danych szczególnych w logach, dostęp wg najmniejszych uprawnień.","why":"Zgodność z RODO i polityką bezpieczeństwa Grupy.","prop":"Do zatwierdzenia z IOD.","prio":"Wysoki","owner":"SG – IOD","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"}],"rules":[{"id":"T01","name":"Daty (xs:date)","scope":"Wszystkie pola typu Data","desc":"PECI przesyła daty jako xs:date z przesunięciem strefy czasowej tenanta (RRRR-MM-DD±hh:mm). Middleware bierze część daty bez przeliczania strefy i zapisuje w formacie Xpertis.","example":"2025-10-01-07:00 → 01-10-2025 (format docelowy wg Xpertis; DTM podaje DD-MM-RRRR)","where":"Middleware","error":"Niepoprawna data → odrzucenie zdarzenia do kolejki wyjątków.","status":"Propozycja"},{"id":"T02","name":"Momenty zdarzeń (xs:dateTime)","scope":"Effective_Change: Effective_Moment, Entry_Moment; Summary: Updated_From/To","desc":"Effective_Moment wyznacza datę skuteczności operacji w Xpertis – używamy części daty bez konwersji strefy. Entry_Moment służy do audytu i wykrywania zmian wstecznych; w logach zapisujemy go w czasie Europe/Warsaw.","example":"2026-01-01T00:00:00.000-08:00 → data skuteczności 01-01-2026","where":"Middleware","error":"Brak Effective_Moment → odrzucenie zdarzenia.","status":"Propozycja"},{"id":"T03","name":"Wartości logiczne","scope":"Pola 1/0 (np. Active, Terminated, Is_Rehire, Primary_Job, Apply_FTE)","desc":"1 = prawda, 0 = fałsz. Brak elementu nie oznacza fałszu – oznacza brak zmiany lub brak danych (np. Primary_Job nie występuje dla pozycji dodatkowej).","example":"1 → T, 0 → N (zapis wg Xpertis)","where":"Middleware","error":"Wartość spoza 1/0 → kolejka wyjątków.","status":"Propozycja"},{"id":"T04","name":"Kody Workday → kody Xpertis","scope":"Pola kodowe (arkusz Słowniki)","desc":"Każde pole kodowe tłumaczone wg słownika. Stabilne mapowania 1:1 mogą być realizowane w Workday (integration map, kolumna „Mapowanie wartości w Workday”); mapowania zależne od bazy Xpertis lub kontekstu – w tabelach middleware. Bez wartości domyślnych.","example":"Full_time → pełny etat (kod Xpertis wg słownika S08)","where":"Workday – integration map lub middleware","error":"Kod bez mapowania → zdarzenie wstrzymane w kolejce wyjątków; właściciel słownika uzupełnia mapowanie.","status":"Propozycja"},{"id":"T05","name":"Routing do bazy Xpertis","scope":"Summary: Payroll_Company_Code, Pay_Group_Code; Position › Organization (Company)","desc":"Kod spółki płacowej (i grupy płacowej) wskazuje jedną z 22 baz Xpertis i kod pracodawcy. PCO trafia do bazy dotychczasowego pracodawcy, PCI – do bazy nowego.","example":"Payroll_Company_Code 01234 → baza XP_07 (przykład)","where":"Middleware (rejestr kluczy XREF)","error":"Nieznana spółka lub grupa → wstrzymanie całego bloku pracownika.","status":"Propozycja"},{"id":"T06","name":"Klucz pracownika (XREF)","scope":"Worker_Summary: WID, Employee_ID; numer ewidencyjny Xpertis","desc":"WID jest stałym kluczem osoby. Middleware prowadzi rejestr: WID / Employee_ID ↔ numer ewidencyjny w każdej bazie Xpertis (jedna osoba może mieć kartoteki w kilku bazach). Numer nadaje Xpertis i zwraca w potwierdzeniu.","example":"WID 8874… ↔ baza A: 000123, baza B: 004567","where":"Middleware","error":"Brak wpisu w XREF przy zdarzeniu innym niż HIR/PCI → kolejka wyjątków.","status":"Propozycja"},{"id":"T07","name":"Teksty i polskie znaki","scope":"Imiona, nazwiska, adresy, nazwy stanowisk","desc":"PECI jest w UTF-8. Zachowujemy polskie znaki; przy imporcie w innym kodowaniu (np. Windows-1250) znaki spoza zestawu są zgłaszane, nie usuwane po cichu. Usuwamy wiodące i końcowe spacje; nie zmieniamy wielkości liter.","example":"„Żółkiewska ” → „Żółkiewska”","where":"Middleware","error":"Znak niemożliwy do zapisania → kolejka wyjątków z podglądem wartości.","status":"Propozycja"},{"id":"T08","name":"Walidacja PESEL","scope":"Person_Identification › National_Identifier: National_ID","desc":"11 cyfr, poprawna cyfra kontrolna, zgodność daty urodzenia i płci z danymi z sekcji Personal. Osoba bez PESEL wymaga dokumentu tożsamości (paszport).","example":"85071512345 → sprawdzenie sumy kontrolnej i daty 15-07-1985","where":"Middleware","error":"Niezgodność → kolejka wyjątków dla kadr; bez zapisu w Xpertis.","status":"Propozycja"},{"id":"T09","name":"Adres: podział i uzupełnienie","scope":"Person_Communication › Address","desc":"Linie adresu Workday rozdzielane na pola Xpertis (ulica, nr domu, nr lokalu) wg konfiguracji adresu PL. Kod pocztowy w formacie NN-NNN. Województwo, powiat i gmina – z pól Workday, jeśli skonfigurowane; w przeciwnym razie z rejestru TERYT po kodzie pocztowym i miejscowości.","example":"„ul. Polna 12/4”, 61-001 Poznań → ulica Polna, dom 12, lokal 4, gmina Poznań","where":"Middleware (tabela TERYT)","error":"Niejednoznaczne przypisanie gminy → kolejka wyjątków.","status":"Propozycja"},{"id":"T10","name":"Wymiar etatu","scope":"Position: Full_Time_Equivalent_Percentage, Scheduled_Weekly_Hours, Default_Weekly_Hours","desc":"Wymiar z Full_Time_Equivalent_Percentage (ułamek dziesiętny) przeliczany na ułamek zwykły Xpertis wg tabeli dozwolonych wymiarów. Kontrola: Scheduled / Default = FTE. Paid_FTE i Working_FTE nie są źródłem (w próbkach = 0).","example":"0,5 → 1/2; 0,75 → 3/4; 0,875 → 7/8","where":"Middleware","error":"Wymiar spoza tabeli → kolejka wyjątków.","status":"Propozycja"},{"id":"T11","name":"Kwoty i stawki","scope":"Compensation_Plans: Amount, Prorated_Amount; Compensation_Earnings_and_Deductions: Amount","desc":"Liczby z kropką dziesiętną, zaokrąglenie do 2 miejsc. Źródłem stawki jest plan (Compensation_Plans), nie podsumowanie Total_Base_Pay. Apply_FTE = 1 oznacza kwotę dla pełnego etatu. Waluta PLN; inna waluta → wyjątek.","example":"Amount 8500.00, Frequency Monthly, Apply_FTE 1 → stawka miesięczna 8 500,00 PLN (pełny etat)","where":"Middleware","error":"Waluta ≠ PLN lub brak częstotliwości → kolejka wyjątków.","status":"Propozycja"},{"id":"T12","name":"Kolejność i idempotencja","scope":"Effective_Change (atrybut Sequence), Summary: Integration_Event","desc":"Zmiany jednego pracownika przetwarzane ściśle w kolejności Sequence; różni pracownicy równolegle. Klucz idempotencji: WID + Derived_Event_Code + Effective_Moment + Sequence. Ponowne przetworzenie pliku nie tworzy duplikatów.","example":"Sequence 0 (DTA) przed 1 (TERM)","where":"Middleware","error":"Błąd kroku → zatrzymanie kolejnych zmian tego pracownika.","status":"Propozycja"},{"id":"T13","name":"Elementy powtarzalne i atrybuty zmian","scope":"Atrybuty isAdded / isUpdated / isDeleted, wartość poprzednia (priorValue)","desc":"Zmiana elementu powtarzalnego (adres, organizacja, plan) przychodzi jako isDeleted dla starego i isAdded dla nowego – middleware zamyka stary zapis w Xpertis (data skuteczności – 1) i otwiera nowy. Pola z wartością poprzednią pozwalają zbudować historię.","example":"Address isDeleted (stary) + Address isAdded (nowy) → zamknięcie i otwarcie adresu","where":"Middleware","error":"Element isDeleted bez odpowiednika w Xpertis → ostrzeżenie w logu.","status":"Propozycja"},{"id":"T14","name":"Klasyfikacja zdarzeń DTA","scope":"Effective_Change: Derived_Event_Code = DTA; Transaction_Log: Transaction_Type","desc":"DTA oznacza „inne zmiany danych”. Operację w Xpertis wybiera się na podstawie zmienionych sekcji (atrybuty isUpdated/isAdded) i Transaction_Type (np. Change Job, Change Legal Name, Maintain Employee Contracts).","example":"DTA + sekcja Payment_Election isAdded → zmiana rachunku (P10)","where":"Middleware","error":"Nierozpoznana kombinacja → kolejka wyjątków do klasyfikacji.","status":"Propozycja"},{"id":"T15","name":"Korekty i anulowania","scope":"Kody -C i -R: HIR-C, HIR-R, TERM-C, TERM-R, LOA-C, LOA-R, RFL-R","desc":"Anulowanie (-R) cofa skutki wcześniejszej operacji w Xpertis, a nie tworzy nowej. Para -R + kod podstawowy w jednym pliku oznacza zmianę daty – przetwarzana jako korekta. Jeśli operacja dotyczy zamkniętej listy płac – zadanie dla płac.","example":"TERM-R + TERM → zmiana daty rozwiązania","where":"Middleware + Xpertis","error":"Brak operacji do cofnięcia → kolejka wyjątków.","status":"Propozycja"},{"id":"T16","name":"Przeniesienie między pracodawcami (PCO + PCI)","scope":"Zdarzenia PCO i PCI tego samego pracownika","desc":"Jedna saga: stanowisko i zatrudnienie w bazie B od D, następnie zakończenie w bazie A z datą D–1, na końcu przeniesienie danych historycznych (np. saldo urlopu). Tryb przejścia (art. 23¹ KP / porozumienie / nowa umowa) steruje dokumentami – źródło do ustalenia (K-03).","example":"PCO (A, D=01-05-2026) + PCI (B) → B od 01-05-2026, A do 30-04-2026","where":"Middleware","error":"Błąd w B → brak zmian w A; błąd w A po sukcesie w B → kompensacja i wyjątek.","status":"Propozycja"},{"id":"T17","name":"Rozwiązanie umowy","scope":"Worker_Status: Termination_Date, Primary_Termination_Reason, Primary_Termination_Category, Local_Termination_Reason","desc":"Termination_Date = ostatni dzień zatrudnienia (do potwierdzenia). Tryb rozwiązania i podstawa prawna (art. KP) oraz strona inicjująca wynikają z kombinacji przyczyny głównej i lokalnej wg słownika S26.","example":"Terminate_Employee_Mutual_Mutual_Consent → porozumienie stron (art. 30 § 1 pkt 1 KP)","where":"Middleware (słownik S26)","error":"Brak mapowania przyczyny → kolejka wyjątków dla kadr.","status":"Propozycja"},{"id":"T18","name":"Dane szczególne i minimalizacja","scope":"Religion, Ethnicity, Marital_Status, Disability, Union, dane rodziny","desc":"Pola spoza zakresu PL nie są przekazywane do Xpertis (lista dozwolonych pól). Dane szczególne nie trafiają do logów; w logach maskujemy też PESEL i numery rachunków.","example":"Religion w pliku → pominięcie, wpis w logu bez wartości","where":"Middleware + konfiguracja PECI","error":"Pole spoza listy dozwolonych → pominięcie i alert do właściciela integracji.","status":"Propozycja"},{"id":"T19","name":"Daty stażowe","scope":"Worker_Status: Hire_Date, Original_Hire_Date, Continuous_Service_Date, Company_Service_Date, First_Day_of_Work","desc":"Każda data trafia do jednego, uzgodnionego pola Xpertis. Semantyka do ustalenia (K-06): PECI – Hire_Date to data w spółce, Data Dictionary – data w Grupie.","example":"Company_Service_Date (PCI) → data zatrudnienia w bazie B","where":"Middleware","error":"Brak wymaganej daty → kolejka wyjątków.","status":"Propozycja"},{"id":"T20","name":"Rodzaj umowy","scope":"Employee_Contract: Contract_Type, Start_Date, End_Date; Worker_Status: End_Employment_Date; Position: Worker_Type","desc":"Rodzaj umowy Xpertis (okres próbny / czas określony / czas nieokreślony) wyznaczany z Contract_Type, a kontrolnie z Worker_Type i daty końca. Kolejna umowa = nowy rekord umowy w Xpertis.","example":"Fixed Term contract + End_Date 31-12-2026 → umowa na czas określony do 31-12-2026","where":"Middleware (słownik S06)","error":"Sprzeczne dane (np. czas nieokreślony z datą końca) → kolejka wyjątków.","status":"Propozycja"},{"id":"T21","name":"Telefon i e-mail","scope":"Person_Communication › Phone, Email","desc":"Telefon z Phone_Number_With_Country_Code normalizowany do formatu +48 NNN NNN NNN. E-mail: Usage_Type WORK = służbowy, HOME = prywatny (DTM: domena @sg.com = służbowy).","example":"+48 (61) 1234567 → +48 61 123 45 67","where":"Middleware","error":"Niepoprawny format → zapis bez telefonu i ostrzeżenie.","status":"Propozycja"},{"id":"T22","name":"Rachunek bankowy","scope":"Payment_Election: IBAN, Account_Number, Bank_ID, BIC","desc":"Walidacja IBAN PL (28 znaków, suma kontrolna) albo NRB (26 cyfr). Zapis w formacie wymaganym przez Xpertis. Podział wynagrodzenia na kilka rachunków tylko po decyzji (K-31).","example":"PL61 1090 1014 0000 0712 1981 2874 → 61109010140000071219812874","where":"Middleware","error":"Niepoprawny numer → brak zmiany rachunku, wyjątek dla płac.","status":"Propozycja"},{"id":"T23","name":"Podział kosztów","scope":"Costing_Allocation: Allocation_Percentage, Worktag_Code, daty","desc":"Allocation_Percentage jest ułamkiem (1 = 100%). Suma udziałów dla pracownika = 100%. Worktag_Code (MPK) tłumaczony wg słownika S14.","example":"0.2 / 0.8 → 20% MPK 200001, 80% MPK 200003","where":"Middleware","error":"Suma ≠ 100% lub nieznane MPK → kolejka wyjątków.","status":"Propozycja"},{"id":"T24","name":"Kontrola kompletności pliku","scope":"Summary: Worker_Count, Full_Snapshot, Ad_Hoc_Run, First_Primary_Run_of_Pay_Period","desc":"Liczba przetworzonych pracowników = Worker_Count. Full_Snapshot = 1 uruchamia tryb rekoncyliacji (porównanie stanu), nie operacje kadrowe.","example":"Worker_Count 152, przetworzono 151 → alert","where":"Middleware","error":"Niezgodność → alert do właściciela integracji.","status":"Propozycja"},{"id":"T25","name":"Bramka kompletności","scope":"Wszystkie pola z „Wymagane w Xpertis” = Tak","desc":"Przed zapisem w Xpertis middleware sprawdza komplet pól wymaganych dla danej operacji. Brak → brak zapisu i zadanie w kolejce wyjątków dla właściciela danych. Zero częściowych zapisów.","example":"HIR bez PESEL i bez paszportu → zadanie dla kadr","where":"Middleware","error":"—","status":"Propozycja"},{"id":"T26","name":"Dodatkowe zatrudnienie","scope":"Position: Primary_Job, Add_Additional_Job_Reason, End_Additional_Job_Reason, Position_End_Date","desc":"Pozycja bez elementu Primary_Job jest pozycją dodatkową. Każda pozycja (Position_ID) ma własny rekord zatrudnienia/umowy w Xpertis – jeśli Xpertis to obsługuje (K-29 dotyczy ponownego zatrudnienia; tu decyzja w P18).","example":"Position P158551 bez Primary_Job → druga umowa","where":"Middleware","error":"Brak obsługi w Xpertis → wyjątek.","status":"Propozycja"},{"id":"T27","name":"Nieobecności długotrwałe","scope":"Leave_of_Absence: typ, daty","desc":"Leave_of_Absence_Type → rodzaj n <script>
(function(){
'use strict';
/* ---------- dane referencyjne (propozycja integratora, wersja 0.1) ---------- */
const D = JSON.parse(document.getElementById('peci-data').textContent);

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso = () => new Date().toISOString();
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear(); };
const fmtTs = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const fmtDate = v => { if (!v) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? m[3] + '.' + m[2] + '.' + m[1] : v; };
const lsGet = k => { try { return localStorage.getItem('peci-xp:' + k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('peci-xp:' + k, v); } catch (e) {} };
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function merge(a, b) { const o = Object.assign({}, a || {}); Object.keys(b || {}).forEach(k => { const v = b[k]; o[k] = (isObj(v) && isObj(o[k])) ? merge(o[k], v) : v; }); return o; }
const blank = v => v == null || String(v).trim() === '' || String(v).trim() === '—';

const PARTIES = [
  {k:'wd', n:'Workday', full:'Partner Workday', role:'Dane źródłowe i format w PECI'},
  {k:'xp', n:'Xpertis', full:'Partner Xpertis', role:'Pole docelowe i format Xpertis'},

  {k:'sg', n:'Saint-Gobain', full:'SG – Kadry i Płace', role:'Akceptacja biznesowa'}
];

const FIELD_PARTIES = ['wd', 'xp', 'mw'];

const PST_CLS = {'Nie rozpoczęty':'c-neutral', 'W trakcie':'c-info', 'Wymaga decyzji':'c-warn', 'Gotowy do akceptacji':'c-xp', 'Zaakceptowany':'c-ok'};

const COV = {covered:['z PECI', 'c-ok'], filled:['spoza PECI', 'c-info'], nosrc:['brak źródła', 'c-err'], eval:['do oceny', 'c-neutral']};
const FMT_PROP = {
  T01:'DD-MM-RRRR', T02:'DD-MM-RRRR (data skuteczności, bez przeliczania strefy)', T03:'T / N',
  T08:'PESEL – 11 cyfr, suma kontrolna', T09:'ulica | nr domu | nr lokalu | kod pocztowy | miejscowość | gmina (TERYT)',
  T10:'ułamek etatu, np. 1/2, 3/4', T11:'kwota 0,00 PLN, stawka miesięczna', T21:'+48 61 123 45 67',
  T22:'NRB – 26 cyfr bez spacji', T23:'% udziału + kod MPK'
};
const NEEDS_FMT_TR = ['Format', 'Wyliczenie', 'Podział / złożenie'];
const FMT_TYPES = ['Data', 'Data i czas', 'Liczba'];

const PROC = D.processes, PBY = {}; PROC.forEach(p => PBY[p.id] = p);
const BASE = D.fields, FBY = {}; BASE.forEach(f => FBY[f.id] = f);
const RULES = D.rules, RBY = {}; RULES.forEach(r => RBY[r.id] = r);
const DICTS = D.dicts, DBY = {}; DICTS.forEach(d => DBY[d.id] = d);
const ISSUES = D.issues, IBY = {}; ISSUES.forEach(i => IBY[i.id] = i);
const GROUPS = []; PROC.forEach(p => { if (!GROUPS.includes(p.grp)) GROUPS.push(p.grp); });
const AREAS = Array.from(new Set(BASE.map(f => f.area))).sort((a, b) => a.localeCompare(b, 'pl'));
const CAT = D.catalog.map(r => { const o = {}; D.catalog_cols.forEach((k, i) => o[k] = r[i] || ''); return o; });

/* ---------- stan ---------- */
const COLS = ['fields', 'adds', 'comments', 'procs', 'issues', 'dictvals', 'rules'];
const IN_VIEWER = !!(window.claude && typeof window.claude.use === 'function');
const S = {
  view:'proc', proc:'P00', sel:null, tab:'pola', q:'', show:'all', dict:'S01', dq:'', rq:'', iq:'', ifilt:'open', cq:'', cscope:'Y',
  issueFocus:null, ov:{}, mode:'connecting', canWrite:false, user:null, dl:null, me:{id:null},
  names:{}, needNames:new Set(), team:lsGet('team') || '', myName:lsGet('name') || '', drafts:{}, newIssue:null, adding:null, signAsk:null, delAsk:null,
  open:{facts:false, ws:false, info:false}
};
COLS.forEach(c => S.ov[c] = {});

/* ---------- magazyn: wspólna baza artefaktu albo tryb lokalny ---------- */
const Store = {
  db:null, exists:{}, local:{},
  use(name) {
    try { return (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
    catch (e) { return Promise.resolve(null); }
  },
  startShared(db) {
    this.db = db; S.mode = 'shared';
    COLS.forEach(c => {
      this.exists[c] = new Set();
      db.collection(c).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
        S.ov[c] = m; this.exists[c] = new Set(Object.keys(m)); schedule();
      }, err => {
        if (err && err.code === 'revoked') { S.canWrite = false; S.mode = 'readonly'; }
        else toast('Połączenie z bazą zostało przerwane (' + (err && err.code) + '). Odśwież stronę.');
        schedule();
      });
    });
  },
  startLocal() {
    S.mode = 'local';
    try { this.local = JSON.parse(lsGet('local') || '{}') || {}; } catch (e) { this.local = {}; }
    COLS.forEach(c => { this.local[c] = this.local[c] || {}; S.ov[c] = Object.assign({}, this.local[c]); });
  },
  persist(c) { this.local[c] = S.ov[c]; lsSet('local', JSON.stringify(this.local)); },
  async retry(fn) { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; } },
  async put(c, id, patch, full) {
    if (S.mode !== 'shared') { this.persist(c); return; }
    const ref = this.db.collection(c).doc(id);
    if (this.exists[c].has(id)) {
      try { await this.retry(() => ref.update(patch)); return; }
      catch (e) { if (!(e && e.code === 'invalid_argument')) throw e; }
    }
    await this.retry(() => ref.set(Object.assign({}, full)));
    this.exists[c].add(id);
  },
  async add(c, data) {
    if (S.mode !== 'shared') {
      const id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      S.ov[c] = Object.assign({}, S.ov[c], {[id]: data}); this.persist(c); schedule(); return id;
    }
    const ref = this.db.collection(c).doc();
    S.ov[c] = Object.assign({}, S.ov[c], {[ref.id]: data}); schedule();
    await this.retry(() => ref.set(data)); this.exists[c].add(ref.id); return ref.id;
  },
  async del(c, id) {
    const m = Object.assign({}, S.ov[c]); delete m[id]; S.ov[c] = m; schedule();
    if (S.mode !== 'shared') { this.persist(c); return; }
    await this.retry(() => this.db.collection(c).doc(id).delete());
  }
};
function writable() { return S.canWrite && (S.mode === 'shared' || S.mode === 'local'); }
function writeErr(err) {
  const code = err && err.code;
  if (code === 'invalid_argument') { S.canWrite = false; S.mode = 'readonly'; toast('Zapis odrzucony: masz dostęp tylko do odczytu. Poproś właściciela o rolę Współtwórcy.'); }
  else if (code === 'quota_exceeded') toast('Baza artefaktu osiągnęła limit – nowe wpisy nie zostaną zapisane.');
  else if (code === 'resource_exhausted') toast('Zbyt wiele zapisów naraz. Powtórz zmianę za chwilę.');
  else toast('Nie zapisano zmiany' + (code ? ' (' + code + ')' : '') + '. Spróbuj ponownie.');
  schedule();
}
const queue = {};
function stamp() { const s = {by:S.me.id, at:nowIso(), team:S.team || ''}; if (!S.me.id && S.myName) s.nm = S.myName; return s; }
function save(c, id, patch) {
  if (!writable()) { toast(S.mode === 'connecting' ? 'Trwa łączenie z bazą – spróbuj za chwilę.' : 'Masz dostęp tylko do odczytu.'); return Promise.resolve(false); }
  patch = Object.assign({}, patch, {upd:stamp()});
  const full = merge(S.ov[c][id], patch);
  S.ov[c] = Object.assign({}, S.ov[c], {[id]: full});
  schedule();
  const k = c + '/' + id;
  const p = (queue[k] || Promise.resolve()).then(() => Store.put(c, id, patch, full)).then(() => true, e => { writeErr(e); return false; });
  queue[k] = p; return p;
}
function addDoc(c, data) {
  if (!writable()) { toast('Masz dostęp tylko do odczytu.'); return Promise.resolve(null); }
  return Store.add(c, data).catch(e => { writeErr(e); return null; });
}
function delDoc(c, id) {
  if (!writable()) { toast('Masz dostęp tylko do odczytu.'); return Promise.resolve(); }
  return Store.del(c, id).catch(writeErr);
}

/* ---------- model: pozycje, kontrole, statystyki ---------- */
const EK = ['xf','xo','xt','xr','suff','tr','rule','dic','src','srcNote','tgtFmt','exIn','exOut','logic','st','dec','own','due','iss'];
function baseItem(f) {
  const o = S.ov.fields[f.id] || {};
  const e = Object.assign({}, f);
  EK.forEach(k => { if (o[k] != null) e[k] = o[k]; });
  e.key = f.id; e.code = f.id; e.isAdd = false; e.conf = o.conf || {}; e.upd = o.upd; e.st = e.st || 'Do omówienia';
  return e;
}
function addItems() {
  const by = {};
  Object.keys(S.ov.adds).forEach(id => { const a = S.ov.adds[id]; if (!a || !PBY[a.p]) return; (by[a.p] = by[a.p] || []).push([id, a]); });
  const out = [];
  Object.keys(by).forEach(p => {
    by[p].sort((x, y) => String(x[1].at || '').localeCompare(String(y[1].at || '')));
    by[p].forEach(([id, a], i) => {
      const e = Object.assign({}, a);
      e.key = 'A:' + id; e.docId = id; e.code = p + '-N' + pad2(i + 1); e.isAdd = true; e.conf = a.conf || {};
      e.st = e.st || 'Do omówienia'; e.area = e.area || 'Dopisane dane'; e.suff = e.suff || 'Do oceny';
      out.push(e);
    });
  });
  return out;
}
function targets(e) {
  if (e.st === 'Poza zakresem' || e.suff === 'Nie dotyczy' || e.tr === 'Filtr (nie przekazywać)') return false;
  const x = String(e.xf || '').trim(); return !!x && x[0] !== '—';
}
const isGap = e => e.suff === 'Brak w PECI' || e.suff === 'Niewystarczające';
const hasSrc = e => !blank(e.src) && e.src !== 'Do ustalenia';
const needsFmt = e => targets(e) && (NEEDS_FMT_TR.includes(e.tr) || FMT_TYPES.includes(e.typ));
function coverage(e) {
  if (!targets(e)) return null;
  if (isGap(e)) return hasSrc(e) ? 'filled' : 'nosrc';
  if (e.suff === 'Wystarczające' || e.suff === 'Wystarczające po transformacji') return 'covered';
  return 'eval';
}
function fmtProposal(e) {

  <div class="tblwrap"><table class="t"><thead><tr><th>Proces</th><th>Grupa</th><th>Pola</th><th>Potwierdzone</th><th>Decyzje</th><th>Błędy</th><th>Bez źródła</th><th>Dopisane</th><th>Kom.</th><th>Akceptacje</th><th>Status</th></tr></thead><tbody>`;

}

  return out;
}

function loadXLSX() {

    if (window.XLSX) return res(window.XLSX);
    const srcs = (IN_VIEWER ? [] : ['vendor/xlsx.full.min.js']).concat(['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js']);
    const next = () => {
      const src = srcs.shift(); if (!src) return rej(new Error('load'));
      const s = document.createElement('script'); s.src = src;
      s.onload = () => window.XLSX ? res(window.XLSX) : next();
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
