<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Uzgodnienia PECI → Xpertis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Układ: stół warsztatowy — szyna procesów · lista pól (PECI → Xpertis) · karta pola w trzech krokach: Workday → middleware → Xpertis.
   Kolor koduje strony: Workday (niebieski), middleware (fiolet), Xpertis (zieleń). Typografia w rem: html 14px, tryb „duży tekst” 16px. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunken:#EEF1F5; --hover:#F5F7FA; --sel:#EAF1FB;
  --ink:#131B26; --ink2:#2B3645; --muted:#566275; --faint:#86909F; --line:#E0E5EC; --line2:#C8D0DB;
  --wd:#1D5EA8; --wd-bg:#EAF2FB; --wd-line:#BCD2EE;
  --mw:#6142AD; --mw-bg:#F2EEFB; --mw-line:#D5CAF1;
  --xp:#17744A; --xp-bg:#E6F4EC; --xp-line:#B5DDC6;
  --acc:#1B3A5C; --acc-ink:#FFFFFF; --acc-soft:#E5ECF5;
  --ok:#18734A; --ok-bg:#E2F2E8; --warn:#8C5306; --warn-bg:#FBEFD9; --err:#AF261D; --err-bg:#FCE7E4; --info:#2A5B9A; --info-bg:#E6EEF8;
  --mark:#FFE59A; --focus:#2F6FD0; --scrim:rgba(12,18,28,.44);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06); --shadow:0 16px 40px rgba(16,24,40,.20);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tabs-h:46px; --colh-h:32px; --grp-h:30px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#141B24; --sunken:#1A222D; --hover:#1B2430; --sel:#1A2A3F;
    --ink:#E5EAF1; --ink2:#C9D2DD; --muted:#98A4B4; --faint:#6E7A8B; --line:#243040; --line2:#334154;
    --wd:#76ABEB; --wd-bg:#15253A; --wd-line:#284566;
    --mw:#AB91EB; --mw-bg:#211B36; --mw-line:#3D3263;
    --xp:#62C792; --xp-bg:#122C1F; --xp-line:#24513A;
    --acc:#A3C4EC; --acc-ink:#0D1A29; --acc-soft:#1C2C40;
    --ok:#5DC68C; --ok-bg:#132D1E; --warn:#E3A853; --warn-bg:#33240F; --err:#F38075; --err-bg:#391916; --info:#89B1E8; --info-bg:#16273D;
    --mark:#5C4A12; --focus:#7FB0F0; --scrim:rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 16px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#141B24; --sunken:#1A222D; --hover:#1B2430; --sel:#1A2A3F;
  --ink:#E5EAF1; --ink2:#C9D2DD; --muted:#98A4B4; --faint:#6E7A8B; --line:#243040; --line2:#334154;
  --wd:#76ABEB; --wd-bg:#15253A; --wd-line:#284566;
  --mw:#AB91EB; --mw-bg:#211B36; --mw-line:#3D3263;
  --xp:#62C792; --xp-bg:#122C1F; --xp-line:#24513A;
  --acc:#A3C4EC; --acc-ink:#0D1A29; --acc-soft:#1C2C40;
  --ok:#5DC68C; --ok-bg:#132D1E; --warn:#E3A853; --warn-bg:#33240F; --err:#F38075; --err-bg:#391916; --info:#89B1E8; --info-bg:#16273D;
  --mark:#5C4A12; --focus:#7FB0F0; --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 16px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:14px;-webkit-text-size-adjust:100%}
html.lg{font-size:16px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--wd);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:8px;box-shadow:var(--shadow)}
.skip:focus{left:16px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono);letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .num{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.lblc{font:600 .786rem/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- pasek górny ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:8px 14px;min-height:58px;min-width:0;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);text-decoration:none;flex:none}
.brand-mark{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.brand-mark i{display:block;height:22px;border-radius:2px}
.brand-mark i:nth-child(1){background:var(--wd)} .brand-mark i:nth-child(2){background:var(--mw)} .brand-mark i:nth-child(3){background:var(--xp)}
.brand b{display:block;font:600 1.143rem/1.1 var(--f-cond);letter-spacing:.005em}
.brand small{display:block;font:400 .821rem/1.3 var(--f-ui);color:var(--muted)}
nav.views{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none;padding:2px}
nav.views::-webkit-scrollbar{display:none}
nav.views a{padding:7px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font:500 1rem/1.2 var(--f-cond);letter-spacing:.015em;white-space:nowrap}
nav.views a:hover{color:var(--ink);background:var(--hover)}
nav.views a[aria-current="page"]{background:var(--acc-soft);color:var(--acc)}
.top-right{display:flex;align-items:center;gap:8px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);font-size:.929rem;font-weight:500;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn[aria-expanded="true"]{background:var(--acc-soft);border-color:var(--acc-soft);color:var(--acc)}
.tbtn.icon{width:36px;padding:0;justify-content:center}
.tbtn.search{min-width:178px;color:var(--muted)}
.tbtn.search kbd{margin-left:auto}
kbd,.kbd{font:500 .75rem/1 var(--f-mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--surface);white-space:nowrap}
.savestate{display:inline-flex;align-items:center;gap:7px;font-size:.857rem;color:var(--muted);white-space:nowrap;padding:0 4px}
.savestate i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.savestate.saving i{background:var(--info)} .savestate.err{color:var(--err)} .savestate.err i{background:var(--err)} .savestate.ro i{background:var(--faint)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 .786rem/1 var(--f-ui);color:var(--acc-ink);background:var(--acc);flex:none}
.avatar.none{background:var(--sunken);color:var(--muted)}
.pname{display:grid;text-align:left;line-height:1.15;min-width:0}
.pname b{font-size:.893rem;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pname small{font-size:.786rem;color:var(--muted);font-weight:400;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:70;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px}
.mi{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px 10px;align-items:start;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px;color:var(--ink);width:100%}
.mi:hover{background:var(--hover)}
.mi .ic{margin-top:2px;color:var(--muted)}
.mi b{font-weight:600;font-size:.964rem}
.mi small{grid-column:2;color:var(--muted);font-size:.857rem;line-height:1.4}
.mi.danger b,.mi.danger .ic{color:var(--err)}
.msep{height:1px;background:var(--line);margin:4px 8px}
.mnote{font-size:.821rem;color:var(--muted);padding:6px 10px 8px;line-height:1.45}
.mform{padding:10px 10px 12px;display:grid;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:.893rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.langsw{display:inline-flex;height:36px;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.langsw button{border:0;background:transparent;padding:0 9px;min-width:36px;font:600 .821rem/1 var(--f-ui);letter-spacing:.04em;color:var(--muted)}
.langsw button+button{border-left:1px solid var(--line2)}
.langsw button:hover{background:var(--hover)}
.langsw button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.modal>header .langsw{height:32px}

/* ---------- obszar roboczy ---------- */
.work{display:grid;grid-template-columns:252px minmax(0,1fr) minmax(440px,540px);gap:14px;min-height:0;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.work.full{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0;overflow:auto;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}

/* szyna procesów */
.rail{padding:0 4px 20px 0}
.rail h4{margin:18px 8px 6px;font:600 .786rem/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rail h4:first-child{margin-top:4px}
.pr{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:3px 8px;align-items:start;width:100%;text-align:left;padding:8px 9px 9px;border:0;border-radius:10px;background:transparent;color:var(--ink)}
.pr:hover{background:var(--surface)}
.pr[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),var(--shadow-sm)}
.pr .pid{font:500 .857rem/1.4 var(--f-mono);color:var(--muted)}
.pr .pn{font-size:.929rem;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr .pst{font:500 .786rem/1.4 var(--f-ui);color:var(--muted);display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.pr .pst .ic{width:14px;height:14px}
.pr .pst.ok{color:var(--ok)} .pr .pst.e{color:var(--err)} .pr .pst.w{color:var(--warn)}
.pr .pbar{grid-column:2/4;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex;margin-top:3px}
.pbar b,.pbig b,.minibar b{display:block;height:100%}
.b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-info{background:var(--info)} .b-err{background:var(--err)} .b-faint{background:var(--line2)}
.rail-select{display:none}

/* nagłówek procesu */
.listpane{container-type:inline-size}
.phead{padding:20px 22px 16px;display:grid;gap:12px}
.ptitle{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.pmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.893rem;color:var(--muted);margin-bottom:6px}
.pidbig{font:500 .857rem/1 var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--sunken);color:var(--ink)}
.ptitle h1{font:600 1.714rem/1.15 var(--f-cond);letter-spacing:.003em}
.pdesc{color:var(--muted);max-width:82ch;font-size:.964rem}
.signmini{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap;border:0;background:transparent;padding:0}
.sm1{font:600 .786rem/1 var(--f-ui);padding:6px 8px;border-radius:7px;border:1px solid var(--line2);color:var(--faint);white-space:nowrap}
.sm1.on{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.signmini:hover .sm1{border-color:var(--faint)}
details.more>summary{cursor:pointer;color:var(--muted);font-size:.893rem;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .ic{transition:transform .15s}
details.more[open]>summary .ic{transform:rotate(90deg)}
details.more>summary:hover{color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 22px;margin:12px 0 0}
.facts div{min-width:0}
.facts dt{font:600 .786rem/1.2 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:4px 0 0;font-size:.929rem;overflow-wrap:anywhere}
.risk{display:flex;gap:8px;align-items:flex-start;font-size:.929rem;color:var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:10px;margin-top:12px}
.pprog{display:grid;gap:10px}
.pbig{height:8px;border-radius:4px;background:var(--line);display:flex;overflow:hidden}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.893rem;color:var(--muted);white-space:nowrap}
.kchip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
button.kchip:hover{border-color:var(--line2);background:var(--hover)}
.kchip.e{border-color:transparent;background:var(--err-bg);color:var(--err)} .kchip.e b{color:var(--err)}
.kchip.w{border-color:transparent;background:var(--warn-bg);color:var(--warn)} .kchip.w b{color:var(--warn)}
.kchip.ok{border-color:transparent;background:var(--ok-bg);color:var(--ok)} .kchip.ok b{color:var(--ok)}

/* zakładki i narzędzia listy */
.tabs{position:sticky;top:0;z-index:7;display:flex;gap:2px;height:var(--tabs-h);align-items:stretch;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:0 10px;font:500 1rem/1 var(--f-cond);letter-spacing:.015em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.cnt{font:500 .786rem/1 var(--f-mono);padding:3px 6px;border-radius:9px;background:var(--sunken);color:var(--muted)}
.cnt.e{background:var(--err-bg);color:var(--err)} .cnt.w{background:var(--warn-bg);color:var(--warn)} .cnt.ok{background:var(--ok-bg);color:var(--ok)}
.tools{display:grid;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.tools .r1{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
.sbox{position:relative;flex:1 1 240px;min-width:0}
.sbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.sbox input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--line2);border-radius:9px;background:var(--surface)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:.893rem;color:var(--ink2);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.fchip .n{font:500 .786rem/1 var(--f-mono);color:var(--muted)}
.fchip:hover{background:var(--hover)}
.fchip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.85}
.fchip.zero{color:var(--faint)}
.fsel{display:inline-flex;align-items:center;gap:6px;font-size:.893rem;color:var(--muted);margin-left:auto}
.fsel select,.selsm{height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);padding:0 8px;font-size:.893rem;max-width:100%}

/* lista pól: trzy układy zależnie od szerokości listy */
.colh,.row{grid-template-columns:4px 70px minmax(0,1fr) 18px minmax(0,1fr) 128px}
.colh{position:sticky;top:var(--tabs-h);z-index:6;display:grid;gap:0 12px;height:var(--colh-h);align-items:center;padding:0 16px 0 0;background:var(--surface);border-bottom:1px solid var(--line);font:600 .786rem/1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.colh .wdc{color:var(--wd)} .colh .xpc{color:var(--xp)} .colh .stc{text-align:right}
.grp{position:sticky;top:calc(var(--tabs-h) + var(--colh-h));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;height:var(--grp-h);padding:0 16px 0 18px;background:var(--sunken);border-bottom:1px solid var(--line);font:600 .857rem/1 var(--f-cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.grp .gc{font:500 .821rem/1 var(--f-ui);letter-spacing:0;text-transform:none;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;gap:3px 12px;align-items:start;padding:11px 16px 11px 0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface);position:relative}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--sel)}
.row:focus-visible{outline-offset:-2px}
.row .stripe{align-self:stretch;margin:-11px 0;background:transparent}
.row.st-ok .stripe{background:var(--ok)} .row.st-dec .stripe{background:var(--warn)} .row.st-prog .stripe{background:var(--info)}
.row[aria-selected="true"] .stripe{background:var(--acc)}
.row.st-out>*:not(.stripe){opacity:.55}
.rid{font:500 .857rem/1.55 var(--f-mono);color:var(--muted)}
.rc-pe,.rc-xp{min-width:0}
.el{font:500 .964rem/1.4 var(--f-mono);color:var(--ink);overflow-wrap:anywhere}
.el.gap{font-family:var(--f-ui);font-weight:600;color:var(--err)}
.el.gapok{font-family:var(--f-ui);font-weight:600;color:var(--info)}
.sub{font-size:.857rem;line-height:1.4;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.arrow{color:var(--faint);padding-top:2px}
.xpf{font-size:1rem;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.xpf.none{color:var(--faint);font-size:.929rem}
.fmt{font:500 .857rem/1.4 var(--f-mono);color:var(--xp)}
.fmt.miss{font:italic 400 .857rem/1.4 var(--f-ui);color:var(--warn)}
.rc-st{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;align-items:center;padding-top:1px}
.pm{display:inline-flex;gap:2px}
.pm i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:600 .714rem/1 var(--f-ui);font-style:normal;color:var(--faint);border:1px solid var(--line2)}
.pm i.wd.on{background:var(--wd);border-color:var(--wd);color:var(--surface)}

.legend{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:baseline;font-size:.929rem}
.legend dd{margin:0;color:var(--ink2)}
.legend dt{white-space:nowrap}
.kbdlist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;font-size:.929rem}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.palette{width:min(680px,100%)}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal-in .ic{width:20px;height:20px;color:var(--faint)}
.pal-in input{flex:1;border:0;background:transparent;font-size:1.143rem;outline:none;min-width:0;height:30px}
.pal-res{overflow:auto;padding:6px 8px 10px;max-height:min(62vh,560px)}
.pal-g{font:600 .75rem/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px}
.pal-it{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 12px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:9px;color:var(--ink)}
.pal-it .k{font:500 .857rem/1.4 var(--f-mono);color:var(--muted)}
.pal-it .l{font-size:.964rem;overflow-wrap:anywhere}
.pal-it .s{grid-column:2;font-size:.821rem;color:var(--muted);overflow-wrap:anywhere}
.pal-it[aria-selected="true"]{background:var(--sel)}
.pal-empty{padding:26px 14px;color:var(--muted);text-align:center}
.pal-foot{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line);font-size:.821rem;color:var(--muted)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:95;display:grid;gap:8px;max-width:min(440px,calc(100% - 32px))}
.toast>div{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:11px;font-size:.929rem;box-shadow:var(--shadow)}
.toast>div span{flex:1}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:0}

/* ---------- specyfikacja PECI ---------- */
.pspec{border:1px solid var(--wd-line);border-radius:12px;padding:12px 13px;display:grid;gap:11px;background:var(--surface)}
.sp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sp-head .lblc{color:var(--wd)}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);font-size:.857rem;font-weight:500;display:inline-flex;align-items:center;gap:5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-family:inherit}
.linkbtn .ic{width:14px;height:14px}
.sp-path{display:flex;align-items:center;gap:8px;background:var(--wd-bg);border-radius:9px;padding:7px 7px 7px 11px}
.sp-path code{flex:1;min-width:0;font:600 .929rem/1.45 var(--f-mono);color:var(--wd);overflow-wrap:anywhere}
.iconbtn.sm{width:28px;height:28px;border-radius:7px}
.iconbtn.sm .ic{width:15px;height:15px}
.sp-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:600 .786rem/1 var(--f-ui);letter-spacing:.02em;white-space:nowrap;color:var(--ink2);background:var(--sunken)}
.t-date,.t-datetime{color:var(--info);background:var(--info-bg)}
.t-bool{color:var(--mw);background:var(--mw-bg)}
.t-int,.t-dec{color:var(--xp);background:var(--xp-bg)}
.t-code{color:var(--wd);background:var(--wd-bg)}
.t-lz,.t-grp{color:var(--warn);background:var(--warn-bg)}
.sp-els{display:grid;gap:8px}
.elc{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:7px;min-width:0}
.elc-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.elc-n{font:600 .964rem/1.3 var(--f-mono);color:var(--ink);overflow-wrap:anywhere;margin-right:2px}
.elc-g{display:grid;grid-template-columns:minmax(92px,auto) minmax(0,1fr);gap:5px 12px;font-size:.893rem;align-items:baseline}
.elc-g .k{color:var(--muted);font-size:.821rem}
.svs{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:100%}
.sv{font:500 .821rem/1.5 var(--f-mono);background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink);overflow-wrap:anywhere;max-width:100%}
.sm{font-size:.821rem}
.warnt{color:var(--warn)}
.sp-dl{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:8px 12px;margin:0;font-size:.893rem}
.sp-dl dt{color:var(--muted)} .sp-dl dd{margin:0;min-width:0}
.achips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.achips .achip{margin:0}
.sp-evs{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.achip{display:inline-flex;margin:0 4px 4px 0;font:500 .786rem/1.6 var(--f-mono);padding:0 7px;border-radius:5px;border:1px dashed var(--line2);color:var(--faint);cursor:help}
.achip.on{border-style:solid;border-color:var(--wd-line);background:var(--wd-bg);color:var(--wd)}
.xvbox{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.xvrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.xvrow .lblc{color:var(--xp)}
.xvb{display:inline-flex;gap:6px;flex-wrap:wrap}
.xvbtn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:.857rem;font-weight:500;color:var(--ink2);white-space:nowrap}
.xvbtn .ic{width:14px;height:14px}
.xvbtn b{font-weight:700}
.xvbtn:hover:not([disabled]){background:var(--hover)}
.xvbtn.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.xvbtn.q[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.xvbtn[disabled]{opacity:.5;cursor:not-allowed}
.xvnote{margin-top:6px;font-size:.821rem;color:var(--warn);max-width:260px}
.tline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px}
.tpat{font:500 .786rem/1.3 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.xvmark{font:600 .714rem/1 var(--f-ui);padding:4px 5px;border-radius:5px;white-space:nowrap}
.xvmark.ok{background:var(--ok-bg);color:var(--ok)} .xvmark.q{background:var(--warn-bg);color:var(--warn)}
.specwrap{padding:16px}
table.t.spec td{font-size:.893rem}
table.t.spec .el2{font-weight:600;overflow-wrap:anywhere}
table.t.spec .cd{max-width:320px;margin-top:3px}
table.t.spec tr.selr td{background:var(--sel)}
table.t.spec td.xvc{min-width:196px}
table.t.spec .svs{max-width:260px}
.ghn{margin-left:10px;font:500 .786rem/1.2 var(--f-ui);letter-spacing:0;text-transform:none;color:var(--muted)}
.mini{display:inline-block;margin:3px 4px 0 0;font:500 .75rem/1.5 var(--f-ui);padding:0 6px;border-radius:5px;background:var(--wd-bg);color:var(--wd)}
.mini.warn{background:var(--warn-bg);color:var(--warn)}
table.t td.hl{color:var(--warn);font-weight:600}
.modal.wide{width:min(1000px,100%)}
.evl{font-size:.857rem;color:var(--wd);font-weight:500}
table.t.spec td.idc{white-space:nowrap}
.work.spec{grid-template-columns:268px minmax(0,1fr)}
.work.spec .detail{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);z-index:50;border-radius:0;border-width:0 0 0 1px;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.work.spec .detail.closed{display:none}
.backdrop.on{display:block;position:fixed;inset:0;z-index:45;background:var(--scrim)}

/* ---------- responsywność ---------- */
@media (min-width:1700px){
  .work{grid-template-columns:268px minmax(0,1fr) minmax(500px,620px)}
}
@media (max-width:1599px){
  .brand small{display:none}
  .tbtn.search{min-width:0}
  .tbtn.search kbd{display:none}
}
@media (max-width:1699px){
  .bfull{display:none}
  .brand small{display:none}
}
@media (max-width:1439px){
  .savestate span{display:none}
}
@media (max-width:1279px){
  .work{grid-template-columns:236px minmax(0,1fr)}
  .work.spec{grid-template-columns:236px minmax(0,1fr)}
  .work.full{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);z-index:50;border-radius:0;border-width:0 0 0 1px;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
  .detail.closed{display:none}
  .backdrop.on{display:block;position:fixed;inset:0;z-index:45;background:var(--scrim)}
  .pname{display:none}
  .tbtn.search span{display:none}
  .tbtn.search{width:36px;padding:0;justify-content:center}
}
@media (max-width:1180px){
  .top{flex-wrap:wrap}
  nav.views{order:3;flex-basis:100%;margin:0 -6px}
  .top-right{margin-left:auto}
}
@media (max-width:860px){
  .app{height:auto;min-height:100%;display:block}
  .top{position:sticky;top:env(safe-area-inset-top,0px)}
  .work,.work.full{display:block;padding-block:12px}
  .rail{display:none}
  .rail-select{display:block;padding:14px 16px 0}
  .rail-select select{width:100%;height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
  .pane{overflow:visible}
  .tabs{top:calc(env(safe-area-inset-top,0px) + var(--toph,100px))}
  .colh{top:calc(env(safe-area-inset-top,0px) + var(--toph,100px) + var(--tabs-h))}
  .grp{top:calc(env(safe-area-inset-top,0px) + var(--toph,100px) + var(--tabs-h))}
  .detail{width:100%;left:0;border-width:0;padding-left:env(safe-area-inset-left,0px);overflow:auto}
  .phead{padding:14px 16px 14px}
  .view{padding:16px 14px 24px}
  .splitv{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow .ar{transform:rotate(90deg);height:14px}
  .brand small{display:none}
  .savestate{display:none}
  .fsel{margin-left:0}
  .modal-wrap{padding-top:max(16px,env(safe-area-inset-top,0px))}
  .modal{max-height:none}
}
@media (max-width:600px){
  .bfull{display:none}
  .elc-g,.sp-dl{grid-template-columns:minmax(0,1fr)}
  .elc-g .k,.sp-dl dt{margin-top:4px}
  .specwrap{padding:12px 0}
  .langsw button{min-width:34px;padding:0 7px}
  .langsw button[aria-pressed="true"]{display:none}
  .langsw button+button{border-left:0}
  .top-right{gap:6px}
  .tbtn span:not(.avatar){display:none}
  .tbtn{padding:0 10px}
  .top{gap:6px 10px;min-height:52px;padding-block:6px}
  nav.views a{padding:6px 9px}
  .dtop{flex-wrap:wrap}
  .dhead h2{font-size:1.214rem}
  .phead h1,.ptitle h1{font-size:1.5rem}
}
@media (max-width:400px){
  .brand-mark{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

 zakończenia u dotychczasowego pracodawcy ani podstawy przejścia (art. 23¹ KP, porozumienie trójstronne, rozwiązanie i nowa umowa).","why":"Xpertis nie zakończy poprawnie zatrudnienia w bazie A ani nie założy zatrudnienia w bazie B (świadectwo pracy, ciągłość stażu, urlop).","prop":"Obowiązkowe pole PL w procesie Change Job (przeniesienie) w Workday, przekazywane w sekcji Additional Information.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: scenariusz 31"},{"id":"K-04","type":"Kwestia","proc":"P27","area":"Umowa","desc":"W próbce PCI sekcja Employee_Contract ma datę początku sprzed przeniesienia (umowa kontynuowana).","why":"Trzeba ustalić, czy w bazie B zakładamy nową umowę od dnia przeniesienia, czy kontynuację.","prop":"Reguła T16 zależna od trybu przejścia (K-03).","prio":"Wysoki","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: scenariusz 31"},{"id":"K-05","type":"Ryzyko","proc":"P27","area":"Daty","desc":"Company_Service_Date wypełnia ręcznie HR w procesie Change Job (definicja Chorus).","why":"Brak lub błędna data = błędna data zatrudnienia i staż w bazie B.","prop":"Walidacja w middleware: przy PCI Company_Service_Date = data skuteczności; inaczej kolejka wyjątków.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-06","type":"Kwestia","proc":"P01","area":"Daty stażowe","desc":"Rozbieżne definicje: słownik PECI – Hire_Date to data zatrudnienia w spółce; Data Dictionary (1.1.4) – pierwsza data zatrudnienia w Grupie.","why":"Błędna data zatrudnienia lub stażu w Xpertis (urlop, dodatki stażowe, jubileusze).","prop":"Ustalić znaczenie Hire_Date, Original_Hire_Date, Continuous_Service_Date i Company_Service_Date dla PL; opisać w T19.","prio":"Wysoki","owner":"Zespół Chorus (globalny)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI vs Data Dictionary"},{"id":"K-07","type":"Kwestia","proc":"P01","area":"Ubezpieczenia i podatki","desc":"Dane płacowe PL spoza standardu PECI: kod tytułu ubezpieczenia, prawo do emerytury/renty, urząd skarbowy, koszty uzyskania przychodu, oświadczenie PIT-2, PPK.","why":"Bez nich Xpertis nie zgłosi pracownika do ZUS ani nie naliczy poprawnie zaliczki PIT.","prop":"Dane wynikające z dokumentów pracownika prowadzić w Xpertis (dział płac); w Workday tylko dane z procesu HR. Decyzja per pole w P01.","prio":"Wysoki","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza wymagań PL"},{"id":"K-08","type":"Kwestia","proc":"P01, P09","area":"Adres","desc":"Czy konfiguracja adresu PL w Workday zawiera województwo, powiat, gminę, ulicę, nr domu i nr lokalu jako osobne pola? Data Dictionary oznacza Region i Region Subdivision jako zakres PL.","why":"Adres zamieszkania jest potrzebny w zgłoszeniu do ZUS i w PIT-11.","prop":"Jeśli brak – wzbogacenie w middleware z TERYT (T09) z kolejką wyjątków dla przypadków niejednoznacznych.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.5"},{"id":"K-09","type":"Kwestia","proc":"P01","area":"Staż pracy","desc":"Staż u poprzednich pracodawców (External Job History; DD: zakres PL i payroll) nie jest przesyłany w PECI.","why":"Wymiar urlopu, dodatek stażowy, nagroda jubileuszowa.","prop":"Prowadzić staż w Xpertis na podstawie świadectw pracy albo dodać raport/API z Workday.","prio":"Średni","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 7.3"},{"id":"K-10","type":"Kwestia","proc":"P13","area":"Wykształcenie","desc":"Sekcja Education jest w PECI; DD oznacza ją jako zakres PL i payroll. Czy Xpertis potrzebuje wykształcenia do stażu urlopowego?","why":"Wymiar urlopu wypoczynkowego (art. 155 KP).","prop":"Jeśli tak – słownik S32 i reguła wyboru najwyższego ukończonego poziomu.","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 7.6"},{"id":"K-11","type":"Kwestia","proc":"P12","area":"Dane szczególne","desc":"Niepełnosprawność: DD – Disability Type w zakresie PL i payroll; oznaczone jako dane szczególne wg RODO (kol. M), ale nie w kolumnie lokalnej (kol. N). Data ważności orzeczenia (End Date) jest poza zakresem PECI w Chorus.","why":"Kod ubezpieczenia, PFRON, wymiar urlopu i czasu pracy; zgodność z RODO.","prop":"Ujednolicić klasyfikację z IOD; zdecydować, czy dane prowadzić w Workday czy wyłącznie w Xpertis.","prio":"Wysoki","owner":"SG – IOD","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.8; słownik PECI"},{"id":"K-12","type":"Kwestia","proc":"P19","area":"Dane szczególne","desc":"Członkostwo w związku zawodowym (dane szczególne) – DD: zakres PL, bez flagi payroll. Czy Xpertis potrąca składki związkowe?","why":"Potrącenie wymaga informacji o członkostwie.","prop":"Jeśli potrącenia są stosowane – przekazywać tylko kod związku i daty, bez zapisu wartości w logach.","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 4.3"},{"id":"K-13","type":"Decyzja","proc":"P07","area":"Minimalizacja","desc":"Stan cywilny: DD – zakres PL, Ściśle poufne, bez flagi payroll; DTM: „nie raportujemy (wymóg prawny)”.","why":"Przekazanie do płac byłoby niezgodne z zasadą minimalizacji.","prop":"Wyłączyć z integracji: filtr w middleware i wyłączenie pola w konfiguracji PECI dla PL.","prio":"Średni","owner":"SG – IOD","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.8; DTM"},{"id":"K-14","type":"Ryzyko","proc":"P00","area":"Dane szczególne","desc":"Próbki PECI zawierają pole Religion (słownik Chorus: w zakresie), a Data Dictionary wyklucza je dla PL jako dane szczególne.","why":"Przetwarzanie danych szczególnych w middleware bez podstawy.","prop":"Wyłączyć Religion i Ethnicity w konfiguracji PECI dla PL; dodatkowo filtr w middleware (T18).","prio":"Wysoki","owner":"Zespół Chorus (globalny)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: scenariusze 27, 28"},{"id":"K-15","type":"Kwestia","proc":"P29","area":"Zakres","desc":"Contingent Worker (DD 1.16: zakres PL i payroll) nie jest obejmowany przez PECI (służy do tego WECI).","why":"Jeśli Xpertis rozlicza umowy cywilnoprawne osób prowadzonych w Workday – brak przepływu danych.","prop":"Ustalić, kto jest Contingent Workerem w PL i czy Xpertis go rozlicza.","prio":"Wysoki","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 1.16"},{"id":"K-16","type":"Kwestia","proc":"P22","area":"Zakres","desc":"Płatności jednorazowe: sekcja dostępna w PECI, w DD poza zakresem PL.","why":"Premie i nagrody jednorazowe muszą trafić na listę płac.","prop":"Ustalić, czy są wprowadzane w Workday (P22 w zakresie) czy bezpośrednio w Xpertis.","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 4.5"},{"id":"K-17","type":"Kwestia","proc":"P21","area":"Składniki płacowe","desc":"Kody składników (Compensation Earnings and Deductions) mapuje zadanie Workday „Maintain External Payroll Earnings”; sekcja nie ma oznaczenia zakresu w słowniku Chorus.","why":"Kody zewnętrzne muszą odpowiadać składnikom Xpertis – wspólnym dla 22 baz albo różnym per baza.","prop":"Kody wspólne – mapowanie w Workday; różne per baza – słownik S17 w middleware.","prio":"Wysoki","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-18","type":"Ryzyko","proc":"Wszystkie","area":"Słowniki","desc":"W próbkach część wartości to techniczne identyfikatory Workday (np. EMPLOYEE_CONTRACT_TYPE-6-72, TERMINATION_CATEGORY-6-5), a te same pola mają raz kody, raz nazwy (np. „Mutual Consent”).","why":"Mapowanie na technicznych ID jest kruche i może różnić się między tenantami.","prop":"Dla PL wymagać stabilnych Reference ID lub integration map dla każdego pola kodowego.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: próbki"},{"id":"K-19","type":"Kwestia","proc":"Wszystkie","area":"DTM","desc":"Część podpowiedzi z DTM (migracja) jest błędna: National ID → „narodowość”, National ID Type → „kod narodowości”, Government ID → „obywatelstwo”, Company Service Date → „data do”, Pay Group ID → „Hay class”, Expiration Date → „data umowy ekspatriacyjnej”.","why":"Ryzyko przeniesienia błędów z migracji do interfejsu.","prop":"Kolumnę „Podpowiedź z DTM” traktować pomocniczo; poprawić DTM.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"DTM Core V3"},{"id":"K-20","type":"Kwestia","proc":"Wszystkie","area":"Daty","desc":"Daty w próbkach mają format xs:date ze strefą (np. 2025-10-01-07:00) albo dd/mm/rrrr (konwersja w Excelu).","why":"Przesunięcie dnia przy konwersji stref czasowych.","prop":"Reguła T01: część daty bez przeliczania strefy; potwierdzić na plikach PL.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: próbki"},{"id":"K-21","type":"Kwestia","proc":"Wszystkie","area":"Testy","desc":"Próbki pochodzą z tenantów testowych innych krajów (AR, TH, CH, DE i in.). Brak próbki End Additional Job (scenariusz 17).","why":"Wartości PL (kody, adres, dokumenty) mogą się różnić.","prop":"Wygenerować pliki PECI z tenantu PL dla każdego procesu z arkusza Procesy.","prio":"Wysoki","owner":"Partner Workday","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: zakładka Business Processes"},{"id":"K-22","type":"Kwestia","proc":"P23","area":"Nieobecności","desc":"Sekcja Time Off jest poza zakresem PECI; w zakresie jest tylko Leave of Absence. Które nieobecności długotrwałe prowadzimy w Workday dla PL i jak mapują się na typy w Xpertis?","why":"Skutki płacowe i ubezpieczeniowe zależą od rodzaju nieobecności.","prop":"Lista typów LOA dla PL ze skutkiem w Xpertis (S27); nieobecności krótkie pozostają poza Workday.","prio":"Wysoki","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-23","type":"Kwestia","proc":"P20","area":"Zakres","desc":"Oddelegowania (International Assignment): pola PECI ze statusem „process TBD”, DD – zakres PL i payroll.","why":"Wpływ na składki, podatek i listę płac.","prop":"Ustalić proces i zakres przed konfiguracją.","prio":"Niski","owner":"Zespół Chorus (globalny)","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI; Data Dictionary 1.12"},{"id":"K-24","type":"Kwestia","proc":"P00","area":"Harmonogram","desc":"Częstotliwość uruchamiania PECI, okna zamknięcia list płac w 22 bazach, obsługa zmian wstecznych do zamkniętych okresów.","why":"Zmiany mogą nie trafić na właściwą listę płac.","prop":"Przebieg codzienny + przebieg kontrolny przed zamknięciem listy; zmiany wsteczne do zamkniętych okresów – zadanie dla płac.","prio":"Wysoki","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"K-25","type":"Kwestia","proc":"P00","area":"Znaki","desc":"Kodowanie znaków w imporcie Xpertis (UTF-8 czy Windows-1250) i obsługa znaków spoza alfabetu polskiego.","why":"Utrata polskich znaków w nazwiskach i adresach.","prop":"Reguła T07; potwierdzić format importu Xpertis.","prio":"Średni","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"K-26","type":"Kwestia","proc":"P00","area":"Klucz pracownika","desc":"Kto nadaje numer ewidencyjny w Xpertis (per baza) i czy wraca on do middleware (XREF) oraz do Workday (np. jako Custom ID)?","why":"Bez zwrotu numeru nie zaktualizujemy właściwej kartoteki.","prop":"Xpertis nadaje numer i zwraca go w potwierdzeniu; middleware zapisuje w XREF (T06).","prio":"Wysoki","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"K-27","type":"Kwestia","proc":"P01, P15","area":"Czas pracy","desc":"Konwersja FTE na ułamek etatu i odwzorowanie Work_Shift na kalendarz / system czasu pracy w Xpertis. Paid_FTE w próbkach = 0.","why":"Błędny wymiar etatu = błędne wynagrodzenie i normy czasu pracy.","prop":"Wymiar z Full_Time_Equivalent_Percentage (T10); słownik S10; Paid_FTE nie używać.","prio":"Wysoki","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"PECI: próbki"},{"id":"K-28","type":"Kwestia","proc":"P11","area":"Rodzina","desc":"Zgłoszenie członków rodziny do ubezpieczenia zdrowotnego wymaga m.in. PESEL członka rodziny i stopnia pokrewieństwa. DD: dane rodziny poza zakresem PL (poza kontaktami awaryjnymi).","why":"Jeśli zgłoszenia robi Xpertis – dane muszą tam trafić z Workday albo z dokumentów pracownika.","prop":"Ustalić, czy dane rodziny prowadzimy w Workday dla PL; jeśli nie – P11 poza zakresem.","prio":"Średni","owner":"SG – Kadry","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Data Dictionary 3.15, 15.1"},{"id":"K-29","type":"Kwestia","proc":"P02","area":"Ponowne zatrudnienie","desc":"Czy Xpertis przy ponownym zatrudnieniu w tej samej bazie tworzy nowe zatrudnienie w istniejącej kartotece, czy nową kartotekę?","why":"Ciągłość danych osobowych i historii płacowej.","prop":"Identyfikacja po WID/PESEL w XREF; nowe zatrudnienie w istniejącej kartotece.","prio":"Średni","owner":"Partner Xpertis","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza procesu"},{"id":"K-30","type":"Kwestia","proc":"P30","area":"Dane referencyjne","desc":"PECI nie przesyła danych referencyjnych (nowe MPK, lokalizacje, stanowiska, układy, plany).","why":"Rekord pracownika z nieznanym kodem zostanie odrzucony.","prop":"Proces utrzymania słowników: zmiana w Workday → utworzenie w Xpertis przed użyciem; middleware odrzuca nieznane kody do kolejki wyjątków.","prio":"Średni","owner":"SG – IT","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza procesu"},{"id":"K-31","type":"Kwestia","proc":"P10","area":"Rachunek","desc":"Podział wynagrodzenia na kilka rachunków (Distribution_Amount / Percentage) – czy dopuszczamy w PL i czy Xpertis to obsługuje?","why":"Wypłata wynagrodzenia.","prop":"Jeden rachunek główny; wyjątki po decyzji płac.","prio":"Niski","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Słownik PECI"},{"id":"K-32","type":"Ryzyko","proc":"P04, P26","area":"Korekty","desc":"Anulowanie zatrudnienia lub rozwiązania po zgłoszeniu do ZUS albo po zamknięciu listy płac.","why":"Potrzebne korekty zgłoszeń i list płac.","prop":"Middleware nie usuwa danych – przekazuje anulowanie do Xpertis z flagą do weryfikacji przez płace (T15).","prio":"Średni","owner":"SG – Płace","due":"","status":"Otwarta","decision":"","opened":"22.10.2026","closed":"","src":"Analiza procesu"},{"id":"D-01","type":"Decyzja","proc":"Wszystkie","area":"Architektura","desc":"PECI traktujemy jako wyzwalacz zdarzenia. Brakujące dane middleware uzupełnia z Workday (API / raport), z Xpertis (baza źródłowa) lub z tabel referencyjnych.","why":"PECI przesyła tylko sekcje dotknięte zmianą; Xpertis wymaga kompletu danych dla operacji.","prop":"Do zatwierdzenia na pierwszym warsztacie.","prio":"Wysoki","owner":"SG – IT","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-02","type":"Decyzja","proc":"Wszystkie","area":"Architektura","desc":"Jedna warstwa orkiestracji w middleware (MuleSoft) z kanonicznym modelem „Pracownik PL” i jednym adapterem Xpertis z 22 profilami połączeń; Control-M (MFT) jako transport pliku.","why":"Jedna logika zamiast 22 integracji; zmiany w Workday nie wymagają zmian w każdej bazie.","prop":"Do zatwierdzenia.","prio":"Wysoki","owner":"SG – IT","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-03","type":"Decyzja","proc":"Wszystkie","area":"Słowniki","desc":"Mapowanie wartości: stabilne 1:1 – integration map w Workday; zależne od bazy Xpertis lub kontekstu – tabele w middleware.","why":"Mniej logiki w middleware tam, gdzie Workday ma natywne mapowanie.","prop":"Do zatwierdzenia.","prio":"Średni","owner":"Integrator (middleware)","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-04","type":"Decyzja","proc":"Wszystkie","area":"Jakość danych","desc":"Bramka kompletności: brak wymaganego pola → brak zapisu w Xpertis i zadanie w kolejce wyjątków dla właściciela danych. Zero częściowych zapisów.","why":"Spójność danych płacowych w 22 bazach.","prop":"Do zatwierdzenia (T25).","prio":"Wysoki","owner":"Integrator (middleware)","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-05","type":"Decyzja","proc":"P27","area":"Przeniesienie","desc":"Kolejność kroków przy przeniesieniu: stanowisko i zatrudnienie w bazie B, potem zakończenie w bazie A, na końcu przeniesienie danych historycznych; każdy krok idempotentny.","why":"Przy awarii pracownik jest chwilowo w dwóch bazach, a nie w żadnej.","prop":"Do zatwierdzenia (T16).","prio":"Wysoki","owner":"Integrator (middleware)","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"},{"id":"D-06","type":"Decyzja","proc":"Wszystkie","area":"Bezpieczeństwo","desc":"Dane osobowe i płacowe: szyfrowanie w transporcie, krótka retencja plików w middleware, maskowanie PESEL, rachunków i danych szczególnych w logach, dostęp wg najmniejszych uprawnień.","why":"Zgodność z RODO i polityką bezpieczeństwa Grupy.","prop":"Do zatwierdzenia z IOD.","prio":"Wysoki","owner":"SG – IOD","due":"","status":"Do zatwierdzenia","decision":"","opened":"22.10.2026","closed":"","src":"Architektura"}],"rules":[{"id":"T01","name":"Daty (xs:date)","scope":"Wszystkie pola typu Data","desc":"PECI przesyła daty jako xs:date z przesunięciem strefy czasowej tenanta (RRRR-MM-DD±hh:mm). Middleware bierze część daty bez przeliczania strefy i zapisuje w formacie Xpertis.","example":"2025-10-01-07:00 → 01-10-2025 (format docelowy wg Xpertis; DTM podaje DD-MM-RRRR)","where":"Middleware","error":"Niepoprawna data → odrzucenie zdarzenia do kolejki wyjątków.","status":"Propozycja"},{"id":"T02","name":"Momenty zdarzeń (xs:dateTime)","scope":"Effective_Change: Effective_Moment, Entry_Moment; Summary: Updated_From/To","desc":"Effective_Moment wyznacza datę skuteczności operacji w Xpertis – używamy części daty bez konwersji strefy. Entry_Moment służy do audytu i wykrywania zmian wstecznych; w logach zapisujemy go w czasie Europe/Warsaw.","example":"2026-01-01T00:00:00.000-08:00 → data skuteczności 01-01-2026","where":"Middleware","error":"Brak Effective_Moment → odrzucenie zdarzenia.","status":"Propozycja"},{"id":"T03","name":"Wartości logiczne","scope":"Pola 1/0 (np. Active, Terminated, Is_Rehire, Primary_Job, Apply_FTE)","desc":"1 = prawda, 0 = fałsz. Brak elementu nie oznacza fałszu – oznacza brak zmiany lub brak danych (np. Primary_Job nie występuje dla pozycji dodatkowej).","example":"1 → T, 0 → N (zapis wg Xpertis)","where":"Middleware","error":"Wartość spoza 1/0 → kolejka wyjątków.","status":"Propozycja"},{"id":"T04","name":"Kody Workday → kody Xpertis","scope":"Pola kodowe (arkusz Słowniki)","desc":"Każde pole kodowe tłumaczone wg słownika. Stabilne mapowania 1:1 mogą być realizowane w Workday (integration map, kolumna „Mapowanie wartości w Workday”); mapowania zależne od bazy Xpertis lub kontekstu – w tabelach middleware. Bez wartości domyślnych.","example":"Full_time → pełny etat (kod Xpertis wg słownika S08)","where":"Workday – integration map lub middleware","error":"Kod bez mapowania → zdarzenie wstrzymane w kolejce wyjątków; właściciel słownika uzupełnia mapowanie.","status":"Propozycja"},{"id":"T05","name":"Routing do bazy Xpertis","scope":"Summary: Payroll_Company_Code, Pay_Group_Code; Position › Organization (Company)","desc":"Kod spółki płacowej (i grupy płacowej) wskazuje jedną z 22 baz Xpertis i kod pracodawcy. PCO trafia do bazy dotychczasowego pracodawcy, PCI – do bazy nowego.","example":"Payroll_Company_Code 01234 → baza XP_07 (przykład)","where":"Middleware (rejestr kluczy XREF)","error":"Nieznana spółka lub grupa → wstrzymanie całego bloku pracownika.","status":"Propozycja"},{"id":"T06","name":"Klucz pracownika (XREF)","scope":"Worker_Summary: WID, Employee_ID; numer ewidencyjny Xpertis","desc":"WID jest stałym kluczem osoby. Middleware prowadzi rejestr: WID / Employee_ID ↔ numer ewidencyjny w każdej bazie Xpertis (jedna osoba może mieć kartoteki w kilku bazach). Numer nadaje Xpertis i zwraca w potwierdzeniu.","example":"WID 8874… ↔ baza A: 000123, baza B: 004567","where":"Middleware","error":"Brak wpisu w XREF przy zdarzeniu innym niż HIR/PCI → kolejka wyjątków.","status":"Propozycja"},{"id":"T07","name":"Teksty i polskie znaki","scope":"Imiona, nazwiska, adresy, nazwy stanowisk","desc":"PECI jest w UTF-8. Zachowujemy polskie znaki; przy imporcie w innym kodowaniu (np. Windows-1250) znaki spoza zestawu są zgłaszane, nie usuwane po cichu. Usuwamy wiodące i końcowe spacje; nie zmieniamy wielkości liter.","example":"„Żółkiewska ” → „Żółkiewska”","where":"Middleware","error":"Znak niemożliwy do zapisania → kolejka wyjątków z podglądem wartości.","status":"Propozycja"},{"id":"T08","name":"Walidacja PESEL","scope":"Person_Identification › National_Identifier: National_ID","desc":"11 cyfr, poprawna cyfra kontrolna, zgodność daty urodzenia i płci z danymi z sekcji Personal. Osoba bez PESEL wymaga dokumentu tożsamości (paszport).","example":"85071512345 → sprawdzenie sumy kontrolnej i daty 15-07-1985","where":"Middleware","error":"Niezgodność → kolejka wyjątków dla kadr; bez zapisu w Xpertis.","status":"Propozycja"},{"id":"T09","name":"Adres: podział i uzupełnienie","scope":"Person_Communication › Address","desc":"Linie adresu Workday rozdzielane na pola Xpertis (ulica, nr domu, nr lokalu) wg konfiguracji adresu PL. Kod pocztowy w formacie NN-NNN. Województwo, powiat i gmina – z pól Workday, jeśli skonfigurowane; w przeciwnym razie z rejestru TERYT po kodzie pocztowym i miejscowości.","example":"„ul. Polna 12/4”, 61-001 Poznań → ulica Polna, dom 12, lokal 4, gmina Poznań","where":"Middleware (tabela TERYT)","error":"Niejednoznaczne przypisanie gminy → kolejka wyjątków.","status":"Propozycja"},{"id":"T10","name":"Wymiar etatu","scope":"Position: Full_Time_Equivalent_Percentage, Scheduled_Weekly_Hours, Default_Weekly_Hours","desc":"Wymiar z Full_Time_Equivalent_Percentage (ułamek dziesiętny) przeliczany na ułamek zwykły Xpertis wg tabeli dozwolonych wymiarów. Kontrola: Scheduled / Default = FTE. Paid_FTE i Working_FTE nie są źródłem (w próbkach = 0).","example":"0,5 → 1/2; 0,75 → 3/4; 0,875 → 7/8","where":"Middleware","error":"Wymiar spoza tabeli → kolejka wyjątków.","status":"Propozycja"},{"id":"T11","name":"Kwoty i stawki","scope":"Compensation_Plans: Amount, Prorated_Amount; Compensation_Earnings_and_Deductions: Amount","desc":"Liczby z kropką dziesiętną, zaokrąglenie do 2 miejsc. Źródłem stawki jest plan (Compensation_Plans), nie podsumowanie Total_Base_Pay. Apply_FTE = 1 oznacza kwotę dla pełnego etatu. Waluta PLN; inna waluta → wyjątek.","example":"Amount 8500.00, Frequency Monthly, Apply_FTE 1 → stawka miesięczna 8 500,00 PLN (pełny etat)","where":"Middleware","error":"Waluta ≠ PLN lub brak częstotliwości → kolejka wyjątków.","status":"Propozycja"},{"id":"T12","name":"Kolejność i idempotencja","scope":"Effective_Change (atrybut Sequence), Summary: Integration_Event","desc":"Zmiany jednego pracownika przetwarzane ściśle w kolejności Sequence; różni pracownicy równolegle. Klucz idempotencji: WID + Derived_Event_Code + Effective_Moment + Sequence. Ponowne przetworzenie pliku nie tworzy duplikatów.","example":"Sequence 0 (DTA) przed 1 (TERM)","where":"Middleware","error":"Błąd kroku → zatrzymanie kolejnych zmian tego pracownika.","status":"Propozycja"},{"id":"T13","name":"Elementy powtarzalne i atrybuty zmian","scope":"Atrybuty isAdded / isUpdated / isDeleted, wartość poprzednia (priorValue)","desc":"Zmiana elementu powtarzalnego (adres, organizacja, plan) przychodzi jako isDeleted dla starego i isAdded dla nowego – middleware zamyka stary zapis w Xpertis (data skuteczności – 1) i otwiera nowy. Pola z wartością poprzednią pozwalają zbudować historię.","example":"Address isDeleted (stary) + Address isAdded (nowy) → zamknięcie i otwarcie adresu","where":"Middleware","error":"Element isDeleted bez odpowiednika w Xpertis → ostrzeżenie w logu.","status":"Propozycja"},{"id":"T14","name":"Klasyfikacja zdarzeń DTA","scope":"Effective_Change: Derived_Event_Code = DTA; Transaction_Log: Transaction_Type","desc":"DTA oznacza „inne zmiany danych”. Operację w Xpertis wybiera się na podstawie zmienionych sekcji (atrybuty isUpdated/isAdded) i Transaction_Type (np. Change Job, Change Legal Name, Maintain Employee Contracts).","example":"DTA + sekcja Payment_Election isAdded → zmiana rachunku (P10)","where":"Middleware","error":"Nierozpoznana kombinacja → kolejka wyjątków do klasyfikacji.","status":"Propozycja"},{"id":"T15","name":"Korekty i anulowania","scope":"Kody -C i -R: HIR-C, HIR-R, TERM-C, TERM-R, LOA-C, LOA-R, RFL-R","desc":"Anulowanie (-R) cofa skutki wcześniejszej operacji w Xpertis, a nie tworzy nowej. Para -R + kod podstawowy w jednym pliku oznacza zmianę daty – przetwarzana jako korekta. Jeśli operacja dotyczy zamkniętej listy płac – zadanie dla płac.","example":"TERM-R + TERM → zmiana daty rozwiązania","where":"Middleware + Xpertis","error":"Brak operacji do cofnięcia → kolejka wyjątków.","status":"Propozycja"},{"id":"T16","name":"Przeniesienie między pracodawcami (PCO + PCI)","scope":"Zdarzenia PCO i PCI tego samego pracownika","desc":"Jedna saga: stanowisko i zatrudnienie w bazie B od D, następnie zakończenie w bazie A z datą D–1, na końcu przeniesienie danych historycznych (np. saldo urlopu). Tryb przejścia (art. 23¹ KP / porozumienie / nowa umowa) steruje dokumentami – źródło do ustalenia (K-03).","example":"PCO (A, D=01-05-2026) + PCI (B) → B od 01-05-2026, A do 30-04-2026","where":"Middleware","error":"Błąd w B → brak zmian w A; błąd w A po sukcesie w B → kompensacja i wyjątek.","status":"Propozycja"},{"id":"T17","name":"Rozwiązanie umowy","scope":"Worker_Status: Termination_Date, Primary_Termination_Reason, Primary_Termination_Category, Local_Termination_Reason","desc":"Termination_Date = ostatni dzień zatrudnienia (do potwierdzenia). Tryb rozwiązania i podstawa prawna (art. KP) oraz strona inicjująca wynikają z kombinacji przyczyny głównej i lokalnej wg słownika S26.","example":"Terminate_Employee_Mutual_Mutual_Consent → porozumienie stron (art. 30 § 1 pkt 1 KP)","where":"Middleware (słownik S26)","error":"Brak mapowania przyczyny → kolejka wyjątków dla kadr.","status":"Propozycja"},{"id":"T18","name":"Dane szczególne i minimalizacja","scope":"Religion, Ethnicity, Marital_Status, Disability, Union, dane rodziny","desc":"Pola spoza zakresu PL nie są przekazywane do Xpertis (lista dozwolonych pól). Dane szczególne nie trafiają do logów; w logach maskujemy też PESEL i numery rachunków.","example":"Religion w pliku → pominięcie, wpis w logu bez wartości","where":"Middleware + konfiguracja PECI","error":"Pole spoza listy dozwolonych → pominięcie i alert do właściciela integracji.","status":"Propozycja"},{"id":"T19","name":"Daty stażowe","scope":"Worker_Status: Hire_Date, Original_Hire_Date, Continuous_Service_Date, Company_Service_Date, First_Day_of_Work","desc":"Każda data trafia do jednego, uzgodnionego pola Xpertis. Semantyka do ustalenia (K-06): PECI – Hire_Date to data w spółce, Data Dictionary – data w Grupie.","example":"Company_Service_Date (PCI) → data zatrudnienia w bazie B","where":"Middleware","error":"Brak wymaganej daty → kolejka wyjątków.","status":"Propozycja"},{"id":"T20","name":"Rodzaj umowy","scope":"Employee_Contract: Contract_Type, Start_Date, End_Date; Worker_Status: End_Employment_Date; Position: Worker_Type","desc":"Rodzaj umowy Xpertis (okres próbny / czas określony / czas nieokreślony) wyznaczany z Contract_Type, a kontrolnie z Worker_Type i daty końca. Kolejna umowa = nowy rekord umowy w Xpertis.","example":"Fixed Term contract + End_Date 31-12-2026 → umowa na czas określony do 31-12-2026","where":"Middleware (słownik S06)","error":"Sprzeczne dane (np. czas nieokreślony z datą końca) → kolejka wyjątków.","status":"Propozycja"},{"id":"T21","name":"Telefon i e-mail","scope":"Person_Communication › Phone, Email","desc":"Telefon z Phone_Number_With_Country_Code normalizowany do formatu +48 NNN NNN NNN. E-mail: Usage_Type WORK = służbowy, HOME = prywatny (DTM: domena @sg.com = służbowy).","example":"+48 (61) 1234567 → +48 61 123 45 67","where":"Middleware","error":"Niepoprawny format → zapis bez telefonu i ostrzeżenie.","status":"Propozycja"},{"id":"T22","name":"Rachunek bankowy","scope":"Payment_Election: IBAN, Account_Number, Bank_ID, BIC","desc":"Walidacja IBAN PL (28 znaków, suma kontrolna) albo NRB (26 cyfr). Zapis w formacie wymaganym przez Xpertis. Podział wynagrodzenia na kilka rachunków tylko po decyzji (K-31).","example":"PL61 1090 1014 0000 0712 1981 2874 → 61109010140000071219812874","where":"Middleware","error":"Niepoprawny numer → brak zmiany rachunku, wyjątek dla płac.","status":"Propozycja"},{"id":"T23","name":"Podział kosztów","scope":"Costing_Allocation: Allocation_Percentage, Worktag_Code, daty","desc":"Allocation_Percentage jest ułamkiem (1 = 100%). Suma udziałów dla pracownika = 100%. Worktag_Code (MPK) tłumaczony wg słownika S14.","example":"0.2 / 0.8 → 20% MPK 200001, 80% MPK 200003","where":"Middleware","error":"Suma ≠ 100% lub nieznane MPK → kolejka wyjątków.","status":"Propozycja"},{"id":"T24","name":"Kontrola kompletności pliku","scope":"Summary: Worker_Count, Full_Snapshot, Ad_Hoc_Run, First_Primary_Run_of_Pay_Period","desc":"Liczba przetworzonych pracowników = Worker_Count. Full_Snapshot = 1 uruchamia tryb rekoncyliacji (porównanie stanu), nie operacje kadrowe.","example":"Worker_Count 152, przetworzono 151 → alert","where":"Middleware","error":"Niezgodność → alert do właściciela integracji.","status":"Propozycja"},{"id":"T25","name":"Bramka kompletności","scope":"Wszystkie pola z „Wymagane w Xpertis” = Tak","desc":"Przed zapisem w Xpertis middleware sprawdza komplet pól wymaganych dla danej operacji. Brak → brak zapisu i zadanie w kolejce wyjątków dla właściciela danych. Zero częściowych zapisów.","example":"HIR bez PESEL i bez paszportu → zadanie dla kadr","where":"Middleware","error":"—","status":"Propozycja"},{"id":"T26","name":"Dodatkowe zatrudnienie","scope":"Position: Primary_Job, Add_Additional_Job_Reason, End_Additional_Job_Reason, Position_End_Date","desc":"Pozycja bez elementu Primary_Job jest pozycją dodatkową. Każda pozycja (Position_ID) ma własny rekord zatrudnienia/umowy w Xpertis – jeśli Xpertis to obsługuje (K-29 dotyczy ponownego zatrudnienia; tu decyzja w P18).","example":"Position P158551 bez Primary_Job → druga umowa","where":"Middleware","error":"Brak obsługi w Xpertis → wyjątek.","status":"Propozycja"},{"id":"T27","name":"Nieobecności długotrwałe","scope":"Leave_of_Absence: typ, daty","desc":"Leave_of_Absence_Type → rodzaj nieobecności Xpertis (słownik S27). Daty: Leave_Start_Date, Estimated_Leave_End_Date (planowana), Leave_End_Date (faktyczna, przy powrocie).","example":"Family_leave_incl_elderly 01-10–01-11 → nieobecność typu X w Xpertis","where":"Middleware (słownik S27)","error":"Nieznany typ → kolejka wyjątków.","status":"Propozycja"}],"dicts":[{"id":"S01","name":"Pracodawca → baza Xpertis","fields":"Summary: Payroll_Company_Code; Position › Organization (Company): Organization_Code / Mapped_Value","wdvals":"Kody spółek PL w Workday","mapped":"Tak (Mapped_Value)","where":"Middleware – tabela","dbdep":"Tak (definiuje bazę)","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"1","uses":"6","note":"Podstawa routingu do 22 baz. Jeden wiersz na pracodawcę: kod Workday, baza Xpertis, kod pracodawcy w bazie."},{"id":"S02","name":"Grupa płacowa → lista płac","fields":"Summary: Pay_Group_Code","wdvals":"Grupy płacowe PL w Workday","mapped":"Nie","where":"Middleware – tabela","dbdep":"Tak","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"1","uses":"3","note":"Zależy od K-02 (1 pracodawca = 1 grupa płacowa?)."},{"id":"S03","name":"Status pracownika","fields":"Worker_Status: Status","wdvals":"Active / On Leave / Terminated","mapped":"Nie","where":"Middleware – tabela","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"3","uses":"6","note":"—"},{"id":"S04","name":"Przyczyna zatrudnienia","fields":"Worker_Status: Hire_Reason; Compensation: Compensation_Change_Reason (przy HIR)","wdvals":"Kategorie CHORUS (doc. Business Processes Category reasons)","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"4","uses":"2","note":"—"},{"id":"S05","name":"Typ pracownika","fields":"Position: Worker_Type","wdvals":"Kategorie CHORUS","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"4","uses":"3","note":"Kontrolnie z rodzajem umowy (T20)."},{"id":"S06","name":"Rodzaj umowy","fields":"Employee_Contract: Contract_Type","wdvals":"Konfiguracja PL","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"3","uses":"2","note":"W próbkach niespójne wartości (nazwy i techniczne ID) – K-18."},{"id":"S07","name":"Status umowy","fields":"Employee_Contract: Contract_Status","wdvals":"Open / Closed","mapped":"Tak","where":"Middleware – tabela","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"2","uses":"3","note":"—"},{"id":"S08","name":"Pełny / niepełny etat","fields":"Position: Position_Time_Type","wdvals":"Full_time / Part_time","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"2","uses":"4","note":"—"},{"id":"S09","name":"Rodzaj stawki","fields":"Position: Pay_Rate_Type","wdvals":"Salary / Hourly","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"2","uses":"3","note":"—"},{"id":"S10","name":"Zmiana robocza → kalendarz / system czasu pracy","fields":"Position: Work_Shift","wdvals":"Konfiguracja PL","mapped":"Tak","where":"Middleware – tabela","dbdep":"Tak","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"1","uses":"3","note":"Kalendarze w Xpertis mogą różnić się między bazami."},{"id":"S11","name":"Kategoria pracownika","fields":"Position: Job_Category","wdvals":"Cadre / White Collar / Blue Collar (opis Chorus); w próbkach Indirect_Labor, Sales_Labor","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"2","uses":"2","note":"Do potwierdzenia znaczenia dla PL (umysłowy / fizyczny)."},{"id":"S12","name":"Profil stanowiska → stanowisko / kod zawodu","fields":"Position: Job_Profile","wdvals":"Profile stanowisk Workday","mapped":"Nie","where":"Middleware – tabela","dbdep":"Do ustalenia","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"0","uses":"4","note":"Opcjonalnie kod zawodu (KZiS), jeśli wymagany w Xpertis."},{"id":"S13","name":"Lokalizacja → miejsce pracy","fields":"Position › Business_Site: Location_ID","wdvals":"Kody lokalizacji MDM (SR…)","mapped":"Nie","where":"Middleware – tabela","dbdep":"Tak","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"0","uses":"3","note":"Miejsce wykonywania pracy w umowie."},{"id":"S14","name":"MPK","fields":"Position › Organization (Cost_Center); Costing_Allocation › Costing_Worktag: Worktag_Code","wdvals":"Kody centrów kosztów","mapped":"Tak (Mapped_Value)","where":"Middleware – tabela","dbdep":"Tak","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"0","uses":"8","note":"Utrzymanie słownika – P30."},{"id":"S15","name":"Przyczyna zmiany stanowiska / warunków","fields":"Position: Job_Change_Reason","wdvals":"Kategorie CHORUS","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"3","uses":"3","note":"—"},{"id":"S16","name":"Przyczyna zmiany wynagrodzenia","fields":"Compensation: Compensation_Change_Reason","wdvals":"Kategorie CHORUS","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"2","uses":"4","note":"—"},{"id":"S17","name":"Plany i elementy wynagrodzenia → składniki Xpertis","fields":"Compensation_Plans: Compensation_Plan, Compensation_Element; Compensation_Earnings_and_Deductions: External_Payroll_Code","wdvals":"Plany wynagrodzeń PL; kody z Maintain External Payroll Earnings","mapped":"Tak","where":"Do ustalenia","dbdep":"Do ustalenia","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"4","uses":"13","note":"Kluczowy słownik płacowy (K-17)."},{"id":"S18","name":"Częstotliwość","fields":"Compensation_Plans: Frequency; Compensation: Frequency","wdvals":"Monthly / Annual / Hourly …","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"3","uses":"4","note":"—"},{"id":"S19","name":"Kategoria zaszeregowania","fields":"Compensation: Compensation_Grade, Compensation_Grade_Profile, Compensation_Package","wdvals":"Grade SG0…SGn","mapped":"Tak","where":"Middleware – tabela","dbdep":"Do ustalenia","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"2","uses":"2","note":"DTM: „Hay class”."},{"id":"S20","name":"Płeć","fields":"Personal: Gender; Related_Person: Gender","wdvals":"Male / Female","mapped":"Tak","where":"Workday – integration map","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"2","uses":"2","note":"—"},{"id":"S21","name":"Kraj i obywatelstwo","fields":"Country, Nationality, Country_of_Birth, Citizenship_Status_ID","wdvals":"ISO 3166-1 alfa-2 (w PECI), kody statusu obywatelstwa","mapped":"Częściowo","where":"Middleware – tabela","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"1","uses":"7","note":"DD opisuje kody alfa-3 dla konwersji; w PECI kraje są w alfa-2 (np. AR)."},{"id":"S22","name":"Typ dokumentu tożsamości","fields":"National_ID_Type, Passport_ID_Type, Government_ID_Type, Visa_ID_Type","wdvals":"Konfiguracja PL (np. PESEL, dowód osobisty)","mapped":"Tak","where":"Middleware – tabela","dbdep":"Nie","ownWD":"Partner Workday","ownXP":"Partner Xpertis","status":"Propozycja","nvals":"3","uses":"6","note":"—"},{"id":"S23","name":"Rodzaj i przeznaczenie adresu","fields": nia PECI, okna zamknięcia list płac w 22 bazach, obsługa zmian wstecznych do zamkniętych okresów.":"PECI run frequency, payroll close windows in 22 databases, handling of retroactive changes to closed periods.","Część podpowiedzi z DTM (migracja) jest błędna: National ID → „narodowość”, National ID Type → „kod narodowości”, Government ID → „obywatelstwo”, Company Service Date → „data do”, Pay Group ID → „Hay class”, Expiration Date → „data umowy ekspatriacyjnej”.":"Some DTM (migration) hints are wrong: National ID → “nationality”, National ID Type → “nationality code”, Government ID → “citizenship”, Company Service Date → “date to”, Pay Group ID → “Hay class”, Expiration Date → “expatriation contract date”.","Członkostwo w związku zawodowym (dane szczególne) – DD: zakres PL, bez flagi payroll. Czy Xpertis potrąca składki związkowe?":"Trade union membership (special-category data) – DD: PL scope, no payroll flag. Does Xpertis deduct union dues?","Dane osobowe i płacowe: szyfrowanie w transporcie, krótka retencja plików w middleware, maskowanie PESEL, rachunków i danych szczególnych w logach, dostęp wg najmniejszych uprawnień.":"Personal and payroll data: encryption in transit, short file retention in middleware, masking of PESEL, accounts and special-category data in logs, least-privilege access.","Dane płacowe PL spoza standardu PECI: kod tytułu ubezpieczenia, prawo do emerytury/renty, urząd skarbowy, koszty uzyskania przychodu, oświadczenie PIT-2, PPK.":"PL payroll data outside the PECI standard: insurance title code, pension right, tax office, tax-deductible costs, PIT-2 declaration, PPK.","Daty w próbkach mają format xs:date ze strefą (np. 2025-10-01-07:00) albo dd/mm/rrrr (konwersja w Excelu).":"Dates in samples use xs:date with a zone (e.g. 2025-10-01-07:00) or dd/mm/yyyy (Excel conversion).","Jedna warstwa orkiestracji w middleware (MuleSoft) z kanonicznym modelem „Pracownik PL” i jednym adapterem Xpertis z 22 profilami połączeń; Control-M (MFT) jako transport pliku.":"A single orchestration layer in middleware (MuleSoft) with a canonical “PL Employee” model and one Xpertis adapter with 22 connection profiles; Control-M (MFT) as file transport.","Kodowanie znaków w imporcie Xpertis (UTF-8 czy Windows-1250) i obsługa znaków spoza alfabetu polskiego.":"Character encoding of the Xpertis import (UTF-8 or Windows-1250) and handling of characters outside the Polish alphabet.","Kody składników (Compensation Earnings and Deductions) mapuje zadanie Workday „Maintain External Payroll Earnings”; sekcja nie ma oznaczenia zakresu w słowniku Chorus.":"Component codes (Compensation Earnings and Deductions) are mapped by the Workday task “Maintain External Payroll Earnings”; the section has no scope flag in the Chorus dictionary.","Kolejność kroków przy przeniesieniu: stanowisko i zatrudnienie w bazie B, potem zakończenie w bazie A, na końcu przeniesienie danych historycznych; każdy krok idempotentny.":"Order of steps on transfer: position and employment in database B, then end of employment in database A, finally transfer of historical data; each step idempotent.","Konwersja FTE na ułamek etatu i odwzorowanie Work_Shift na kalendarz / system czasu pracy w Xpertis. Paid_FTE w próbkach = 0.":"Converting FTE into a working-time fraction and mapping Work_Shift to the Xpertis calendar / working-time system. Paid_FTE in samples = 0.","Kto nadaje numer ewidencyjny w Xpertis (per baza) i czy wraca on do middleware (XREF) oraz do Workday (np. jako Custom ID)?":"Who assigns the personnel number in Xpertis (per database) and does it return to middleware (XREF) and to Workday (e.g. as a Custom ID)?","Mapowanie wartości: stabilne 1:1 – integration map w Workday; zależne od bazy Xpertis lub kontekstu – tabele w middleware.":"Value mapping: stable 1:1 – Workday integration map; dependent on the Xpertis database or context – middleware tables.","Niepełnosprawność: DD – Disability Type w zakresie PL i payroll; oznaczone jako dane szczególne wg RODO (kol. M), ale nie w kolumnie lokalnej (kol. N). Data ważności orzeczenia (End Date) jest poza zakresem PECI w Chorus.":"Disability: DD – Disability Type in PL and payroll scope; marked as special-category data under GDPR (col. M) but not in the local column (col. N). The certificate expiry date (End Date) is outside PECI scope in Chorus.","Oddelegowania (International Assignment): pola PECI ze statusem „process TBD”, DD – zakres PL i payroll.":"International Assignment: PECI fields with status “process TBD”, DD – PL and payroll scope.","PECI nie przesyła danych referencyjnych (nowe MPK, lokalizacje, stanowiska, układy, plany).":"PECI does not send reference data (new cost centres, locations, positions, agreements, plans).","PECI traktujemy jako wyzwalacz zdarzenia. Brakujące dane middleware uzupełnia z Workday (API / raport), z Xpertis (baza źródłowa) lub z tabel referencyjnych.":"PECI is treated as an event trigger. Middleware completes missing data from Workday (API / report), from Xpertis (source database) or from reference tables.","Plik „Fields mapping open points.xlsx” jest zaszyfrowany etykietą Microsoft Purview (RMS) i nie został uwzględniony.":"The file “Fields mapping open points.xlsx” is encrypted with a Microsoft Purview (RMS) label and was not included.","Podział wynagrodzenia na kilka rachunków (Distribution_Amount / Percentage) – czy dopuszczamy w PL i czy Xpertis to obsługuje?":"Splitting pay across several accounts (Distribution_Amount / Percentage) – do we allow it in PL and does Xpertis support it?","Przy przeniesieniu (PCO) PECI nie przekazuje trybu zakończenia u dotychczasowego pracodawcy ani podstawy przejścia (art. 23¹ KP, porozumienie trójstronne, rozwiązanie i nowa umowa).":"On transfer (PCO) PECI sends neither the mode of ending employment with the current employer nor the basis of the move (art. 23¹ Labour Code, tripartite agreement, termination and new contract).","Próbki PECI zawierają pole Religion (słownik Chorus: w zakresie), a Data Dictionary wyklucza je dla PL jako dane szczególne.":"PECI samples contain the Religion field (Chorus dictionary: in scope), while the Data Dictionary excludes it for PL as special-category data.","Próbki pochodzą z tenantów testowych innych krajów (AR, TH, CH, DE i in.). Brak próbki End Additional Job (scenariusz 17).":"Samples come from test tenants of other countries (AR, TH, CH, DE and others). No sample for End Additional Job (scenario 17).","Płatności jednorazowe: sekcja dostępna w PECI, w DD poza zakresem PL.":"One-time payments: section available in PECI, outside PL scope in the DD.","Rozbieżne definicje: słownik PECI – Hire_Date to data zatrudnienia w spółce; Data Dictionary (1.1.4) – pierwsza data zatrudnienia w Grupie.":"Conflicting definitions: PECI dictionary – Hire_Date is the hire date in the company; Data Dictionary (1.1.4) – first hire date in the Group.","Sekcja Education jest w PECI; DD oznacza ją jako zakres PL i payroll. Czy Xpertis potrzebuje wykształcenia do stażu urlopowego?":"The Education section is in PECI; the DD marks it as PL and payroll scope. Does Xpertis need education for holiday seniority?","Sekcja Time Off jest poza zakresem PECI; w zakresie jest tylko Leave of Absence. Które nieobecności długotrwałe prowadzimy w Workday dla PL i jak mapują się na typy w Xpertis?":"The Time Off section is outside PECI scope; only Leave of Absence is in scope. Which long-term leaves do we keep in Workday for PL and how do they map to Xpertis types?","Stan cywilny: DD – zakres PL, Ściśle poufne, bez flagi payroll; DTM: „nie raportujemy (wymóg prawny)”.":"Marital status: DD – PL scope, Strictly confidential, no payroll flag; DTM: “not reported (legal requirement)”.","Staż u poprzednich pracodawców (External Job History; DD: zakres PL i payroll) nie jest przesyłany w PECI.":"Service with previous employers (External Job History; DD: PL and payroll scope) is not sent in PECI.","W próbce PCI sekcja Employee_Contract ma datę początku sprzed przeniesienia (umowa kontynuowana).":"In the PCI sample the Employee_Contract section has a start date before the transfer (contract continued).","W próbkach część wartości to techniczne identyfikatory Workday (np. EMPLOYEE_CONTRACT_TYPE-6-72, TERMINATION_CATEGORY-6-5), a te same pola mają raz kody, raz nazwy (np. „Mutual Consent”).":"In samples some values are Workday technical identifiers (e.g. EMPLOYEE_CONTRACT_TYPE-6-72, TERMINATION_CATEGORY-6-5), and the same fields carry sometimes codes, sometimes names (e.g. “Mutual Consent”).","Zgłoszenie członków rodziny do ubezpieczenia zdrowotnego wymaga m.in. PESEL członka rodziny i stopnia pokrewieństwa. DD: dane rodziny poza zakresem PL (poza kontaktami awaryjnymi).":"Registering family members for health insurance requires, among others, the family member's PESEL and degree of kinship. DD: family data outside PL scope (except emergency contacts).","Integrator (middleware)":"Integrator (middleware)","SG – IOD":"SG – DPO","SG – IT":"SG – IT","SG – Kadry":"SG – HR","SG – Płace":"SG – Payroll","Zespół Chorus (globalny)":"Chorus team (global)","Średni":"Medium","Dane wynikające z dokumentów pracownika prowadzić w Xpertis (dział płac); w Workday tylko dane z procesu HR. Decyzja per pole w P01.":"Data derived from employee documents to be kept in Xpertis (payroll team); Workday holds only HR-process data. Decision per field in P01.","Dla PL wymagać stabilnych Reference ID lub integration map dla każdego pola kodowego.":"For PL require stable Reference IDs or an integration map for every code field.","Do zatwierdzenia (T16).":"To be approved (T16).","Do zatwierdzenia (T25).":"To be approved (T25).","Do zatwierdzenia na pierwszym warsztacie.":"To be approved at the first workshop.","Do zatwierdzenia z IOD.":"To be approved with the DPO.","Do zatwierdzenia.":"To be approved.","Identyfikacja po WID/PESEL w XREF; nowe zatrudnienie w istniejącej kartotece.":"Identification by WID/PESEL in XREF; new employment in the existing record.","Jeden rachun
