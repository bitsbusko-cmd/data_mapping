"Each database","PCO → baza A, PCI → baza B":"PCO → database A, PCI → database B","Pracodawca z Payroll_Company / Organization (Company)":"Employer from Payroll_Company / Organization (Company)","Ta sama baza":"Same database","Wg spółki płacowej (słownik S01)":"By payroll company (dictionary S01)","Wszystkie bazy z aktywnym zatrudnieniem":"All databases with active employment","Wszystkie bazy, w których osoba ma aktywne zatrudnienie":"All databases in which the person has active employment","Brak":"None","Brak próbki":"No sample","Scenariusz 1 (umowa na czas nieokreślony); 12 (umowa terminowa)":"Scenario 1 (open-ended contract); 12 (fixed-term contract)","Scenariusz 10":"Scenario 10","Scenariusz 12":"Scenario 12","Scenariusz 16; brak próbki zakończenia (scenariusz 17 pusty)":"Scenario 16; no end sample (scenario 17 empty)","Scenariusz 18":"Scenario 18","Scenariusz 19":"Scenario 19","Scenariusz 2":"Scenario 2","Scenariusz 24":"Scenario 24","Scenariusz 25":"Scenario 25","Scenariusz 26 (data końca); brak próbki zmiany rodzaju umowy":"Scenario 26 (end date); no sample of contract type change","Scenariusz 3":"Scenario 3","Scenariusz 31":"Scenario 31","Scenariusz 32":"Scenario 32","Scenariusz 6":"Scenario 6","Scenariusz 7":"Scenario 7","Scenariusz 8":"Scenario 8","Scenariusz 9":"Scenario 9","Scenariusze 11, 21":"Scenarios 11, 21","Scenariusze 13, 14, 15":"Scenarios 13, 14, 15","Scenariusze 20, 29, 30":"Scenarios 20, 29, 30","Scenariusze 23, 5":"Scenarios 23, 5","Scenariusze 27, 28":"Scenarios 27, 28","Scenariusze 4, 22":"Scenarios 4, 22","Sekcja widoczna w scenariuszu 1":"Section visible in scenario 1","Wszystkie scenariusze":"All scenarios","Jak PCO/PCI":"As PCO/PCI","PCI: pełny zestaw jak P01; PCO: Position, Compensation, Compensation_Plans z datami końca":"PCI: full set as P01; PCO: Position, Compensation, Compensation_Plans with end dates","Personal (Legal_Name z wartością poprzednią)":"Personal (Legal_Name with prior value)","Position (nowa + zakończenie starej), Compensation, Compensation_Plans, Employee_Contract, Collective_Agreement, Costing_Allocation":"Position (new + end of the old one), Compensation, Compensation_Plans, Employee_Contract, Collective_Agreement, Costing_Allocation","Position (pola International_Assignment)":"Position (International_Assignment fields)","Position (pozycja dodatkowa), Compensation, Compensation_Plans, Costing_Allocation":"Position (additional position), Compensation, Compensation_Plans, Costing_Allocation","Position (wartości poprzednie), Compensation, Compensation_Plans":"Position (prior values), Compensation, Compensation_Plans","Summary, Worker_Summary, Effective_Change, Transaction_Log, atrybuty XML":"Summary, Worker_Summary, Effective_Change, Transaction_Log, XML attributes","Worker_Status (wartości poprzednie), Position, Compensation_Plans, Employee_Contract, Costing_Allocation, Transaction_Log":"Worker_Status (prior values), Position, Compensation_Plans, Employee_Contract, Costing_Allocation, Transaction_Log","Worker_Status (wartości usunięte i dodane), Position, Compensation":"Worker_Status (removed and added values), Position, Compensation","Aktualizacja PESEL lub dokumentu tożsamości (paszport dla osób bez PESEL).":"Update of PESEL or identity document (passport for persons without PESEL).","Aktualizacja adresu (z datą od), telefonu i e-maila.":"Update of address (with from-date), phone and e-mail.","Aktualizacja danych osobowych z datą zmiany; zgłoszenie zmiany danych do ZUS po stronie Xpertis.":"Update of personal data with the change date; reporting the data change to ZUS on the Xpertis side.","Aktualizacja nazwiska rodowego, jeśli Xpertis je prowadzi.":"Update of the maiden name, if Xpertis maintains it.","Aktualizacja rachunku do wypłaty (z datą od).":"Update of the payment account (with from-date).","Anulowanie przyjęcia; weryfikacja zgłoszeń ZUS i list płac.":"Hire cancellation; review of ZUS registrations and payrolls.","Brak – dane nie są potrzebne w płacach (do potwierdzenia).":"None – data not needed in payroll (to be confirmed).","Dane członków rodziny do zgłoszenia do ubezpieczenia zdrowotnego – jeśli w zakresie.":"Family member data for health insurance registration – if in scope.","Do ustalenia – jeśli Xpertis rozlicza umowy cywilnoprawne tych osób.":"To be determined – if Xpertis settles civil-law contracts of these persons.","Do ustalenia – w Chorus proces oznaczony jako „process TBD”.":"To be determined – in Chorus the process is marked as “process TBD”.","Dodatkowa umowa u tego samego pracodawcy (jeśli dopuszczalna) i jej zakończenie.":"Additional contract with the same employer (if allowed) and its end.","Nowa umowa o pracę lub aneks zmieniający datę końca umowy.":"New employment contract or amendment changing the contract end date.","Nowe zatrudnienie w istniejącej kartotece (ta sama baza) albo nowa kartoteka (inna baza).":"New employment in the existing record (same database) or a new record (different database).","Potrącanie składki związkowej – jeśli stosowane.":"Deduction of union dues – if applied.","Poziom wykształcenia do stażu urlopowego – jeśli Xpertis go wymaga.":"Education level for holiday seniority – if Xpertis requires it.","Przeniesienie na inną listę płac / grupę w tej samej bazie.":"Transfer to another payroll list / group in the same database.","Rejestracja nieobecności (rodzaj, od, przewidywane do) ze skutkami płacowymi i ubezpieczeniowymi.":"Absence registration (type, from, expected to) with payroll and insurance effects.","Rozwiązanie stosunku pracy (data, tryb, podstawa prawna), zamknięcie umowy i składników; dane do świadectwa pracy i wyrejestrowania z ZUS.":"Termination of employment (date, mode, legal basis), closing the contract and components; data for the employment certificate and ZUS deregistration.","Składnik jednorazowy na liście płac.":"One-time component on the payroll.","Stopień niepełnosprawności i okres orzeczenia (kod do ZUS, wymiar urlopu i czasu pracy, PFRON).":"Disability degree and certificate period (ZUS code, holiday and working-time entitlement, PFRON).","Utrzymanie słowników w każdej z 22 baz przed użyciem kodu w danych pracownika.":"Maintaining dictionaries in each of the 22 databases before a code is used in employee data.","Utworzenie kartoteki pracownika w bazie pracodawcy: dane osobowe, umowa o pracę, stanowisko i czas pracy, składniki płacowe, rachunek, podział kosztów; dane do zgłoszenia ZUS.":"Creating the employee record in the employer's database: personal data, employment contract, position and working time, pay components, account, cost allocation; data for the ZUS registration.","Wybór bazy pracodawcy i kartoteki; wybór rodzaju operacji kadrowej; kontrola kompletności pliku.":"Selecting the employer database and the employee record; selecting the HR operation type; file completeness check.","Zakończenie zatrudnienia w bazie A (D–1) i zatrudnienie w bazie B (od D) z przeniesieniem danych historycznych.":"End of employment in database A (D–1) and employment in database B (from D) with transfer of historical data.","Zamknięcie, korekta lub anulowanie nieobecności.":"Closing, correcting or cancelling an absence.","Zmiana MPK i podziału kosztów z datą od.":"Change of cost centre and cost allocation with a from-date.","Zmiana daty przyjęcia i dat zależnych (umowa, składniki, MPK); korekta zgłoszenia ZUS, jeśli zostało wysłane.":"Change of hire date and dependent dates (contract, components, cost centre); correction of the ZUS registration if already sent.","Zmiana daty rozwiązania lub przywrócenie zatrudnienia.":"Change of termination date or reinstatement of employment.","Zmiana nazwy stanowiska, wymiaru etatu, systemu czasu pracy i wynagrodzenia z datą od.":"Change of position title, FTE, working-time system and pay with a from-date.","Zmiana składników stałych z datą od.":"Change of fixed components with a from-date.","Zmiana stanowiska (porozumienie / wypowiedzenie zmieniające), MPK, lokalizacji i wynagrodzenia z datą od; zamknięcie poprzedniej pozycji.":"Change of position (agreement / notice of change of terms), cost centre, location and pay with a from-date; closing the previous position.","1 = prawda, 0 = fałsz. Brak elementu nie oznacza fałszu – oznacza brak zmiany lub brak danych (np. Primary_Job nie występuje dla pozycji dodatkowej).":"1 = true, 0 = false. A missing element does not mean false – it means no change or no data (e.g. Primary_Job is absent for an additional position).","11 cyfr, poprawna cyfra kontrolna, zgodność daty urodzenia i płci z danymi z sekcji Personal. Osoba bez PESEL wymaga dokumentu tożsamości (paszport).":"11 digits, valid check digit, date of birth and gender consistent with the Personal section. A person without PESEL requires an identity document (passport).","Allocation_Percentage jest ułamkiem (1 = 100%). Suma udziałów dla pracownika = 100%. Worktag_Code (MPK) tłumaczony wg słownika S14.":"Allocation_Percentage is a fraction (1 = 100%). Sum of shares per employee = 100%. Worktag_Code (cost centre) translated via dictionary S14.","Anulowanie (-R) cofa skutki wcześniejszej operacji w Xpertis, a nie tworzy nowej. Para -R + kod podstawowy w jednym pliku oznacza zmianę daty – przetwarzana jako korekta. Jeśli operacja dotyczy zamkniętej listy płac – zadanie dla płac.":"A rescission (-R) reverses the effects of the earlier operation in Xpertis rather than creating a new one. A -R + base code pair in one file means a date change – processed as a correction. If the operation affects a closed payroll – task for payroll.","DTA oznacza „inne zmiany danych”. Operację w Xpertis wybiera się na podstawie zmienionych sekcji (atrybuty isUpdated/isAdded) i Transaction_Type (np. Change Job, Change Legal Name, Maintain Employee Contracts).":"DTA means “other data changes”. The Xpertis operation is chosen from the changed sections (isUpdated/isAdded attributes) and Transaction_Type (e.g. Change Job, Change Legal Name, Maintain Employee Contracts).","Effective_Moment wyznacza datę skuteczności operacji w Xpertis – używamy części daty bez konwersji strefy. Entry_Moment służy do audytu i wykrywania zmian wstecznych; w logach zapisujemy go w czasie Europe/Warsaw.":"Effective_Moment sets the operation effective date in Xpertis – we use the date part without zone conversion. Entry_Moment is used for audit and detecting retroactive changes; in logs we record it in Europe/Warsaw time.","Jedna saga: stanowisko i zatrudnienie w bazie B od D, następnie zakończenie w bazie A z datą D–1, na końcu przeniesienie danych historycznych (np. saldo urlopu). Tryb przejścia (art. 23¹ KP / porozumienie / nowa umowa) steruje dokumentami – źródło do ustalenia (K-03).":"One saga: position and employment in database B from D, then end of employment in database A dated D–1, finally transfer of historical data (e.g. holiday balance). The transfer mode (art. 23¹ Labour Code / agreement / new contract) drives the documents – source to be determined (K-03).","Każda data trafia do jednego, uzgodnionego pola Xpertis. Semantyka do ustalenia (K-06): PECI – Hire_Date to data w spółce, Data Dictionary – data w Grupie.":"Each date goes to one agreed Xpertis field. Semantics to be determined (K-06): PECI – Hire_Date is the date in the company; Data Dictionary – the date in the Group.","Każde pole kodowe tłumaczone wg słownika. Stabilne mapowania 1:1 mogą być realizowane w Workday (integration map, kolumna „Mapowanie wartości w Workday”); mapowania zależne od bazy Xpertis lub kontekstu – w tabelach middleware. Bez wartości domyślnych.":"Each code field is translated via a dictionary. Stable 1:1 mappings can be done in Workday (integration map, column “Value mapping in Workday”); mappings dependent on the Xpertis database or context – in middleware tables. No default values.","Kod spółki płacowej (i grupy płacowej) wskazuje jedną z 22 baz Xpertis i kod pracodawcy. PCO trafia do bazy dotychczasowego pracodawcy, PCI – do bazy nowego.":"The payroll company code (and pay group) points to one of the 22 Xpertis databases and the employer code. PCO goes to the database of the current employer, PCI – to the database of the new one.","Leave_of_Absence_Type → rodzaj nieobecności Xpertis (słownik S27). Daty: Leave_Start_Date, Estimated_Leave_End_Date (planowana), Leave_End_Date (faktyczna, przy powrocie).":"Leave_of_Absence_Type → Xpertis absence type (dictionary S27). Dates: Leave_Start_Date, Estimated_Leave_End_Date (planned), Leave_End_Date (actual, on return).","Liczba przetworzonych pracowników = Worker_Count. Full_Snapshot = 1 uruchamia tryb rekoncyliacji (porównanie stanu), nie operacje kadrowe.":"Number of processed employees = Worker_Count. Full_Snapshot = 1 triggers reconciliation mode (state comparison), not HR operations.","Liczby z kropką dziesiętną, zaokrąglenie do 2 miejsc. Źródłem stawki jest plan (Compensation_Plans), nie podsumowanie Total_Base_Pay. Apply_FTE = 1 oznacza kwotę dla pełnego etatu. Waluta PLN; inna waluta → wyjątek.":"Numbers with a decimal point, rounded to 2 places. The source of the rate is the plan (Compensation_Plans), not the Total_Base_Pay summary. Apply_FTE = 1 means the full-time amount. Currency PLN; other currency → exception.","Linie adresu Workday rozdzielane na pola Xpertis (ulica, nr domu, nr lokalu) wg konfiguracji adresu PL. Kod pocztowy w formacie NN-NNN. Województwo, powiat i gmina – z pól Workday, jeśli skonfigurowane; w przeciwnym razie z rejestru TERYT po kodzie pocztowym i miejscowości.":"Workday address lines split into Xpertis fields (street, house no., flat no.) per the PL address configuration. Postal code in NN-NNN format. Province, county and municipality – from Workday fields if configured; otherwise from the TERYT register by postal code and city.","PECI jest w UTF-8. Zachowujemy polskie znaki; przy imporcie w innym kodowaniu (np. Windows-1250) znaki spoza zestawu są zgłaszane, nie usuwane po cichu. Usuwamy wiodące i końcowe spacje; nie zmieniamy wielkości liter.":"PECI is in UTF-8. We keep Polish characters; on import in another encoding (e.g. Windows-1250) characters outside the set are reported, not silently removed. We trim leading and trailing spaces; we do not change letter case.","PECI przesyła daty jako xs:date z przesunięciem strefy czasowej tenanta (RRRR-MM-DD±hh:mm). Middleware bierze część daty bez przeliczania strefy i zapisuje w formacie Xpertis.":"PECI sends dates as xs:date with the tenant time-zone offset (YYYY-MM-DD±hh:mm). Middleware takes the date part without zone conversion and writes it in the Xpertis format.","Pola spoza zakresu PL nie są przekazywane do Xpertis (lista dozwolonych pól). Dane szczególne nie trafiają do logów; w logach maskujemy też PESEL i numery rachunków.":"Fields outside PL scope are not passed to Xpertis (allow-list of fields). Special-category data does not go to logs; in logs we also mask PESEL and account numbers.","Pozycja bez elementu Primary_Job jest pozycją dodatkową. Każda pozycja (Position_ID) ma własny rekord zatrudnienia/umowy w Xpertis – jeśli Xpertis to obsługuje (K-29 dotyczy ponownego zatrudnienia; tu decyzja w P18).":"A position without the Primary_Job element is an additional position. Each position (Position_ID) has its own employment/contract record in Xpertis – if Xpertis supports it (K-29 concerns rehire; here the decision is in P18).","Przed zapisem w Xpertis middleware sprawdza komplet pól wymaganych dla danej operacji. Brak → brak zapisu i zadanie w kolejce wyjątków dla właściciela danych. Zero częściowych zapisów.":"Before writing to Xpertis, middleware checks the complete set of fields required for the operation. Missing → no write and a task in the exception queue for the data owner. Zero partial writes.","Rodzaj umowy Xpertis (okres próbny / czas określony / czas nieokreślony) wyznaczany z Contract_Type, a kontrolnie z Worker_Type i daty końca. Kolejna umowa = nowy rekord umowy w Xpertis.":"Xpertis contract type (probation / fixed-term / open-ended) determined from Contract_Type, cross-checked with Worker_Type and the end date. Subsequent contract = new contract record in Xpertis.","Telefon z Phone_Number_With_Country_Code normalizowany do formatu +48 NNN NNN NNN. E-mail: Usage_Type WORK = służbowy, HOME = prywatny (DTM: domena @sg.com = służbowy).":"Phone from Phone_Number_With_Country_Code normalised to +48 NNN NNN NNN. E-mail: Usage_Type WORK = business, HOME = private (DTM: domain @sg.com = business).","Termination_Date = ostatni dzień zatrudnienia (do potwierdzenia). Tryb rozwiązania i podstawa prawna (art. KP) oraz strona inicjująca wynikają z kombinacji przyczyny głównej i lokalnej wg słownika S26.":"Termination_Date = last day of employment (to be confirmed). Termination mode and legal basis (Labour Code article) and the initiating party result from the combination of primary and local reason per dictionary S26.","WID jest stałym kluczem osoby. Middleware prowadzi rejestr: WID / Employee_ID ↔ numer ewidencyjny w każdej bazie Xpertis (jedna osoba może mieć kartoteki w kilku bazach). Numer nadaje Xpertis i zwraca w potwierdzeniu.":"WID is the permanent person key. Middleware keeps a registry: WID / Employee_ID ↔ personnel number in each Xpertis database (one person may have records in several databases). Xpertis assigns the number and returns it in the confirmation.","Walidacja IBAN PL (28 znaków, suma kontrolna) albo NRB (26 cyfr). Zapis w formacie wymaganym przez Xpertis. Podział wynagrodzenia na kilka rachunków tylko po decyzji (K-31).":"Validation of PL IBAN (28 characters, checksum) or NRB (26 digits). Stored in the format required by Xpertis. Splitting pay across several accounts only after a decision (K-31).","Wymiar z Full_Time_Equivalent_Percentage (ułamek dziesiętny) przeliczany na ułamek zwykły Xpertis wg tabeli dozwolonych wymiarów. Kontrola: Scheduled / Default = FTE. Paid_FTE i Working_FTE nie są źródłem (w próbkach = 0).":"FTE from Full_Time_Equivalent_Percentage (decimal fraction) converted into the Xpertis common fraction per the table of allowed fractions. Check: Scheduled / Default = FTE. Paid_FTE and Working_FTE are not a source (= 0 in samples).","Zmiana elementu powtarzalnego (adres, organizacja, plan) przychodzi jako isDeleted dla starego i isAdded dla nowego – middleware zamyka stary zapis w Xpertis (data skuteczności – 1) i otwiera nowy. Pola z wartością poprzednią pozwalają zbudować historię.":"A change of a repeating element (address, organisation, plan) arrives as isDeleted for the old one and isAdded for the new one – middleware closes the old record in Xpertis (effective date – 1) and opens a new one. Fields with prior values allow building history.","Zmiany jednego pracownika przetwarzane ściśle w kolejności Sequence; różni pracownicy równolegle. Klucz idempotencji: WID + Derived_Event_Code + Effective_Moment + Sequence. Ponowne przetworzenie pliku nie tworzy duplikatów.":"Changes of one employee processed strictly in Sequence order; different employees in parallel. Idempotency key: WID + Derived_Event_Code + Effective_Moment + Sequence. Reprocessing a file does not create duplicates.","Brak Effective_Moment → odrzucenie zdarzenia.":"Missing Effective_Moment → event rejected.","Brak mapowania przyczyny → kolejka wyjątków dla kadr.":"No reason mapping → exception queue for HR.","Brak obsługi w Xpertis → wyjątek.":"Not supported in Xpertis → exception.","Brak operacji do cofnięcia → kolejka wyjątków.":"No operation to reverse → exception queue.","Brak wpisu w XREF przy zdarzeniu innym niż HIR/PCI → kolejka wyjątków.":"No XREF entry for an event other than HIR/PCI → exception queue.","Brak wymaganej daty → kolejka wyjątków.":"Missing required date → exception queue.","Błąd kroku → zatrzymanie kolejnych zmian tego pracownika.":"Step error → subsequent changes of this employee are held.","Błąd w B → brak zmian w A; błąd w A po sukcesie w B → kompensacja i wyjątek.":"Error in B → no changes in A; error in A after success in B → compensation and exception.","Element function filtered(pid) {
  const q = lc(S.q.trim());
  return (C.byProc[pid] || []).filter(e => {
    if (q && ![e.code, e.el, e.sec, e.xf, e.desc, e.area, e.tgtFmt, e.xo, e.src].some(v => sx(v).includes(q))) return false;
    if (S.wait) { const k = S.wait; if (!targets(e) || (e.conf[k] && e.conf[k].at)) return false; }
    switch (S.show) {
      case 'open': return e.st !== 'Potwierdzone' && e.st !== 'Poza zakresem';
      case 'dec': return e.st === 'Wymaga decyzji';
      case 'prob': return e.nE + e.nW > 0;
      case 'gap': return isGap(e);
      case 'added': return e.isAdd;
      default: return true;
    }
  });
}
function grouped(list) { const order = [], m = {}; list.forEach(e => { const a = e.area || 'Inne'; if (!m[a]) { m[a] = []; order.push(a); } m[a].push(e); }); return order.map(a => [a, m[a]]); }
function specList(pid) { return (C.byProc[pid] || []).filter(e => e.sp && (!S.xvF || (S.xvF === 'todo' ? !e.xv : e.xv === S.xvF))); }
function specGrouped(list) { const order = [], m = {}; list.forEach(e => { const k = e.sp.path.join(' › '); if (!m[k]) { m[k] = []; order.push(k); } m[k].push(e); }); return order.map(k => [k, m[k]]); }
function visibleList() {
  if (S.tab === 'spec') return specGrouped(specList(S.proc)).flatMap(g => g[1]);
  if (S.tab === 'paczka') return grouped((C.byProc[S.proc] || []).filter(e => e.cov && (!S.pkgF || e.cov === S.pkgF))).flatMap(g => g[1]);
  if (S.tab === 'kontrola') return (C.byProc[S.proc] || []).filter(e => e.nE + e.nW > 0);
  return grouped(filtered(S.proc)).flatMap(g => g[1]);
}

function protocol(p, stampIt) {
  const s = C.ps[p.id], pm = S.ov.procs[p.id] || {}, items = C.byProc[p.id] || [];
  const out = [];
  out.push(T('PROTOKÓŁ WARSZTATU – {id} {name}', {id:p.id, name:T(p.name)}));
  out.push(T('Data warsztatu: {d}', {d:fmtDate(pm.date) || '—'}) + (pm.people ? T(' · Uczestnicy: {p}', {p:pm.people}) : ''));
  if (pm.test) out.push(T('Plik testowy PECI: {f}', {f:pm.test}));
  out.push(T('Stan: {a} z {b} pól potwierdzonych; wymaga decyzji: {dec}; {err}; bez źródła: {nos}; dopisane dane: {adds}.', {a:s.conf, b:s.active, dec:s.dec, err:pl(s.e, W.err), nos:s.cov.nosrc, adds:s.adds}));
  if (!blank(pm.notes)) out.push('', T('USTALENIA PROCESU'), pm.notes);
  const decs = items.filter(e => !blank(e.dec));
  if (decs.length) { out.push('', T('USTALENIA W POLACH')); decs.forEach(e => out.push(`- ${e.code} ${label(e)}: ${T(e.dec)}`)); }
  const fm = items.filter(e => e.st === 'Potwierdzone' && !blank(e.tgtFmt));
  if (fm.length) { out.push('', T('UZGODNIONE FORMATY DOCELOWE')); fm.forEach(e => out.push(`- ${e.code} ${label(e)}: ${T(e.tgtFmt)}`)); }
  const dec = items.filter(e => e.st === 'Wymaga decyzji');
  if (dec.length) { out.push('', T('WYMAGA DECYZJI')); dec.forEach(e => out.push(`- ${e.code} ${label(e)}${e.iss ? ' (' + e.iss + ')' : ''}${e.own ? T(' – właściciel: {o}', {o:T(e.own)}) : ''}${e.due ? T(', termin: {d}', {d:fmtDate(e.due)}) : ''}`)); }
  const nos = items.filter(e => e.cov === 'nosrc');
  if (nos.length) { out.push('', T('DANE BEZ ŹRÓDŁA')); nos.forEach(e => out.push(`- ${e.code} ${T(e.xf || '')}${e.xr === 'Tak' ? T(' (wymagane w Xpertis)') : ''}`)); }
  const adds = items.filter(e => e.isAdd);
  if (adds.length) { out.push('', T('DOPISANE DANE')); adds.forEach(e => out.push(`- ${e.code} ${T(e.xf)}: ${blank(e.el) ? (hasSrc(e) ? T('źródło:') + ' ' + T(e.src) + (e.srcNote ? ' – ' + e.srcNote : '') : T('źródło do ustalenia')) : 'PECI: ' + e.el}`)); }
  const iss = procIssues(p.id).filter(i => i.status !== 'Zamknięta');
  if (iss.length) { out.push('', T('OTWARTE KWESTIE')); iss.forEach(i => out.push(`- ${i.id} [${i.prio ? T(i.prio) : '—'}] ${T(i.desc)}${i.owner ? T(' – właściciel: {o}', {o:T(i.owner)}) : ''}${isoDate(i.due) ? T(', termin: {d}', {d:fmtDate(i.due)}) : ''}`)); }
  if (s.spec) {
    out.push('', T('SPECYFIKACJA PECI – OCENA XPERTIS'), T('Zgodne: {a} z {b}; pytania: {q}; do oceny: {t}.', {a:s.xvOk, b:s.spec, q:s.xvQ, t:s.spec - s.xvOk - s.xvQ}));
    items.filter(e => e.xv === 'q').forEach(e => out.push(`- ${e.code} ${label(e)}: ${blank(e.xvNote) ? T('bez opisu') : e.xvNote}`));
  }
  out.push('', T('AKCEPTACJE'));
  PARTIES.forEach(pt => { const sg = s.sign[pt.k]; out.push(`- ${pt.n}: ${sg && sg.at ? who(sg.by, sg.nm) + ', ' + fmtTs(sg.at) + ((sg.e || sg.nosrc) ? T(' (z zastrzeżeniem)') : '') : T('brak')}`); });
  if (stampIt) out.push('', T('Wygenerowano: {t}', {t:fmtTs(nowIso())}));
  return out.join('\n');
}

function renderDetail() {

  let html, open = true, key;
  if (S.adding && S.adding.p === S.proc) { html = addFormHtml(); key = 'add'; }
  else {
    const e = S.sel && C.byKey[S.sel];
    if (!e || e.p !== S.proc) { html = placeholderHtml(); open = false; key = 'none'; }

  det.classList.toggle('closed', !open);

/* ---------- przegląd ---------- */
function actionsList() {
  const out = [];
  C.all.forEach(e => { if (!blank(e.own) && e.st !== 'Potwierdzone' && e.st !== 'Poza zakresem') out.push({owner:e.own, due:isoDate(e.due), kind:'Pole', id:e.code, what:blank(e.dec) ? label(e) : e.dec, st:e.st, key:e.key}); });
  issuesAll().forEach(i => { if (!blank(i.owner) && i.status !== 'Zamknięta') out.push({owner:i.owner, due:isoDate(i.due), kind:'Kwestia', id:i.id, what:i.desc, st:i.status, issue:i.id}); });
  return out;
}

      h += `<tr class="click" data-act="proc" data-p="${p.id}"><td><span class="mono">${p.id}</span> ${esc(T(p.name))}</td><td style="white-space:nowrap"><span class="minibar">${bars(s, s.active || 1)}</span><span class="num">${Math.round(100 * s.pct)}% · ${s.conf}/${s.active}</span></td><td class="n" style="white-space:nowrap">${s.spec ? `${s.xvOk}/${s.spec}${s.xvQ ? ` <span class="chip c-warn">?${s.xvQ}</span>` : ''}` : ''}</td><td class="n">${s.dec || ''}</td><td class="n" style="color:var(--err)">${s.e || ''}</td><td class="n" style="color:var(--err)">${s.cov.nosrc || ''}</td><td class="n">${s.adds || ''}</td><td class="n">${s.cm || ''}</td><td style="white-space:nowrap">${acc}</td><td>${chip(s.status, PST_CLS[s.status])}</td></tr>`;

function issueCard(i) {

  const ro = dis();
  const d = k => `id="i-${k}-${esc(i.id)}" data-ik="${k}" data-iid="${esc(i.id)}"`;
  let h = `<article class="icard${S.issueFocus === i.id ? ' focus' : ''}" id="issue-${esc(i.id)}"><div class="h"><span class="id">${esc(i.id)}</span>${chip(i.type, i.type === 'Ryzyko' ? 'c-err' : i.type === 'Decyzja' ? 'c-mw' : 'c-neutral')}${chip(i.prio, PRIO_CLS[i.prio] || 'c-neutral')}${stChipIssue(i)}<span class="muted">${esc(T(i.proc || ''))}${i.area ? ' · ' + esc(T(i.area)) : ''}</span></div>`;
  if (isNew) h += `<div class="g2">${fld('i-desc-' + i.id, 'Opis', `<textarea ${d('desc')} rows="2"${ro}>${esc(i.desc || '')}</textarea>`)}${fld('i-proc-' + i.id, 'Proces', `<input ${d('proc')} value="${esc(i.proc || '')}" placeholder="${esc(T('np. P01'))}"${ro}>`)}</div>`;

  h += `<div class="g3">${fld('i-status-' + i.id, 'Status', selHtml('i-status-' + i.id, `data-ik="status" data-iid="${esc(i.id)}"`, L.lst_istatus, i.status))}${fld('i-prio-' + i.id, 'Priorytet', selHtml('i-prio-' + i.id, `data-ik="prio" data-iid="${esc(i.id)}"`, L.lst_prio, i.prio))}${fld('i-owner-' + i.id, 'Właściciel', selHtml('i-owner-' + i.id, `data-ik="owner" data-iid="${esc(i.id)}"`, L.lst_owner, i.owner, '—'))}${fld('i-due-' + i.id, 'Termin', `<input type="date" ${d('due')} value="${esc(isoDate(i.due))}"${ro}>`)}</div>`;
  h += fld('i-decision-' + i.id, 'Rozwiązanie / decyzja', `<textarea class="short" ${d('decision')} rows="1" placeholder="${esc(T('Co postanowiono i kto zatwierdził'))}"${ro}>${esc(i.decision || '')}</textarea>`);
  const meta = [i.opened ? T('Zgłoszono {d}', {d:i.opened}) : '', i.src ? T('Źródło: {s}', {s:T(i.src)}) : '', i.upd && i.upd.at ? T('Zmiana: {w}, {t}', {w:who(i.upd.by, i.upd.nm), t:fmtTs(i.upd.at)}) : ''].filter(Boolean).join(' · ');

  if (meta) h += `<p class="muted" style="font-size:.821rem">${esc(meta)}</p>`;
  return h + '</article>';
}
function issuesView() {

  const nOpen = all.filter(i => i.status !== 'Zamknięta').length;
  return `<div class="view"><div class="vhead"><h1>${esc(T('Kwestie i decyzje'))}</h1><p>${esc(T('Wspólny rejestr pytań, ryzyk i decyzji. Kwestie zgłoszone z karty pola są z nim powiązane.'))}</p></div>
  <div class="tools" style="padding:0;border:0"><div class="r1"><div class="sbox">${ic('search')}<input type="search" id="iq" value="${esc(S.iq)}" placeholder="${esc(T('Szukaj w kwestiach'))}" aria-label="${esc(T('Szukaj w kwestiach'))}"></div>

function renderModal() {

  if (!S.modal) { if (!m.hidden) { m.hidden = true; m.innerHTML = ''; m._html = null; m._open = null; } return; }
  m.hidden = false;
  const html = S.modal === 'help' ? helpHtml() : S.modal === 'welcome' ? welcomeHtml() : S.modal === 'ptypes' ? ptypesHtml() : paletteHtml();
  const opened = m._open !== S.modal; m._open = S.modal;
  renderInto(m, html);
  if (opened) requestAnimationFrame(() => { const t = m.querySelector('#pal-q, #wl-name, #wl-team, .modal button'); if (t) t.focus(); });
  if (S.modal === 'search') { const it = m.querySelector('.pal-it[aria-selected="true"]'); if (it) it.scrollIntoView({block:'nearest'}); }
}

function palResults(q) {
  q = lc(q.trim());
  if (!q) return PROC.map(p => ({g:T('Procesy'), k:p.id, l:esc(T(p.name)), s:T(p.grp), go:{t:'proc', id:p.id}}));
  const out = [];
  const score = vals => { let best = 0; vals.forEach((v, i) => { const s = lc(v); if (!s) return; if (s === q) best = Math.max(best, 100 - i); else if (s.indexOf(q) === 0) best = Math.max(best, 80 - i); else if (s.includes(q)) best = Math.max(best, 50 - i); }); return best; };
  C.all.map(e => ({e, sc:score([e.code, e.el, T(e.xf), T(e.tgtFmt), e.sec, T(e.desc)].concat(LANG === 'en' ? [e.xf, e.desc] : []))})).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 14)
    .forEach(({e}) => out.push({g:T('Pola'), k:e.code, l:hlq(blank(e.el) ? T('Brak w PECI') : e.el, q) + ' <span class="faint">→</span> ' + hlq(T(e.xf || '—'), q), s:(PBY[e.p] ? T(PBY[e.p].name) : '') + (e.area ? ' · ' + T(e.area) : ''), go:{t:'field', key:e.key}}));
  PROC.filter(p => [p.id, p.name, p.bp, p.events].some(v => sx(v).includes(q))).slice(0, 6).forEach(p => out.push({g:T('Procesy'), k:p.id, l:hlq(T(p.name), q), s:T(p.grp), go:{t:'proc', id:p.id}}));
  issuesAll().filter(i => [i.id, i.desc, i.area].some(v => sx(v).includes(q))).slice(0, 6).forEach(i => out.push({g:T('Kwestie'), k:i.id, l:hlq(String(T(i.desc) || '').slice(0, 150), q), s:(i.status ? T(i.status) : '') + (i.proc ? ' · ' + T(i.proc) : ''), go:{t:'issue', id:i.id}}));
  DICTS.filter(d => [d.id, d.name, d.fields].some(v => sx(v).includes(q))).slice(0, 4).forEach(d => out.push({g:T('Słowniki'), k:d.id, l:hlq(T(d.name), q), s:d.fields, go:{t:'dict', id:d.id}}));
  RULES.filter(r => [r.id, r.name, r.scope].some(v => sx(v).includes(q))).slice(0, 4).forEach(r => out.push({g:T('Reguły'), k:r.id, l:hlq(T(r.name), q), s:T(r.scope), go:{t:'rule', id:r.id}}));
  return out;
}

/* ---------- akcje ---------- */
function curItem() { const k = $('#detail')._key; return k && C.byKey[k] ? C.byKey[k] : null; }
function itemRef(e) { return e.isAdd ? ['adds', e.docId] : ['fields', e.key]; }
function saveItem(e, patch) { const [c, id] = itemRef(e); return save(c, id, patch); }
function autoPatch(e, patch) {
  const p = Object.assign({}, patch);
  if ('st' in p) return p;
  if (p.conf) {
    const conf = Object.assign({}, e.conf, p.conf);
    const all = FIELD_PARTIES.every(k => conf[k] && conf[k].at);
    if (all && (e.st === 'Do omówienia' || e.st === 'W trakcie')) p.st = 'Potwierdzone';
    else if (!all && e.st === 'Potwierdzone') p.st = 'W trakcie';
    else if (e.st === 'Do omówienia') p.st = 'W trakcie';
  } else if (e.st === 'Do omówienia') p.st = 'W trakcie';
  return p;
}
function blurActive() { const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); }
function selectKey(key) {
  S.sel = key; S.adding = null; S.newIssue = null; S.delAsk = null; S.agreeAsk = null;
  const e = C.byKey[key];
  if (e) setHash(e.isAdd ? e.p : e.key);
  schedule();
}
function scrollRowIntoView(key) {
  requestAnimationFrame(() => requestAnimationFrame(() => { const r = document.querySelector(`.row[data-key="${CSS.escape(key)}"]`); if (r) r.scrollIntoView({block:'nearest'}); }));
}
function move(d) {
  const vis = visibleList(); if (!vis.length) return;
  blurActive();
  let i = vis.findIndex(x => x.key === S.sel);
  i = i < 0 ? 0 : Math.min(vis.length - 1, Math.max(0, i + d));
  selectKey(vis[i].key); scrollRowIntoView(vis[i].key);
}
function resetFilters() { S.q = ''; S.show = 'all'; S.wait = ''; S.pkgF = ''; S.xvF = ''; }
function openProc(pid) {
  if (!PBY[pid]) return;
  const changed = S.proc !== pid;
  S.view = 'proc'; S.proc = pid; S.signAsk = null; S.bulkAsk = null;
  if (S.adding && S.adding.p !== pid) S.adding = null;
  if (changed) { S.tab = 'pola'; resetFilters(); }
  S.sel = null;
  if (wideDetail()) { compute(); const v = visibleList(); S.sel = v.length ? v[0].key : null; }
  setHash(pid); schedule();
}
function openField(key, keepTab) {
  const it = C.byKey[key]; if (!it) return;
  S.view = 'proc';
  if (S.proc !== it.p) { S.proc = it.p; S.tab = 'pola'; resetFilters(); }
  else if (!keepTab && S.tab !== 'pola' && S.tab !== 'paczka' && S.tab !== 'kontrola' && S.tab !== 'spec') S.tab = 'pola';
  compute();
  if (!visibleList().some(x => x.key === key)) { resetFilters(); if (S.tab !== 'kontrola') S.tab = S.tab === 'paczka' && it.cov ? 'paczka' : S.tab === 'spec' && it.sp ? 'spec' : 'pola'; }
  selectKey(key); scrollRowIntoView(key);
}
function myParty() { return TEAM_PARTY[S.team] || null; }
async function createIssue(fields) {
  const nums = ISSUES.map(i => parseInt(i.id.slice(2), 10)).concat(Object.keys(S.ov.issues).filter(k => /^K-\d+$/.test(k)).map(k => parseInt(k.slice(2), 10)));
  let n = Math.max(0, ...nums) + 1, id = 'K-' + pad2(n);
  if (S.mode === 'shared') {
    for (let t = 0; t < 6; t++) { try { const snap = await Store.db.collection('issues').doc(id).get(); if (!snap.exists) break; } catch (e) { break; } n++; id = 'K-' + pad2(n); }
  }
  const ok = await save('issues', id, Object.assign({isNew:true, type:'Kwestia', status:'Otwarta', prio:'Średni', opened:today()}, stamp(), fields));
  return ok ? id : null;
}
function agreePatch(e, fmt) {
  const st = Object.assign(stamp(), {ws:true});
  const conf = {}; FIELD_PARTIES.forEach(k => { if (!(e.conf[k] && e.conf[k].at)) conf[k] = st; });
  const p = {st:'Potwierdzone', conf};
  if ((blank(e.suff) || e.suff === 'Do oceny') && !isGap(e)) p.suff = (!blank(e.tr) && !['Bez zmian', 'Do ustalenia', 'Filtr (nie przekazywać)'].includes(e.tr)) ? 'Wystarczające po transformacji' : 'Wystarczające';
  if (fmt) p.tgtFmt = fmt;
  return p;
}
function doAgree(e, fmt) {
  blurActive();
  S.agreeAsk = null; S.agreeFmt = null;
  saveItem(e, agreePatch(e, fmt));
  move(1);
}
function doSign(party) {

}
function copyText(txt, okMsg, fallbackEl) {
  const fallback = () => {
    const n = fallbackEl && document.getElementById(fallbackEl);
    if (n) { const r = document.createRange(); r.selectNodeContents(n); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); toast(T('Tekst zaznaczony – skopiuj go skrótem Ctrl+C.')); }
    else toast(txt);
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(okMsg), fallback); else fallback(); } catch (err) { fallback(); }
}
async function bulkFormats() {

async function act(btn, ev) {
  const a = btn.dataset.act;

  switch (a) {
    case 'proc': openProc(btn.dataset.p); break;
    case 'sel': selectKey(btn.dataset.key); break;
    case 'open': if (ev) ev.preventDefault(); openField(btn.dataset.key); break;
    case 'tab': S.tab = btn.dataset.tab; S.bulkAsk = null; if (S.tab === 'spec') { S.sel = null; S.adding = null; } schedule(); break;
    case 'showf': S.tab = 'pola'; S.show = S.show === btn.dataset.f && btn.dataset.f !== 'all' ? 'all' : btn.dataset.f; schedule(); break;
    case 'pkgf': S.tab = 'paczka'; S.pkgF = btn.dataset.f; schedule(); break;
    case 'xvf': S.tab = 'spec'; S.xvF = btn.dataset.f; schedule(); break;
    case 'xv': { const it = C.byKey[btn.dataset.key]; if (!it) break; const v = it.xv === btn.dataset.v ? '' : btn.dataset.v; const ok = saveItem(it, {xv:v, xvBy:v ? stamp() : null}); if (v === 'q') { if (S.sel !== it.key) selectKey(it.key); S.focusAfter = 'd-xvNote'; schedule(); } else if (v === 'ok' && S.tab === 'spec' && S.xvF === 'todo') ok.then(() => schedule()); break; }
    case 'copy-path': copyText(btn.dataset.path, T('Skopiowano ścieżkę XML.')); break;

    case 'prev': move(-1); break;
    case 'next': move(1); break;
    case 'close': S.sel = null; S.adding = null; schedule(); break;
    case 'conf': if (e) { const k = btn.dataset.party, c = e.conf[k]; saveItem(e, autoPatch(e, {conf:{[k]: c && c.at ? null : stamp()}})); } break;
    case 'st-dec': if (e) { saveItem(e, {st:'Wymaga decyzji'}); if (blank(e.dec)) S.focusAfter = 'd-dec'; } break;
    case 'agree': if (e) {
      const sim = Object.assign({}, e, agreePatch(e), {conf:{wd:{at:1}, mw:{at:1}, xp:{at:1}}});
      const after = checksOf(sim).filter(c => c.sev === 'e');

    case 'agree-yes': if (e) doAgree(e); break;

    case 'agree-no': { S.agreeAsk = null; const f = e && e.checks.find(c => c.sev !== 'i'); S.focusAfter = f ? CK_FIX(f) : null; schedule(); break; }

function trapFocus(ev) {

}
document.addEventListener('keydown', ev => {

  if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K')) { ev.preventDefault(); if (S.modal === 'search') closeModal(); else openPalette(); return; }

  }

  if (t && t.id === 'c-text' && ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); const b = document.querySelector('[data-act="c-add"]'); if (b) act(b, ev); return; }

function loadXLSX() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const srcs = (IN_VIEWER ? [] : ['vendor/xlsx.full.min.js']).concat(['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js']);
    const next = () => {
      const src = srcs.shift(); if (!src) return rej(new Error('load'));
      const s = document.createElement('script'); s.src = src;
      s.onload = () => window.XLSX ? res(window.XLSX) : next();
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

  const spx = [H(['ID pola', 'Proces', 'Ścieżka XML', 'Element PECI', 'Typ danych', 'Typ techniczny', 'Zapis w PECI', 'Długość w próbkach', 'Wartości w próbkach', 'Wartości zamaskowane', 'Wielokrotne', 'priorValue w próbkach', 'Atrybuty zmian w próbkach', 'Zdarzenia w próbkach', 'Scenariusze próbek', 'Zakres Chorus', 'Opis Chorus', 'Sekcja zawsze w pliku przy', 'Pole Xpertis', 'Format docelowy Xpertis', 'Ocena Xpertis', 'Pytanie Xpertis', 'Ocenił'])];
  C.all.filter(e => e.sp).forEach(e => {

function exportState() {
  const slug = (S.myName || S.team || 'stan').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const body = {app:'peci-xpertis-uzgodnienia', version:2, exportedAt:nowIso(), author:S.myName || '', team:S.team || '', data:S.ov};
  saveFile(`${PE('PECI_Xpertis_ustalenia', 'PECI_Xpertis_agreements')}_${ymd()}_${slug || 'stan'}.json`, new Blob([JSON.stringify(body)], {type:'application/json'}));
}
function newer(a, b) { const t = x => String((x && x.upd && x.upd.at) || (x && x.at) || ''); return t(b) > t(a); }
function mergeParties(a, b) { const o = Object.assign({}, a || {}); Object.keys(b || {}).forEach(k => { const x = o[k], y = b[k]; if (!x || (y && String(y.at || '') > String(x.at || ''))) o[k] = y; }); return o; }
function importState(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let body; try { body = JSON.parse(rd.result); } catch (e) { toast(T('To nie jest plik ustaleń (niepoprawny JSON).')); return; }
    if (!body || body.app !== 'peci-xpertis-uzgodnienia' || !isObj(body.data)) { toast(T('To nie jest plik ustaleń tego narzędzia.')); return; }
    let added = 0, updated = 0;
    COLS.forEach(c => {
      const inc = isObj(body.data[c]) ? body.data[c] : {}; const cur = Object.assign({}, S.ov[c]);
      Object.keys(inc).forEach(id => {
        const a = cur[id], b = inc[id]; if (!isObj(b)) return;
        if (!a) { cur[id] = b; added++; return; }
        const r = newer(a, b) ? merge(a, b) : merge(b, a);
        if (a.conf || b.conf) r.conf = mergeParties(a.conf, b.conf);
        if (a.sign || b.sign) r.sign = mergeParties(a.sign, b.sign);
        if (JSON.stringify(r) !== JSON.stringify(a)) { cur[id] = r; updated++; }
      });
      S.ov[c] = cur; Store.persist(c);
    });
    S.savedAt = new Date();
    toast(T('Wczytano ustalenia{from}. Nowe wpisy: {a}, zaktualizowane: {u}.', {from:body.author ? T(' od: {a}', {a:body.author}) : '', a:added, u:updated}));
    schedule();
  };
  rd.readAsText(file);
}

/* ---------- start ---------- */
function start(hot) {
  applyPrefs(); applyLang();
  if (hot && hot.proc && PBY[hot.proc]) Object.assign(S, {view:hot.view || 'proc', proc:hot.proc, sel:hot.sel || null, tab:hot.tab || 'pola'});
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) applyHash(h);
  else if (!S.sel && wideDetail()) { compute(); const v = visibleList(); S.sel = v.length ? v[0].key : null; }
  render();
  if (S.sel) scrollRowIntoView(S.sel);
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({view:S.view, proc:S.proc, sel:S.sel, tab:S.tab})); } catch (e) {}
  Promise.all([Store.use('db'), Store.use('user'), Store.use('downloads')]).then(async ([db, user, dl]) => {
    S.user = user; S.dl = dl;
    if (user) { try { const me = await user.me(); S.me = {id:me.id}; } catch (e) {} }
    if (db) {
      let cw = null; if (user) { try { cw = await user.can('data.write'); } catch (e) {} }
      S.canWrite = cw !== false;
      Store.startShared(db);
      if (cw === false) S.mode = 'readonly';
    } else { Store.startLocal(); S.canWrite = true; }
    if (!lsGet('welcomed')) S.modal = 'welcome';
    schedule();
  });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
